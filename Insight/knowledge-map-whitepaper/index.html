# 大模型推理 Knowledge Map

## 0. Knowledge Map 的组织原则

这套知识库的目标不是整理一份“大模型推理名词百科”，而是建立一个能够解释完整推理系统的知识结构：从一个模型为什么具有某种推理特征开始，沿着模型适配、Runtime、Operator、Kernel、分布式执行一路进入在线 Serving 和生产集群；与此同时，用 Correctness、Performance、Observability、Benchmark、Reliability、Capacity 等横向能力去观察这条执行链；最后再通过真实模型和硬件平台 Case，把抽象知识映射到 NVIDIA、Ascend 等实际工程体系中。

因此，整个知识体系可以概括成：

```text
                    大模型推理 Knowledge Map
                              │
             ┌────────────────┼────────────────┐
             │                │                │
        技术执行主干       横向工程能力       应用与案例
             │                │                │
        Model → Device     Correctness      Roles / Tasks
             ↓            Performance       Tools
        Distributed       Observability     Case Studies
             ↓            Benchmark
         Serving          Reliability
             ↓            Capacity / Cost
         Cluster

# Model → Device：从模型语义一直追踪到设备执行
# Correctness / Performance / Observability：正确性、性能与可观测性三类横向证据
# Roles / Tasks / Tools / Case Studies：面向角色任务、工具选择与真实案例的应用层
# Distributed / Serving / Cluster：分布式执行、在线服务与生产集群层级
```

知识库中的技术事实原则上优先使用模型官方资料、NVIDIA TensorRT-LLM / Triton、Ascend MindIE / CANN / HCCL 等官方文档以及原始论文作为依据。例如 TensorRT-LLM 当前官方架构已经明确包含 Model Engine、Scheduler、KV Cache Manager 等组件，并进一步提供 Paged KV Cache、Chunked Prefill 和 Disaggregated Serving；MindIE 2.3 则明确将模型能力、TP/DP/EP/CP/SP 等并行能力与 Continuous Batching、PageAttention 等 Serving 能力分开描述。这些公开架构也验证了本 Knowledge Map 将“模型执行”和“Serving”拆成不同层级的合理性。

---

# Part I｜技术执行主干

## 01. Scenario & Core Objects：先定义“我们到底在研究哪一次推理”

推理知识的入口不应该直接是 Transformer 或 Kernel，而应该首先建立 Scenario，因为任何性能数字都依赖上下文。同一个模型在不同输入长度、输出长度、并发、硬件、精度和 Serving 配置下，会表现出完全不同的计算、内存和通信特征。

一个完整的推理 Scenario 至少可以表达为：

```text
# 一次推理场景由以下四类上下文共同定义
Inference Scenario
=
# 模型版本、结构、规模、精度与上下文长度
Model
# 业务负载、输入输出长度、请求率与并发
× Workload
# 加速器型号、显存、服务器与互联拓扑
× Hardware
# 并行、批处理、KV Cache 与服务配置
× Configuration
```

其中 Model 描述模型版本、架构、参数规模、精度和 Context Length；Workload 描述 Chat、RAG、Summarization、Agent 等业务类型，以及 ISL、OSL、Request Rate、Concurrency 等负载特征；Hardware 描述 GPU/NPU 型号、显存、服务器和互联拓扑；Configuration 描述 TP、EP、DP、Batch、KV Cache、P/D 等运行参数。

在这个基础上建立统一对象模型，包括 Model、Request、Session、Run、Endpoint、Instance、ParallelGroup、Rank、Device、Batch、Token、KvPool、SchedulerIteration、Metric、Trace、Profile 和 Experiment。其中服务运行上下文的核心层级是 `Endpoint → Instance → ParallelGroup → Rank → Device`，Instance 下同时挂载 KvPool 与 SchedulerIteration 等运行状态。以后知识库中的任何性能结论，都应该能够回到这些对象上，而不是留下一个没有上下文的“tokens/s”。

---

## 02. Model Architecture & Inference Semantics：模型结构为什么会改变推理行为

这一部分研究的重点不是完整复述 Transformer，而是理解：

> **Model Architecture 如何决定 Compute、Memory 和 Communication。**

首先需要建立标准 Decoder-only Transformer 的推理结构，理解 Embedding、Attention、MLP、Residual、RMSNorm 和 LM Head 在一次 Forward 中分别处理什么数据；随后进入 Prefill 和 Decode，理解为什么自回归生成需要逐 token 运行，以及 KV Cache 为什么能够避免重复计算历史 token 的 K/V。

在 Attention 方向，需要建立 MHA → MQA → GQA → MLA 的演进关系，重点观察不同结构如何改变 KV representation、KV Cache footprint、Memory Bandwidth 和 Attention Kernel，而不能只停留在“有多少 Attention Heads”。

在 FFN 方向，需要建立 Dense → MoE 的演进关系。Dense 模型的 token 会执行完整 FFN，而 MoE 会经过 Router，只选择部分 Expert，因此需要同时理解 Total Parameters、Activated Parameters、Top-K Routing、Shared Expert、Routed Expert、Dispatch / Combine 和 Load Balance。

这一层最终应该形成一种能力：拿到一个公开模型的 `config.json`，就能开始判断它大致具有怎样的推理特征，而不需要等到 Profile 以后才知道发生了什么。

---

## 03. Inference Adaptation：训练模型如何成为可部署的推理模型

训练产物并不能天然等价于某个平台上已经优化好的推理程序，中间还存在一整层 Inference Adaptation。

典型链路可以表示为：

```text
# 原始模型资产：权重、配置与分词器
Checkpoint / Config / Tokenizer
             ↓
# 将模型定义和权重读入推理框架
        Model Loading
             ↓
# 转换权重格式与数据布局
Format / Weight Conversion
             ↓
# 选择部署精度并执行量化
Precision / Quantization
             ↓
# 调整张量布局并进行设备切分
Layout / Sharding
             ↓
# 替换或补齐目标平台不支持的算子
Unsupported Op Adaptation
             ↓
# 重写、优化并融合计算图
Graph Transformation / Fusion
             ↓
# 规划 TP、EP、DP 等并行策略
Parallel Planning
             ↓
# 生成可被运行时加载的模型或引擎
Executable Model / Engine
```

这一部分需要理解模型格式、权重转换、FP16/BF16/FP8/INT8/INT4 等精度形式、Quantization、Tensor Layout、Graph Rewrite、Operator Support 和硬件适配，同时区分“模型源码可以加载”“计算图可以编译”“模型可以正确执行”“模型精度达到要求”几个不同状态。

这一层也解释了为什么同一份开源模型，在 Transformers、TensorRT-LLM、vLLM、MindIE 等 Runtime 中最终看到的执行图和 Kernel 并不会完全相同。

---

## 04. Engine / Compiler / Runtime：谁把模型计算真正组织起来

这一层重点理解 Framework、Compiler、Inference Engine 和 Runtime 的职责边界。

可以建立如下抽象：

```text
# 用户或模型库中的模型定义
Model Definition
      ↓
# 提供建模、张量和自动微分抽象的框架
Framework
      ↓
# 用计算图或中间表示描述模型计算
Graph / IR
      ↓
# 优化、改写并编译计算图
Compiler / Graph Optimizer
      ↓
# 组织模型加载、调度与高性能推理
Inference Engine
      ↓
# 在运行时驱动算子、内存和设备任务
Runtime Executor
      ↓
# 最终承载计算的 GPU、NPU 等设备
Device
```

这里需要理解 Graph Capture、Operator Fusion、Kernel Selection、Memory Planning、Execution Plan，以及 Runtime 如何组织每一次 Forward。进一步进入 TensorRT-LLM、vLLM、MindIE 时，再观察不同系统如何实现这些抽象，而不是把某个框架自己的术语误认为通用推理原理。

NVIDIA 当前 TensorRT-LLM 的 PyExecutor 就明确拆成 Model Engine、Decoder、Scheduler、Resource Manager / KVCacheManager 等组件，其中 Scheduler 决定当前 step 哪些 Request 可以获得资源并执行 Model Forward，这说明 Engine 执行与在线请求调度实际上已经开始在 Runtime 层交汇。

---

## 05. Operator / Kernel / Hardware：一次模型计算最终怎样在设备上执行

这一部分沿着模型语义继续向底层拆解：

```text
# 模型语义层中的 Attention、MLP 等模块
Model Module
    ↓
# 计算图中的基础算子节点
Graph Operator
    ↓
# 多个算子融合后的执行单元
Fused Operator
    ↓
# 设备上实际启动的计算内核
Kernel
    ↓
# 内核发出的指令与数据读写行为
Instruction / Memory Access
    ↓
# GPU 或 NPU 中真正完成工作的执行单元
GPU / NPU Execution Unit
```

这里需要系统理解 Linear / MatMul、Attention、RMSNorm、Softmax、SiLU、MoE Grouped GEMM 等典型 Operator，以及一个 Framework Operator 为什么可能对应一个或多个 Kernel；同时理解 Fusion 为什么会让静态模型图里的 Operator 与 Profile 中看到的 Kernel 不再一一对应。

硬件层继续进入 Compute-bound / Memory-bound、Roofline、HBM、片上 Cache/SRAM、Ascend UB/L1、Tiling、Vectorization、Tensor Core / AI Core、Kernel Launch、Memory Access 和 Compute-Memory Overlap。

这一章最终要回答的问题不是“这个 Kernel 叫什么”，而是：

> **这段模型语义经过什么计算和数据搬运，最终为什么在当前硬件上快或慢。**

---

## 06. Distributed Model Execution：一个 Request 如何跨多个计算设备执行

当一个 Model Instance 由多个 GPU/NPU 协同执行时，就进入 Distributed Model Execution。

这一层首先需要严格区分各种 Parallelism 的计算语义，包括 Tensor Parallelism、Expert Parallelism、Data Parallelism、Context Parallelism、Sequence Parallelism，以及具体 Runtime 支持时的 Pipeline Parallelism。不同平台支持范围不能混为一谈，例如 MindIE 2.3 当前官方能力表支持 TP、DP、EP、CP 和 SP，而 PP 标记为不支持。

随后建立一条非常重要的关联链：

```text
# 决定模型按张量、专家、请求或序列切分
Parallel Strategy
        ↓
# 把张量或专家放置到具体 Rank
Tensor / Expert Placement
        ↓
# 定义切分后各 Rank 需要交换什么数据
Communication Semantics
        ↓
# 落实为集合通信或点对点传输
Collective / P2P
        ↓
# 确定参与一次通信的 Rank 集合
Communication Group
        ↓
# 将逻辑 Rank 映射到具体设备
Rank Mapping
        ↓
# 最终落到节点、链路和互联域
Physical Topology
```

TP 需要理解为什么 Tensor Sharding 会产生 AllReduce、AllGather、ReduceScatter 等通信；EP 需要理解 Router、Token Dispatch、All-to-All、Expert Computation、Combine 和 Expert Load Imbalance；DP 则主要研究不同 Request / Batch 如何分布到不同计算设备。MindIE 官方对 DP 的定义就是将 inference requests 划分到不同计算设备并行处理，并允许与 TP 组合，例如 `tp × dp = worldSize`。

这一章还必须系统解释 Rank、World Size、Parallel Group、Node、Server、SuperNode，以及 NVLink/NVSwitch、HCCS/RoCE 等物理通信域。Ascend HCCL 当前已经为 Atlas A3 推理产品明确列出 inter-SuperNode Collective Communication 支持，因此 SuperNode 应理解为重要的物理通信域，而不能简单理解成推理绝对不能跨越的边界。

---

## 07. Serving Runtime：从“执行模型”进入“调度请求”

进入这一层以后，问题从“模型怎么算”转变成：

> **大量 Request 到达之后，当前这个 step 应该计算哪些 Request。**

核心对象包括 Request Queue、Scheduler、Continuous Batching、Batch Formation、Paged KV Cache、Prefix Cache、Chunked Prefill、Preemption、Speculative Decoding 和 Sampling。

可以把 Serving Runtime 抽象为：

```text
# 等待被调度的在线请求集合
Request Queue
      ↓
# 每个执行步选择可运行的请求
   Scheduler
      ↓
# 动态合并不同请求当前可执行的 Token
Continuous Batch
      ↓
# 驱动一次模型 Forward 的执行主体
Model Executor
      ↕
# 分配、复用、迁移并回收 KV Cache Block
KV Cache Manager
      ↓
# 自回归地产生下一个 Token
   Decoder
```

KV Cache 在这一层已经不只是一个 Tensor，而成为需要动态分配、复用、回收甚至跨实例传输的系统资源。TensorRT-LLM 当前官方 KV Cache System 使用 Block Pool，根据 Request 动态分配 KV Blocks，并支持跨请求 reuse、offloading 和 prioritized eviction，这正是为什么 KV Cache 应该同时出现在“推理原理”和“Serving Runtime”两个层级。

---

## 08. Production / Distributed Serving：从一个 Model Instance 到在线推理系统

这一层讨论完整生产系统如何组织多个 Model Instance，并持续满足请求吞吐、延迟和稳定性目标。

在这个语境中，**Instance 是一套可以独立承载请求的完整推理服务单元**，也是比 Rank 更高一级的运行实体。它是逻辑服务副本，不应简单等同于一个操作系统进程：单卡 Instance 可能只有一个 Rank，而多卡 Instance 通常由多个 Rank / 进程共同组成。

对于同一个 Endpoint，生产系统可以启动多个加载相同模型的 Instance：

```text
# 用户访问的逻辑服务入口
Endpoint: ds32-chat
├─ Instance A
├─ Instance B
└─ Instance C
```

这些 Instance 通常各自维护请求队列、Scheduler 状态、SchedulerIteration、KvPool / KV Cache、Batch 状态与运行资源；Gateway / Router 则根据负载、健康状态和路由策略把请求送往其中一个 Instance。具体引擎也可能额外设置全局 Admission Control 或调度协调层，但它不替代 Instance 内对当前 Step 和 KV 资源的管理。

当模型需要多张 GPU / NPU 才能完成推理时，一个 Instance 会继续展开为：

```text
# 一套完整可工作的推理服务单元
Instance A
├─ KvPool
├─ SchedulerIteration
└─ ParallelGroup
   ├─ Rank 0 → Device 0
   ├─ Rank 1 → Device 1
   ├─ Rank 2 → Device 2
   └─ Rank 3 → Device 3
```

因此，Instance 表示完整服务单元；Rank 表示实例内参与分布式计算的一个进程或执行成员；Device 是 Rank 实际使用的 GPU / NPU。ParallelGroup 定义了参与某种 TP / EP 等并行或通信语义的 Rank 集合。

典型关系可以抽象为：

```text
# 持续进入系统的在线请求流
                  Request Stream
                        ↓
# 完成接入、路由与实例选择
                Gateway / Router
                        ↓
# 根据负载、健康和策略选择实例
              Routing / Admission
               ┌────────┼────────┐
               ↓        ↓        ↓
           Instance A Instance B Instance C
               ↓        ↓        ↓
        Distributed Model Execution

# Instance A / B / C：彼此可扩缩容和隔离故障的模型服务实例
# Distributed Model Execution：实例内部跨多个设备完成模型计算
```

从产品设计角度，Instance 应该是推理工作台的一级 Context。用户通常先问“Instance A 还能不能继续承载请求？”；当实例级 KV 压力、排队、吞吐或延迟异常时，再继续下钻到 ParallelGroup、Rank 和 Device，判断是整个 Instance 接近容量上限，还是某个 Rank / Device 发生局部异常。

这里需要区分 **Scale-up** 与 **Scale-out**：前者扩大一个 Model Instance 的模型并行域，例如增加 TP/EP 规模；后者增加 Instance / Replica，让更多独立请求能够并行处理。

Prefill / Decode Disaggregation 是这一层的重要专题。Prefill 计算 Prompt 并产生 KV Cache，Decode 利用已有 KV Cache 逐 token 生成；由于二者计算特征不同，可以被部署到不同计算资源池，并在两者之间传输 KV Cache。TensorRT-LLM 当前官方明确区分 Aggregated Serving 与 Disaggregated Serving，并允许 Context 与 Generation 使用不同 GPU 池和不同 Parallelism Configuration，从而分别优化 TTFT 与 TPOT。

这一章还需要覆盖 Request Routing、Load Balancing、Replica、Autoscaling、Admission Control、Multi-node Serving、Failure Isolation 和 Multi-tenant Serving。

---

## 09. Cluster / Topology / Infrastructure：生产推理最终运行在哪里

最后进入物理基础设施，把前面的逻辑结构映射到实际集群。

这一层需要理解 Device → Server → Node → SuperNode / NVLink Domain → Cluster 的层级，以及 PCIe、NVLink、NVSwitch、HCCS、RoCE、RDMA、Ethernet 等不同通信链路的性能和适用范围。

重点不是背硬件参数，而是理解：

```text
# TP、EP 等逻辑并行形成的 Rank 集合
Logical Parallel Group
        ↓
# 将逻辑 Rank 分配到具体设备位置
Rank Placement
        ↓
# 设备、节点和交换网络的真实连接关系
Physical Topology
        ↓
# 一次通信实际经过的链路
Communication Path
        ↓
# 路径的带宽、时延与资源争用
Bandwidth / Latency / Contention
        ↓
# 上述因素最终共同决定推理性能
Inference Performance
```

到这一层以后，才可以正确讨论“TP 是否跨服务器”“EP 是否跨 SuperNode”“增加并行规模还是增加 Replica”这类生产部署问题。

# Part II｜横向工程能力

技术执行主干描述“系统是怎样工作的”，但真正的推理工程还需要六条横向能力。这些能力都跨越多个技术层，因此不应该被塞进某一个执行章节。

## A. Correctness & Quality

这一轴建立：

```text
# 权重与配置能够被正确读取
Load Success
# 读取成功不等于计算图能够完成编译
≠ Compile Success
# 编译成功不等于运行时能够完成 Forward
≠ Runtime Success
# 能运行不等于输出数值满足误差要求
≠ Numerical Correctness
# 数值正确也不等于模型能力满足业务标准
≠ Model Quality Acceptable
```

需要覆盖 Reference Output、Tensor Comparison、Tolerance、NaN/Inf、Quantization Error、Layer-wise Error、End-to-End Evaluation 和 Model Quality Regression。最终回答的是：一次优化虽然更快，但结果是否仍然正确、模型能力是否仍然满足业务要求。

## B. Performance & Trade-off

这一轴建立统一性能语言，包括 TTFT、TPOT/ITL、E2E Latency、Request Throughput、Token Throughput、Goodput、Concurrency、MFU/Compute Utilization、Memory Bandwidth、Communication Ratio 和 P50/P95/P99 等指标。

更重要的是理解这些指标之间存在 Trade-off，例如提高 Batch 可能增加 Throughput，却恶化单请求延迟；扩大 EP 可能增加 Expert 并行能力，却引入更大的通信域；P/D 分离能够分别优化 Prefill 和 Decode，却产生 KV Transfer 成本。

## C. Observability & Evidence

这一轴区分 Monitoring、Logging、Tracing、Profiling 和 Hardware Counter，并建立从低开销长期观察到高开销深度诊断的证据层级。

最终形成：

```text
# 用户发起的一次推理请求
Request
  ↓
# 服务层的请求链路与阶段耗时
Serving Trace
  ↓
# 承载请求的执行实例与本次批处理
Instance / Batch
  ↓
# 分布式执行中的进程或执行成员
Rank
  ↓
# Rank 实际使用的 GPU / NPU
Device
  ↓
# 当前处于通信阶段还是计算阶段
Communication / Compute
  ↓
# 框架或计算图中的算子级执行
Operator
  ↓
# 设备上实际运行的计算内核
Kernel
  ↓
# 硬件计数器提供的底层性能证据
Hardware Counter
```

一个成熟的诊断系统应该允许从异常 Request 一路下钻到真正的执行根因，而不是把 Serving Dashboard 和 Kernel Profiler 做成两个完全割裂的工具。

## D. Benchmark & Experiment

这一轴负责回答“一个性能结论是否可信”。任何对比都需要控制 Model、Precision、Engine、Hardware、ISL、OSL、Batch/Concurrency、Request Rate、Sampling、Warm-up、Duration 等实验变量，并区分 Microbenchmark、Offline Benchmark、Controlled Serving Benchmark 和 Production Observation。

Performance Optimization 本质上是一种实验过程：

```text
# 对性能现象提出可验证的原因猜测
Hypothesis
    ↓
# 固定关键变量，只改变待验证因素
Controlled Experiment
    ↓
# 采集时延、吞吐、资源等指标
Measurement
    ↓
# 将测量结果整理为可复核证据
Evidence
    ↓
# 用证据定位真正的性能根因
Root Cause
    ↓
# 针对根因实施优化
Optimization
    ↓
# 验证优化没有引入性能、正确性或质量回退
Regression Validation
```

## E. Reliability & Operations

这一轴覆盖 Health Check、Failure Detection、Request Retry、Replica Failover、Node Failure、Network Failure、Graceful Degradation、Rolling Upgrade、Capacity Headroom、SLO/SLA 和 Incident Diagnosis。

生产推理的目标不是单次执行成功，而是在设备、网络和流量不断变化的情况下持续提供可预测服务。

## F. Capacity & Cost

这一轴必须拆成两个不同问题。

第一部分是 **Model Instance Sizing**：

```text
# 单个模型实例的显存或内存总占用
Instance Memory
=
# 模型权重常驻占用
Weights
# 随序列长度和并发变化的注意力缓存
+ KV Cache
# Runtime 和 Kernel 执行所需工作区
+ Runtime Workspace
# Forward 过程中产生的临时张量
+ Temporary Tensor
# 集合通信与点对点传输缓冲区
+ Communication Buffer
# 框架、上下文及内存碎片等额外开销
+ Runtime Overhead
```

这里研究参数量、Precision、Context Length、Batch、TP/EP 等变量怎样决定一个 Model Instance 的资源需求。

第二部分是 **Serving Capacity Planning**：

```text
# 线上流量规模
Traffic
# 请求长度、模型与业务类型等负载特征
× Workload
# 延迟、可用性与吞吐服务目标
× SLA
        ↓
# 根据业务目标计算所需系统吞吐
Required Throughput
        ↓
# 测量单实例在目标负载下的有效能力
Instance Performance
        ↓
# 推导所需副本数与资源池规模
Replica / Resource Pool
        ↓
# 汇总为集群容量与冗余需求
Cluster Capacity
        ↓
# 最终换算为单位请求或 Token 成本
Cost
```

因此，“模型实例需要多少设备”和“生产业务需要多少计算资源”必须始终作为两个独立问题。

---

# Part III｜产品与工程应用层

## 10. Roles / Tasks / Decisions

同一套推理系统，不同用户面对的问题不同，因此知识库应该继续映射到角色和任务。

模型开发者主要关心模型适配、精度和算子支持；推理性能工程师更关注 Operator、Kernel、Memory、Parallelism 和 Communication；Serving 工程师主要关注 Scheduler、KV Cache、Routing、P/D 和 Capacity；运维人员关注集群健康、SLA 和故障；UX/Product 则需要理解每种角色在什么问题出现时，需要做什么判断、查看什么证据以及执行什么操作。

因此产品设计最终关注的不是“如何展示更多指标”，而是：

> **用户正在做什么决策，当前缺少哪一层证据，下一步应该下钻到哪里。**

## 11. Tool Ecosystem

工具生态应该按照解决的问题分类，而不是简单罗列工具名称。

例如 NVIDIA TensorRT-LLM、vLLM、SGLang、Ascend MindIE 属于不同形态的 Inference Runtime / Serving Engine；NCCL/HCCL 属于 Communication Library；Nsight Systems、Nsight Compute、Ascend Profiling 等属于不同层级的性能分析工具；Dynamo 等则进一步处理分布式 Serving 和资源编排。

每个工具都应该映射回 Knowledge Map 中的层级，这样才能判断两个工具究竟是竞争关系、上下游关系，还是解决完全不同的问题。

---

# Part IV｜Case Study：用真实模型贯穿整套 Knowledge Map

知识库不应该为每个模型重复建立一套理论，而应该选择少量具有代表性的模型，让同一个 Case 在不同章节反复出现，逐渐增加复杂度。

## Case A｜Qwen3-32B：Dense 基础主 Case

Qwen3-32B 作为整套知识库的 **Dense Baseline**。官方模型卡显示其为 32.8B 参数、64 层，采用 GQA，Q Heads 为 64、KV Heads 为 8，因此结构足够典型，同时规模又适合用于解释实际推理部署。

它负责贯穿：

```text
# Decoder-only Transformer：稠密自回归模型的基础结构
Decoder-only Transformer
# GQA：多个 Query Head 共享较少的 KV Head
→ GQA
# Prefill / Decode：提示词并行处理与逐 Token 生成两个阶段
→ Prefill / Decode
# KV Cache：复用历史 Token 的 Key / Value 状态
→ KV Cache
# Dense MLP：每个 Token 都经过完整 FFN 参数路径
→ Dense MLP
# Operator / Kernel：从图算子下钻到设备执行内核
→ Operator / Kernel
# Quantization：用更低精度降低存储与计算成本
→ Quantization
# TP：沿张量维度把计算切分到多个设备
→ TP
# Serving Runtime：调度请求、Batch 与 KV Cache
→ Serving Runtime
# Benchmark：在受控条件下验证性能结论
→ Benchmark
# Capacity：将实例性能换算为资源与成本
→ Capacity
```

所有基础概念原则上先在 Qwen3-32B 上解释清楚，再进入大型 MoE。

---

## Case B｜DeepSeek V3.2：大型 MoE 工程主 Case

DeepSeek V3.2 负责承载 **大型 MoE + 复杂分布式推理**。官方配置可以直接观察到 61 个 Layer、256 个 Routed Experts、1 个 Shared Expert、每 token 激活 8 个 Routed Experts，同时包含 MLA 相关的低秩 KV 表示参数，因此能够把模型架构、内存优化、MoE Routing 和分布式通信同时串起来。

它负责贯穿：

```text
# MLA：用低秩潜表示压缩 Attention 的 KV 状态
MLA
# MoE：每个 Token 只激活部分专家网络
→ MoE
# Router / Top-K：为 Token 选择得分最高的专家
→ Router / Top-K
# Routed / Shared Expert：区分路由专家与共享专家
→ Routed / Shared Expert
# Active vs Total Parameters：区分单 Token 激活参数和模型总参数
→ Active vs Total Parameters
# EP：将不同专家放置到不同设备
→ EP
# Token Dispatch / Combine：发送 Token 到专家并汇总结果
→ Token Dispatch / Combine
# All-to-All：专家并行常见的全互换通信
→ All-to-All
# Expert Load Balance：避免少数专家或设备过载
→ Expert Load Balance
# Communication-Compute Overlap：用计算覆盖通信等待
→ Communication-Compute Overlap
# Multi-device / Multi-node：执行范围扩展到多卡与多机
→ Multi-device / Multi-node
# Production Serving：进入可扩展、可观测的生产服务
→ Production Serving
```

因此 Qwen3-32B 与 DeepSeek V3.2 的关系不是简单的“两种模型介绍”，而是从基础 Dense Inference 逐渐进入大型 MoE Distributed Inference。

---

## Case C｜Qwen3-32B vs Qwen3-235B-A22B：Dense → MoE 控制变量专题

如果要专门回答“MoE 相比 Dense 到底改变了什么”，不应该直接比较 Qwen 与 DeepSeek，因为两者除了 FFN 结构不同，Attention 等模型设计也不同。

因此增加一个控制变量 Case：

```text
# 稠密模型基线：所有 Token 执行完整 FFN，并使用 GQA
Qwen3-32B
Dense + GQA

        VS

# MoE 对照模型：Token 经过路由后只激活部分专家，并同样使用 GQA
Qwen3-235B-A22B
MoE + GQA
```

Qwen 官方给出的 Qwen3-235B-A22B 配置为 235B Total、22B Activated、94 层、128 Experts、每 token 激活 8 Experts，并且仍然采用 GQA。

这一组 Case 专门研究：

```text
# 起点：每个 Token 都执行完整的稠密 FFN
Dense MLP
   ↓
# 控制变量：仅将 FFN 结构替换为混合专家
改为 MoE
   ↓
# Router：决定每个 Token 应进入哪些专家
Router
# Expert Placement：把专家分配到具体 Rank 和设备
Expert Placement
# Active Parameters：单个 Token 实际参与计算的参数量
Active Parameters
# EP：按专家维度进行分布式切分
EP
# Dispatch / Combine：分发 Token 并合并专家输出
Dispatch / Combine
# Load Balance：观察专家和设备负载是否均衡
Load Balance
# Communication：评估 All-to-All 等新增通信成本
Communication
# Memory Distribution：观察权重、KV 与工作区的设备间分布
Memory Distribution
```

这样能够更干净地观察 **Dense FFN → MoE FFN** 对推理系统带来的变化。

# 最终 Knowledge Map

把所有部分压缩后，完整结构为：

```text
LLM Inference Knowledge Base

Ⅰ. 技术执行主干
│
├─ 01 Scenario & Core Objects
├─ 02 Model Architecture & Inference Semantics
├─ 03 Inference Adaptation
├─ 04 Engine / Compiler / Runtime
├─ 05 Operator / Kernel / Hardware
├─ 06 Distributed Model Execution
├─ 07 Serving Runtime
├─ 08 Production / Distributed Serving
└─ 09 Cluster / Topology / Infrastructure


Ⅱ. 横向工程能力
│
├─ A Correctness & Quality
├─ B Performance & Trade-off
├─ C Observability & Evidence
├─ D Benchmark & Experiment
├─ E Reliability & Operations
└─ F Capacity & Cost


Ⅲ. 产品与工程应用
│
├─ 10 Roles / Tasks / Decisions
└─ 11 Tool Ecosystem


Ⅳ. Case Study
│
├─ Case A：Qwen3-32B
│          Dense 基础主 Case
│
├─ Case B：DeepSeek V3.2
│          大型 MoE 工程主 Case
│
└─ Case C：Qwen3-32B vs Qwen3-235B-A22B
           Dense → MoE 控制变量 Case

# 技术执行主干：沿 Scenario → Model → Runtime → Device → Serving → Cluster 解释系统如何运行
# 横向工程能力：跨执行层验证正确性、性能、证据、实验、可靠性与成本
# 产品与工程应用：把技术证据映射到角色任务、工程决策和工具选择
# Case Study：用 Dense、MoE 及控制变量案例验证抽象知识
```

这套结构的关键价值在于，它同时保留了两种观察推理的方法：纵向可以沿着 **Model → Runtime → Kernel → Distributed Execution → Serving → Cluster** 追踪一次推理到底怎样执行；横向则可以从 **Correctness、Performance、Observability、Benchmark、Reliability、Capacity** 任一工程问题切入，跨越多个执行层寻找证据。

最终整个知识库应该能够回答三类不同问题：**“系统是怎么工作的”“系统为什么出现这个问题”“为了做出工程或产品决策，我应该观察什么证据”**。Case Study 则负责把这些抽象知识持续落到真实模型和真实硬件平台上，避免知识库最终退化成一套彼此孤立的术语解释。

.figure{border:0;border-top:1px solid #d8e0eb;border-bottom:1px solid #d8e0eb;border-radius:0;box-shadow:none;overflow:visible}
.figbar{padding:12px clamp(16px,2vw,28px);background:transparent;border-bottom:1px solid #e2e8f0}
.figbar>span:first-child{font-size:17px;line-height:1.35;font-weight:800}.figbar>span:first-child>.bi-zh{font-size:13px;font-weight:500}
.figure-intro{margin:0;padding:14px clamp(16px,2vw,28px);border-bottom:1px solid #e2e8f0;background:#f8fafc;color:#475569;font-size:14px;line-height:1.65}
.figbody{padding:24px clamp(16px,2vw,28px);overflow-x:auto;overflow-y:visible;scroll-padding-inline:clamp(16px,2vw,28px)}
.figcap{padding:14px clamp(16px,2vw,28px);border:0;background:transparent;font-size:14px;line-height:1.6}
.residual-section{min-width:960px;display:grid;gap:28px}
.residual-subsection{display:grid;gap:12px}
.residual-subsection h3{margin:0;color:#182033;font-size:18px;line-height:1.4}
.residual-subsection>p{margin:0;color:#475569;font-size:14px;line-height:1.7}
.residual-why{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.residual-why div,.residual-legend-item,.residual-explain-card{padding:16px;background:#f8fafc}
.residual-why b,.residual-legend-item b,.residual-explain-card h4{display:block;margin:0 0 6px;color:#334155;font-size:14px}
.residual-why span,.residual-legend-item span,.residual-explain-card p{color:#64748b;font-size:13px;line-height:1.6}
.residual-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.residual-legend-item b{display:flex;align-items:center;gap:8px}
.residual-swatch{width:12px;height:12px;border-radius:3px;background:#4f6bff;flex:0 0 auto}
.residual-swatch.skip{height:3px;border-radius:999px;background:#8ea2ff}
.residual-swatch.add{width:20px;height:20px;border:2px solid #5f7cff;border-radius:50%;display:grid;place-items:center;background:#fff;color:#4155c7;font-size:14px}
.residual-main{padding:18px;background:#f7f9fc;overflow-x:auto}
.residual-main img{display:block;width:100%;min-width:900px;height:auto}
.residual-explain{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.residual-explain-card svg{display:block;width:100%;height:auto;margin-top:12px}
.figcap-note{display:grid;gap:4px;margin-top:10px;padding:10px 12px;border-left:3px solid #cbd5e1;background:#f8fafc;color:#64748b;font-size:13px;line-height:1.6}
.figcap-note b{color:#334155}
.viz-legend,.viz-note{font-size:12px}.viz-title{font-size:13px}
.reading-path .index-item b,.reading-path .index-item small{font-size:12px}

/* Filled regions carry their own hierarchy; they do not also need outlines. */
.km-col,.scenario .factor,.attn-card,.stage,.parallel-card,.kv-state,.instance,
.scale-side,.replica,.poolbox,.trade-card,.state,.tool-lane,.model-detail,
.model-silhouette,.spec,.quality-step,.formula,.decision-box,.control-lane,
.runtime-layer,.mem-rail,.chip,.buffer,.unit,.infra-node div,.rolemap div,
.experiment span,.capacity-chain span,.propagation span,.final-spine span,
.svc-node,.arch-node,.arch-stack,.server,.device,.rank,.block,.gate,
.km-cross span,.km-case,.object-strip span,.stage .artifact,.control-lane .event,
.step-strip span,.infra-ladder div,.causal span,.final-band,.node,.card,.metric,
.map-lane,.compare-side,.expert,.trace-event{
  border:0 !important;
}
.km-cell,.control-lane .event,.infra-ladder div,.final-band,.residual-rail,
.callout,blockquote{border-left:0 !important}
.km-col,.scenario .factor,.attn-card,.parallel-card,.kv-state,.instance,
.scale-side,.trade-card,.tool-lane,.model-detail,.model-silhouette{
  border-radius:0;
  background:#f8fafc;
}
.stage{border-radius:0;background:#f8fafc}
.domain{border:0;border-top:2px solid #94a3b8;border-radius:0;background:transparent}
.case-rail{border:0;border-radius:0;box-shadow:none;background:#fffbeb}
.case-rail-item{border:0;background:rgba(255,255,255,.72)}
.object-strip span{border-radius:6px;background:#f1f5f9}
.attn-call{border-top-color:#d8e0eb}

/* 12px is the floor for readable diagram copy; 9–10px remains metadata only. */
.km-cross span,.km-case,.scenario-example-note,.object-strip span,
.object-strip span b,.object-strip span small,.arch-node,.arch-repeat,
.phase-label,.phase-bar,.kv-life,.attn-call,.stage b,.stage .artifact,.gate,
.control-lane .event,.runtime-layer,.step-strip span,.zoom-level,.mem-rail,
.buffer,.unit,.path-line,.parallel-card h4,.rank,.domain h4,.device,
.domain-link,.req,.kv-state h4,.svc-node,.instance h4,.kv-transfer,
.infra-ladder div,.infra-node div,.causal,.causal span,.quality-step,
.trade-card h4,.trace-label,.trace-event,.experiment span,.cycle span,
.state,.sumbar span,.capacity-chain span,.rolemap div,.tool-lane h4,
.tool-chip,.propagation span,.final-spine span,.final-band{
  font-size:12px;
  line-height:1.4;
}
.km-col h4,.km-cell,.scenario .factor strong,.attn-card h4,.viz-direct,
.stage b,.runtime-layer b,.parallel-card h4,.domain h4,.kv-state h4,
.instance h4,.scale-side h4,.trade-card h4,.tool-lane h4{
  font-size:13px;
}
.svg-label{font-size:12px}.svg-small{font-size:12px}.svg-strong{font-size:14px}
.coverage{font-size:12px}
.source-text .mb{white-space:normal;overflow-wrap:anywhere}
.source-text .code-grid{display:block}
.source-text .code-row{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(240px,1.2fr);gap:24px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.16);white-space:normal}
.source-text .code-term{color:#f1f5f9;font:650 15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.source-text .code-note{color:#9fb3c8;font:400 14px/1.65 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.source-text .code-line{display:block;min-height:1.2em;color:#c6d3e1;white-space:pre-wrap}
.source-text .code-spacer{display:block;height:10px}

/* Main diagram copy follows body-reading scale; compact metadata stays secondary. */
.km-cell .bi-en,.km-cross .bi-en,.km-case .bi-en,.arch-node,.arch-op,.stage,
.gate,.runtime-layer,.zoom-level,.parallel-card,.rank,.domain-link,.req,
.kv-state,.svc-node,.instance,.infra-ladder div,.infra-node div,.quality-step,
.trade-card,.state,.formula,.rolemap div,.tool-chip,.propagation span,
.final-spine span,.final-band,.node,.card,.metric,.map-lane,.compare-side,
.trace-label,.trace-event,.experiment span,.cycle span,.capacity-chain span,
.scenario .factor,.object-strip span b,.phase-label,.phase-bar,.kv-life,
.control-lane .event,.step-strip span,.mem-rail,.buffer,.unit,.path-line,
.device,.kv-transfer,.causal span,.serving-map,.scale-side,.replica,.poolbox{
  font-size:15px;
  line-height:1.5;
}
.km-col h4,.viz-title,.attn-card h4,.stage b,.runtime-layer b,.parallel-card h4,
.domain h4,.kv-state h4,.instance h4,.scale-side h4,.trade-card h4,
.tool-lane h4,.formula h4{font-size:16px}
.km-cell .bi-zh,.km-cross .bi-zh,.km-case .bi-zh,.viz-note,.viz-legend,
.stage .artifact,.object-strip span small,.spec small{font-size:13px;line-height:1.5}
.svg-label,.svg-small{font-size:14px}.svg-strong{font-size:16px}

@media(max-width:760px){
  .figbody{padding:18px 14px;scroll-padding-inline:14px}.figbar{padding-inline:14px}.figcap{padding-inline:14px}.figure{margin:20px 0}
  .km,.scenario,.object-strip,.arch,.attn-grid,.stagegate,.runtime,.zoom-stack,
  .memory-map,.parallel-grid,.kv-board,.serving-map,.scale-board,.pd-board,
  .infra,.quality,.trade-grid,.experiment,.cycle,.reliability,.capacity,
  .rolemap,.tool-landscape,.model-card,.control-compare,.final-map{
    min-width:0;
  }
  .km,.runtime,.memory-map,.scale-board,.infra,.capacity,.model-card,
  .control-compare,.final-map{grid-template-columns:1fr}
  .scenario{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto}
  .scenario .core{grid-column:1/-1;grid-row:1;justify-self:center;width:170px}
  .object-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .object-strip i{display:none}
  .source-text .code-row{grid-template-columns:1fr;gap:4px;padding:12px 0}
  .arch{grid-template-columns:1fr}.arch-lane{display:grid;grid-template-columns:repeat(2,1fr)}
  .attn-grid,.parallel-grid,.kv-board,.quality,.reliability{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stagegate{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:not(:last-child)::after{display:none}
  .zoom-stack{grid-template-columns:repeat(2,minmax(0,1fr))}
  .instance-row,.trade-grid,.tool-landscape{grid-template-columns:1fr}
  .pd-board{grid-template-columns:1fr}.kv-transfer{padding:8px 0}
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rolemap{grid-template-columns:110px 1fr 1fr}
  .final-spine{grid-template-columns:repeat(2,minmax(0,1fr))}
  .experiment{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cycle{flex-wrap:wrap}.cycle span{flex:1 1 28%}
  .trade-svg{min-width:0}
  .case-rail-track{grid-template-columns:1fr}
  /* Timeline, matrix and physical topology retain intentional horizontal scroll. */
  .phase-board,.batch-board,.trace,.coverage,.topology-map{min-width:760px}
}

id-row:7"></span><div class="tf-cell tf-op tf-core" style="grid-row:7">${t('MLP / MoE FFN','MLP / 混合专家前馈网络')}</div><div class="tf-cell tf-op tf-residual" style="grid-row:8">${t('Residual Add ↩','残差相加 ↩')}</div><div class="tf-flow-note" style="grid-row:9"><b>↓</b>hidden · 隐状态</div><div class="tf-cell tf-param" style="grid-row:10">${t('Final Norm W','最终归一化权重')}</div><span class="tf-link left" style="grid-row:10"></span><div class="tf-cell tf-op" style="grid-row:10">${t('Final Norm','最终归一化')}</div><div class="tf-cell tf-param" style="grid-row:11">${t('LM Head W','语言模型头权重')}</div><span class="tf-link left" style="grid-row:11"></span><div class="tf-cell tf-op" style="grid-row:11">${t('LM Head','语言模型头')}</div><div class="tf-logits" style="grid-row:12">↓<br>LOGITS · 输出分数</div></div><div class="tf-relations"><div class="tf-relation"><b>左侧 → 中间</b>每条连线表示该算子读取哪组持久化参数。</div><div class="tf-relation"><b>中间 ↓</b>主轴表示一次 Token / Tensor Forward 的执行顺序。</div><div class="tf-relation"><b>中间 ↔ 右侧</b>Attention 读取历史 KV，并把当前 Token 的 K/V 追加到缓存。</div></div></div><p class="viz-note"><span class="viz-direct">读图：</span>先沿中间主轴从上到下理解一次 Forward；向左看当前算子使用的模型参数，向右看跨 Token 保留并在后续 Step 复用的运行时状态。</p>`};
const transformerPhaseIntroHTML=()=>`<div class="tf-term-note"><b>先区分两个“Decoder”：</b>Decoder-only 描述模型架构只有 Transformer Decoder 堆栈，不等于模型只执行 Decode 阶段。Prefill 和 Decode 都会调用下方同一套模型参数与 Forward 主干。</div><div class="tf-execution-modes"><div class="tf-mode"><b>① Prefill · 处理 Prompt</b>多个 Prompt Token 进入同一条主干，计算并创建各层 KV Cache。</div><div class="tf-mode-link">共同调用 Decoder-only Transformer<br>↓ 下方结构不是两个阶段中的某一段</div><div class="tf-mode decode"><b>② Decode · 逐 Token 生成</b>每一步把最新 Token 送入同一条主干，读取并追加 KV Cache。</div></div>`;
const residualArchitectureHTML=()=>`<div class="residual-section">
  <section class="residual-subsection" aria-labelledby="residual-why-title">
    <h3 id="residual-why-title">为什么需要残差连接</h3>
    <p>随着 Transformer 层数增加，如果每一层都只能用新的非线性变换完全替换上一层表示，原始信息和梯度都必须连续穿过整条深层计算链。残差连接为 hidden state 建立一条跨越子层的直接通路，使网络学习“在现有表示上增加什么”，而不是每层都重新构造全部表示。</p>
    <div class="residual-why">
      <div><b>保留原始信息</b><span>输入 x 可以绕过 MLA 或 FFN / MoE，并与子层计算结果重新汇合，避免有用信息在深层变换中被完全覆盖。</span></div>
      <div><b>改善深层优化</b><span>恒等旁路为梯度传播提供更直接的路径，降低深层网络训练中的退化风险，使新增层可以从接近恒等映射的状态开始学习。</span></div>
      <div><b>支持增量更新</b><span>子层只需学习残差项 F(Norm(x))；输出通过 x′ = x + F(Norm(x)) 得到，从而把每个 Block 表达为对当前 hidden state 的增量修正。</span></div>
    </div>
  </section>
  <section class="residual-subsection" aria-labelledby="residual-legend-title">
    <h3 id="residual-legend-title">图例</h3>
    <div class="residual-legend">
      <div class="residual-legend-item"><b><i class="residual-swatch"></i>主干 Hidden State / x</b><span>在层内与层间持续传递、不断更新的 token hidden states，通常记作 [B, T, H]。</span></div>
      <div class="residual-legend-item"><b><i class="residual-swatch skip"></i>残差分支 / Skip Connection</b><span>从当前 x 分叉并绕过 MLA 或 FFN / MoE，在输出端保留原始输入。</span></div>
      <div class="residual-legend-item"><b><i class="residual-swatch add">+</i>残差相加 / Residual Add</b><span>将旁路输入 x 与子层输出 F(Norm(x)) 逐元素相加，形成更新后的 hidden state。</span></div>
    </div>
  </section>
  <section class="residual-subsection" aria-labelledby="residual-main-title">
    <h3 id="residual-main-title">DeepSeek V3.2 的残差主干</h3>
    <p>Token Embedding 产生初始 hidden state 后，每层依次执行 MLA 残差更新和 FFN / MoE 残差更新。Layer 0–2 使用 Dense FFN，Layer 3–60 使用 MoE；两种计算分支都写回同一条连续的 residual stream。</p>
    <div class="residual-main"><img src="./ds32_residual_architecture_main.svg" alt="DeepSeek V3.2 从 Token Embedding 经 61 层 Transformer 到 LM Head 的残差连接架构"></div>
  </section>
  <section class="residual-subsection" aria-labelledby="residual-mechanism-title">
    <h3 id="residual-mechanism-title">残差连接机制</h3>
    <div class="residual-explain">
      <div class="residual-explain-card"><h4>标准残差连接</h4><p>当前 hidden state 一路进入归一化与计算模块，另一路作为 skip connection 绕过该模块；两路在输出端相加，得到下一状态。</p><svg viewBox="0 0 520 130" role="img" aria-label="标准残差连接示意"><circle cx="30" cy="66" r="5" fill="#4f6bff"/><text x="20" y="45" fill="#182230" font-size="14" font-weight="700">x</text><line x1="30" y1="66" x2="118" y2="66" stroke="#4f6bff" stroke-width="5"/><rect x="118" y="40" width="120" height="52" rx="10" fill="#b9eef7" stroke="#69d3e7"/><text x="178" y="71" text-anchor="middle" fill="#174a55" font-size="14" font-weight="800">F(Norm(x))</text><line x1="238" y1="66" x2="308" y2="66" stroke="#4f6bff" stroke-width="5"/><circle cx="330" cy="66" r="19" fill="#fff" stroke="#5f7cff" stroke-width="2.5"/><text x="330" y="74" text-anchor="middle" fill="#4155c7" font-size="27">+</text><path d="M30 66V20H330V47" fill="none" stroke="#8ea2ff" stroke-width="2.5"/><line x1="349" y1="66" x2="405" y2="66" stroke="#4f6bff" stroke-width="5"/><text x="417" y="71" fill="#475569" font-size="13">x′</text></svg></div>
      <div class="residual-explain-card"><h4>mHC 对连接方式的扩展</h4><p>mHC 改变 residual stream 在 MLA / MoE 外部的读入与写回方式：多条流先经过读混合进入计算模块，再经写混合返回多条流；MLA / MoE 本身的计算逻辑保持不变。</p><svg viewBox="0 0 520 150" role="img" aria-label="mHC 读混合与写混合示意"><g stroke-width="4"><line x1="20" y1="45" x2="118" y2="45" stroke="#5f7cff"/><line x1="20" y1="75" x2="118" y2="75" stroke="#7890ff"/><line x1="20" y1="105" x2="118" y2="105" stroke="#91a3ff"/></g><path d="M118 45L148 72M118 75H148M118 105L148 78" fill="none" stroke="#38bfae" stroke-width="2.5"/><circle cx="158" cy="75" r="10" fill="#38d9c3"/><text x="158" y="28" text-anchor="middle" fill="#178e80" font-size="13" font-weight="700">读混合</text><line x1="168" y1="75" x2="205" y2="75" stroke="#38bfae" stroke-width="2.5"/><rect x="205" y="47" width="120" height="56" rx="10" fill="#b9eef7" stroke="#69d3e7"/><text x="265" y="80" text-anchor="middle" fill="#174a55" font-size="14" font-weight="800">MLA / MoE</text><line x1="325" y1="75" x2="356" y2="75" stroke="#38bfae" stroke-width="2.5"/><circle cx="366" cy="75" r="10" fill="#38d9c3"/><text x="366" y="28" text-anchor="middle" fill="#178e80" font-size="13" font-weight="700">写混合</text><path d="M376 75L406 45M376 75H406M376 75L406 105" fill="none" stroke="#38bfae" stroke-width="2.5"/><g stroke-width="4"><line x1="406" y1="45" x2="500" y2="45" stroke="#5f7cff"/><line x1="406" y1="75" x2="500" y2="75" stroke="#7890ff"/><line x1="406" y1="105" x2="500" y2="105" stroke="#91a3ff"/></g></svg></div>
    </div>
  </section>
</div>`;

"FIG-02A":[["TTFT（Time to First Token）","从请求发出到首个输出 Token 返回的时间，越低表示首次响应越快。"],["TPOT（Time per Output Token）","首个 Token 之后，平均生成每个输出 Token 所需的时间，越低表示持续生成越流畅。"],["Throughput（吞吐量）","单位时间内系统处理的请求数或生成的 Token 数，越高表示整体处理能力越强。"],["Memory（运行时内存 / 显存）","该 Run 执行期间占用的设备内存，主要包括模型权重、KV Cache、激活值、临时工作区和通信缓冲区；通常同时关注稳态占用与峰值占用。"]],
"FIG-04A":[["Prefill（输入处理 / 预填充阶段）","用户提交 Prompt 后，模型在因果注意力约束下并行处理其中的 Token，逐层计算并保存每个 Token 的 Key / Value 到 KV Cache，最后得到生成第一个 Token 所需的状态。Prompt 越长，这一阶段的计算量通常越大，并直接影响 TTFT。"],["Decode（自回归生成阶段）","Prefill 完成后，模型每一步只输入最新生成的一个 Token，读取已有 KV Cache 与历史内容做注意力计算，预测下一个 Token，再把新 Token 的 Key / Value 追加到缓存。这个循环持续到遇到停止条件，并直接影响 TPOT。"],["为什么两阶段不同","Prefill 能同时处理 Prompt 中的多个位置，更容易发挥并行计算能力；Decode 的前后步骤存在依赖，只能逐步生成，并且每一步都要读取权重和不断增长的 KV Cache，因此通常更容易受到内存带宽限制。"]],
"FIG-05B":[["MHA（Multi-Head Attention，多头注意力）","每个 Query Head 都拥有独立的 Key / Value Head，表达能力充分，但 KV Cache 与读取带宽开销最大。"],["MQA（Multi-Query Attention，多查询注意力）","所有 Query Head 共享同一组 Key / Value Head，能显著压缩 KV Cache，但共享程度最高。"],["GQA（Grouped-Query Attention，分组查询注意力）","把 Query Head 分成若干组，每组共享一组 Key / Value Head，在模型表达能力与 KV Cache 成本之间折中。"],["MLA（Multi-head Latent Attention，多头潜在注意力）","先把 Key / Value 信息压缩为低维潜在表示，推理时复用或重建所需信息，从而进一步降低 KV Cache 与内存带宽压力；它不只是简单减少 KV Head 数。"]],
"FIG-07A":[["Step（运行时执行步）","在线推理引擎的一次调度与执行闭环；一个 Step 可以同时包含多个请求，也可以混合 Decode Token 与 Prefill Chunk。"],["泳道读法","从左到右读时间阶段，从上到下观察同一阶段中 Request、Scheduler、KV、Model Engine 与 Sampling 各自做什么。"]],
"FIG-07B":[["控制面","每个 Step 动态决定哪些请求运行、分配哪些资源，并生成 Batch 与 KV Block 地址。"],["执行面","复用构建期生成的 Engine / Execution Plan，在 Runtime Executor 与 Device 上完成本次 Forward。"],["交汇点","Current Step Plan 在 Runtime Executor / Model Engine 处进入静态执行栈；Logits 和请求状态随后返回控制面，形成下一 Step。"]]
