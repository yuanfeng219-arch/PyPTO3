<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">人、Agent 与 Toolkit 的协作关系</title>
  <desc id="desc">人设定目标并验收，Agent 组织开发任务，Toolkit 执行验证并提供证据，结果返回 Agent 和人形成闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#62728b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#5277d8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8061c7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#26354d" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1440" height="760" fill="#f5f7fb"/>
  <text x="720" y="94" text-anchor="middle" fill="#17243a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700">算子开发中的三方协作</text>
  <text x="720" y="137" text-anchor="middle" fill="#66748a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">人定目标 · Agent 推进任务 · Toolkit 执行并提供证据</text>

  <!-- Human -->
  <g filter="url(#shadow)">
    <rect x="90" y="250" width="320" height="250" rx="22" fill="#ffffff" stroke="#dce5f8" stroke-width="2"/>
    <rect x="90" y="250" width="320" height="9" rx="4.5" fill="#5277d8"/>
  </g>
  <circle cx="145" cy="314" r="23" fill="#eaf0ff"/>
  <path d="M145 301a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-16 31c2-8 8-12 16-12s14 4 16 12" fill="none" stroke="#5277d8" stroke-width="3" stroke-linecap="round"/>
  <text x="184" y="322" fill="#17243a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">人</text>
  <text x="125" y="384" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">设定目标与约束</text>
  <text x="125" y="423" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">判断取舍，验收结果</text>
  <text x="125" y="466" fill="#7c899c" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="15">目标所有者 · 最终决策者</text>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="560" y="250" width="320" height="250" rx="22" fill="#ffffff" stroke="#e7ddf8" stroke-width="2"/>
    <rect x="560" y="250" width="320" height="9" rx="4.5" fill="#8061c7"/>
  </g>
  <circle cx="615" cy="314" r="23" fill="#f1ebfb"/>
  <path d="M603 307h24v16h-24zM610 302h10M615 323v7m-8 0h16" fill="none" stroke="#8061c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="654" y="322" fill="#17243a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">Agent</text>
  <text x="595" y="384" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">理解任务，编排开发</text>
  <text x="595" y="423" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">修改代码，依据结果迭代</text>
  <text x="595" y="466" fill="#7c899c" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="15">工程协作者 · 工作流组织者</text>

  <!-- Toolkit -->
  <g filter="url(#shadow)">
    <rect x="1030" y="250" width="320" height="250" rx="22" fill="#ffffff" stroke="#d7eee9" stroke-width="2"/>
    <rect x="1030" y="250" width="320" height="9" rx="4.5" fill="#298f82"/>
  </g>
  <circle cx="1085" cy="314" r="23" fill="#e5f5f1"/>
  <path d="M1073 307l12-7 12 7v14l-12 7-12-7zM1073 307l12 7 12-7m-12 7v14" fill="none" stroke="#298f82" stroke-width="2.3" stroke-linejoin="round"/>
  <text x="1124" y="322" fill="#17243a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">Toolkit</text>
  <text x="1065" y="384" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">编译、验证、运行与测量</text>
  <text x="1065" y="423" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="19">生成可追溯的工程证据</text>
  <text x="1065" y="466" fill="#7c899c" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="15">确定性执行层 · 事实与证据来源</text>

  <!-- Human <-> Agent -->
  <path d="M420 326 H548" fill="none" stroke="#5277d8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="430" y="285" width="110" height="28" rx="14" fill="#f5f7fb"/>
  <text x="485" y="304" text-anchor="middle" fill="#5277d8" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">目标 / 约束</text>
  <path d="M550 435 H422" fill="none" stroke="#62728b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="429" y="446" width="112" height="27" rx="13.5" fill="#f5f7fb"/>
  <text x="485" y="465" text-anchor="middle" fill="#62728b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="14">Diff / 结论</text>

  <!-- Agent <-> Toolkit -->
  <path d="M890 326 H1018" fill="none" stroke="#8061c7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="897" y="285" width="114" height="28" rx="14" fill="#f5f7fb"/>
  <text x="954" y="304" text-anchor="middle" fill="#8061c7" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">执行请求</text>
  <path d="M1020 435 H892" fill="none" stroke="#62728b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="896" y="446" width="118" height="27" rx="13.5" fill="#f5f7fb"/>
  <text x="955" y="465" text-anchor="middle" fill="#62728b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="14">结果 / 证据</text>

  <rect x="386" y="590" width="668" height="70" rx="35" fill="#e9edf5"/>
  <text x="720" y="634" text-anchor="middle" fill="#34445d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">人做关键决策，Agent 按证据推进，Toolkit 保证过程可验证</text>
</svg>
