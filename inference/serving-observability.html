<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serving Observability Workspace</title>
  <style>
    :root {
      --so-accent: #a7e8d1;
      --so-accent-strong: #64d6b0;
      --so-warm: #f2c98d;
      --so-danger: #ef9b9b;
      --so-muted: #9aa4b2;
      --so-panel: rgba(255,255,255,.035);
      --so-panel-strong: rgba(255,255,255,.065);
    }

    body { min-width: 1180px; }
    .so-shell { height: 100vh; min-height: 720px; }
    .so-topbar-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .so-topbar-title strong { white-space: nowrap; }
    .so-topbar-title span { color: var(--so-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .so-breadcrumb { color: var(--so-muted); font-size: 12px; margin-left: 8px; }
    .so-pane { min-width: 0; min-height: 0; overflow: auto; }
    .so-explorer { padding: 14px 12px; background: rgba(11,15,22,.35); }
    .so-editor { background: #111720; }
    .so-inspector { padding: 14px 14px 20px; background: rgba(12,17,24,.38); }
    .so-pane-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 12px; }
    .so-pane-heading h2, .so-section-title h2 { font-size: 14px; margin: 0; font-weight: 650; }
    .so-eyebrow { color: var(--so-muted); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
    .so-nav-group { margin: 14px 0 20px; }
    .so-nav-group-title { color: var(--so-muted); font-size: 11px; padding: 0 8px 6px; }
    .so-nav-item, .so-nav-child { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: transparent; color: #d9e1ea; text-align: left; border-radius: 6px; cursor: pointer; }
    .so-nav-item { padding: 8px; font-size: 13px; }
    .so-nav-child { padding: 7px 8px 7px 28px; color: #b9c3cf; font-size: 12px; }
    .so-nav-item:hover, .so-nav-child:hover { background: rgba(255,255,255,.06); }
    .so-nav-item.is-active, .so-nav-child.is-active { color: var(--so-accent); background: rgba(100,214,176,.11); }
    .so-nav-count { color: var(--so-muted); font-size: 11px; }
    .so-context-card { margin-top: auto; border-top: 1px solid rgba(255,255,255,.1); padding: 14px 6px 0; }
    .so-context-name { font-size: 12px; font-weight: 650; margin: 5px 0 4px; }
    .so-context-meta { color: var(--so-muted); font-size: 11px; line-height: 1.55; }
    .so-content { padding: 22px 24px 30px; }
    .so-content-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .so-content-header h1 { font-size: 23px; letter-spacing: -.02em; margin: 2px 0 6px; }
    .so-content-header p { color: var(--so-muted); margin: 0; font-size: 13px; }
    .so-header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .so-button { border: 1px solid rgba(255,255,255,.14); color: #e7edf4; background: rgba(255,255,255,.045); border-radius: 6px; padding: 7px 11px; font: inherit; font-size: 12px; cursor: pointer; }
    .so-button:hover { border-color: rgba(167,232,209,.55); background: rgba(167,232,209,.08); }
    .so-button.primary { background: var(--so-accent); border-color: var(--so-accent); color: #0b1715; font-weight: 650; }
    .so-button.ghost { border-color: transparent; background: transparent; color: var(--so-muted); }
    .so-button:disabled { opacity: .45; cursor: not-allowed; }
    .so-tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 20px; }
    .so-context-bar { display: grid; grid-template-columns: minmax(220px, 1.35fr) minmax(180px, .9fr) minmax(220px, 1.1fr) auto; align-items: end; gap: 10px; padding: 10px 12px; margin: -6px 0 16px; border: 1px solid var(--border-default); border-radius: 7px; background: var(--surface-1); }
    .so-context-field label { display: block; color: var(--foreground-muted); font-size: 11px; margin-bottom: 5px; }
    .so-context-bar .so-button { white-space: nowrap; }
    .so-tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--so-muted); padding: 9px 14px 10px; cursor: pointer; font-size: 12px; }
    .so-tab:hover { color: #e7edf4; }
    .so-tab.is-active { color: var(--so-accent); border-bottom-color: var(--so-accent); }
    .so-grid { display: grid; gap: 12px; }
    .so-grid.metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .so-grid.two { grid-template-columns: minmax(0, 1.4fr) minmax(300px, .8fr); }
    .so-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .so-card { background: var(--so-panel); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; }
    .so-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 15px 10px; }
    .so-card-head h3 { font-size: 13px; margin: 0; }
    .so-card-body { padding: 0 15px 15px; }
    .so-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .so-metric-label { color: var(--so-muted); font-size: 11px; }
    .so-metric-value { font-size: 24px; letter-spacing: -.04em; margin-top: 6px; }
    .so-metric-delta { color: var(--so-accent); font-size: 11px; margin-top: 7px; }
    .so-metric-delta.warn { color: var(--so-warm); }
    .so-metric-delta.muted { color: var(--so-muted); }
    .so-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; white-space: nowrap; }
    .so-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .so-status.success { color: var(--so-accent-strong); }
    .so-status.warn { color: var(--so-warm); }
    .so-status.danger { color: var(--so-danger); }
    .so-status.neutral { color: var(--so-muted); }
    .so-pill { display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; color: var(--so-muted); padding: 3px 7px; font-size: 10px; white-space: nowrap; }
    .so-pill.accent { color: var(--so-accent); border-color: rgba(167,232,209,.35); }
    .so-pill.warm { color: var(--so-warm); border-color: rgba(242,201,141,.35); }
    .so-kv { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 8px 12px; font-size: 12px; }
    .so-kv dt { color: var(--so-muted); }
    .so-kv dd { margin: 0; color: #dce4ec; min-width: 0; overflow-wrap: anywhere; }
    .so-divider { height: 1px; background: rgba(255,255,255,.1); margin: 14px 0; }
    .so-bar { height: 5px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
    .so-bar > span { display: block; height: 100%; background: var(--so-accent-strong); border-radius: inherit; }
    .so-timeline { display: grid; gap: 10px; }
    .so-timeline-row { display: grid; grid-template-columns: 132px minmax(0,1fr) 78px; align-items: center; gap: 10px; font-size: 12px; }
    .so-timeline-label { color: #d9e1ea; }
    .so-timeline-time { color: var(--so-muted); text-align: right; font-variant-numeric: tabular-nums; }
    .so-findings { display: grid; gap: 9px; }
    .so-finding { padding: 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 7px; background: rgba(255,255,255,.022); }
    .so-finding:hover { border-color: rgba(167,232,209,.42); }
    .so-finding-title { font-size: 12px; font-weight: 650; line-height: 1.45; }
    .so-finding-summary { color: var(--so-muted); font-size: 11px; line-height: 1.5; margin-top: 5px; }
    .so-finding-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .so-link { color: var(--so-accent); background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 11px; }
    .so-table-wrap { overflow: auto; }
    .so-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 760px; }
    .so-table th { color: var(--so-muted); font-size: 11px; font-weight: 500; text-align: left; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.12); white-space: nowrap; }
    .so-table td { padding: 11px 10px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: middle; white-space: nowrap; }
    .so-table tr[data-request-id], .so-table tr[data-event-id] { cursor: pointer; }
    .so-table tr:hover td { background: rgba(167,232,209,.05); }
    .so-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .so-select, .so-input { width: 100%; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.18); color: #e7edf4; border-radius: 5px; padding: 8px 9px; font: inherit; font-size: 12px; }
    .so-select:focus, .so-input:focus { outline: 1px solid var(--so-accent-strong); }
    .so-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .so-field label { display: block; color: var(--so-muted); font-size: 11px; margin-bottom: 5px; }
    .so-field small { display: block; color: var(--so-muted); font-size: 10px; margin-top: 4px; line-height: 1.4; }
    .so-field.full { grid-column: 1 / -1; }
    .so-section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 10px; }
    .so-section-title:first-child { margin-top: 0; }
    .so-section-title p { color: var(--so-muted); font-size: 11px; margin: 0; }
    .so-trace-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .so-trace-toolbar-left, .so-trace-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .so-trace-scroll { overflow-x: auto; padding-bottom: 8px; }
    .so-trace { min-width: 840px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: #0d131b; }
    .so-trace-scale { display: flex; justify-content: space-between; color: var(--so-muted); font-size: 10px; padding: 10px 14px 5px 170px; }
    .so-trace-row { display: grid; grid-template-columns: 154px minmax(620px,1fr); gap: 0; align-items: stretch; min-height: 58px; border-top: 1px solid rgba(255,255,255,.06); }
    .so-trace-label { padding: 11px 10px 9px 14px; color: #d9e1ea; font-size: 11px; }
    .so-trace-label small { display: block; color: var(--so-muted); margin-top: 4px; font-size: 10px; }
    .so-trace-canvas-wrap { position: relative; min-width: 0; }
    .so-trace-canvas { display: block; width: 100%; height: 58px; background-image: linear-gradient(90deg, transparent 24.9%, rgba(255,255,255,.04) 25%, transparent 25.1%, transparent 49.9%, rgba(255,255,255,.04) 50%, transparent 50.1%, transparent 74.9%, rgba(255,255,255,.04) 75%, transparent 75.1%); }
    .so-trace-hit-layer { position: absolute; inset: 0; pointer-events: none; }
    .so-trace-hit { position: absolute; min-width: 6px; border: 0; border-radius: 5px; padding: 0; background: transparent; cursor: pointer; pointer-events: auto; }
    .so-trace-hit:hover, .so-trace-hit:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .so-trace-hit.is-selected { outline: 2px solid var(--primary); outline-offset: 1px; }
    .so-trace-note { color: var(--so-muted); font-size: 11px; line-height: 1.55; padding: 10px 14px 14px; }
    .so-legend { display: flex; gap: 11px; flex-wrap: wrap; color: var(--so-muted); font-size: 10px; }
    .so-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .so-legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--legend-color); }
    .so-trace-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin: 0 0 10px; color: var(--foreground-muted); font-size: 11px; }
    .so-trace-legend-title { color: var(--foreground-secondary); font-weight: 650; }
    .so-trace-legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .so-trace-legend-swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--legend-color); }
    .so-trace-legend-hint { color: var(--foreground-muted); }
    .so-trace-tooltip-swatch { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; vertical-align: 1px; }
    .so-compare-selectors { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
    .so-compare-side { padding: 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.025); }
    .so-compare-side.baseline { border-left: 3px solid #91a7bf; }
    .so-compare-side.candidate { border-left: 3px solid var(--so-accent-strong); }
    .so-compare-side label { display: block; color: var(--so-muted); font-size: 11px; margin-bottom: 7px; }
    .so-overview-context { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--surface-1); }
    .so-overview-context-copy { min-width: 0; }
    .so-overview-context-copy strong { display: block; font-size: 13px; }
    .so-overview-context-copy p { margin: 4px 0 0; color: var(--foreground-secondary); font-size: 11px; line-height: 1.45; }
    .so-overview-context-control { display: flex; align-items: center; gap: 9px; flex: 0 0 min(360px, 42%); }
    .so-overview-context-control label { color: var(--foreground-muted); font-size: 11px; white-space: nowrap; }
    .so-overview-context-control .so-select { min-width: 0; background: var(--surface-1); color: var(--foreground); border-color: var(--border-default); }
    .so-overview-context-meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .so-overview-context-meta span { color: var(--foreground-muted); font-size: 10px; }
    .so-overview-context-meta .so-pill { color: var(--foreground-secondary); }
    .so-compare-context-note { margin: -5px 0 14px; color: var(--foreground-muted); font-size: 11px; line-height: 1.45; }
    .so-compare-table td:nth-child(n+2), .so-compare-table th:nth-child(n+2) { text-align: right; }
    .so-positive { color: var(--so-accent); }
    .so-negative { color: var(--so-danger); }
    .so-config-diff { display: grid; gap: 0; font-size: 11px; }
    .so-config-row { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
    .so-config-row span:first-child { color: var(--so-muted); }
    .so-inspector .so-card { border-radius: 7px; }
    .so-inspector-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .so-inspector-title h2 { font-size: 14px; margin: 0 0 4px; }
    .so-inspector-title p { color: var(--so-muted); font-size: 11px; margin: 0; line-height: 1.45; }
    .so-inspector-block { margin-top: 18px; }
    .so-inspector-block h3 { font-size: 11px; color: var(--so-muted); font-weight: 600; letter-spacing: .04em; margin: 0 0 9px; text-transform: uppercase; }
    .so-code { background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.08); border-radius: 5px; padding: 9px; color: #cbd7e3; line-height: 1.55; overflow-wrap: anywhere; }
    .so-empty { padding: 28px 20px; color: var(--so-muted); text-align: center; font-size: 12px; border: 1px dashed rgba(255,255,255,.17); border-radius: 7px; }
    .so-modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.62); }
    .so-modal { width: min(720px, calc(100vw - 40px)); max-height: calc(100vh - 60px); overflow: auto; border: 1px solid rgba(255,255,255,.17); border-radius: 9px; background: #161d27; box-shadow: 0 20px 70px rgba(0,0,0,.45); }
    .so-modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 12px; }
    .so-modal-head h2 { margin: 0 0 4px; font-size: 16px; }
    .so-modal-head p { margin: 0; color: var(--so-muted); font-size: 11px; }
    .so-modal-body { padding: 0 20px 20px; }
    .so-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid rgba(255,255,255,.1); }
    .so-import-preview { margin-top: 12px; }
    .so-import-preview pre { white-space: pre-wrap; margin: 0; }
    .so-disabled-row { opacity: .48; }
    .so-callout { padding: 11px 12px; border-left: 3px solid var(--so-warm); background: rgba(242,201,141,.07); color: #d9e1ea; font-size: 11px; line-height: 1.55; }
    @media (max-width: 1280px) {
      .so-grid.metrics { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .so-grid.two { grid-template-columns: 1fr; }
      .so-context-bar { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    /* Serving Observability extends the original inference workbench visual language. */
    :root {
      --app-background: #fafafa;
      --surface-1: #fff;
      --surface-2: #fafafa;
      --surface-3: #f4f4f5;
      --surface-4: #e4e4e7;
      --foreground: #18181b;
      --foreground-secondary: #52525b;
      --foreground-muted: #71717a;
      --border-subtle: #e4e4e7;
      --border-default: #d4d4d8;
      --border-strong: #a1a1aa;
      --primary: #18181b;
      --primary-hover: #27272a;
      --state-selected: #f4f4f5;
      --state-hover: #f4f4f5;
      --success: #15803d;
      --warning: #a16207;
      --danger: #b91c1c;
      --accent: #64748b;
      --so-muted: var(--foreground-muted);
      --so-accent: #18181b;
      --so-accent-strong: #15803d;
      --so-warm: #a16207;
      --so-danger: #b91c1c;
      --so-panel: #fff;
      --so-panel-strong: #fafafa;
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --letter-spacing-label: .06em;
      --text-label: 500 11px / 1.2 var(--font-sans);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 12px;
      --radius-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 6px 18px rgba(0,0,0,.08);
      --type-body-sm: 400 12px / 1.5 var(--font-sans);
      --duration-fast: 100ms;
      --easing-default: ease;
    }
    html, body, .app-shell { width: 100%; max-width: none; }
    body { min-width: 320px; margin: 0; background: var(--app-background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .app-shell { min-height: 100vh; background: var(--app-background); }
    .app-header { position: sticky; top: 0; z-index: 10; display: flex; height: 58px; align-items: center; justify-content: space-between; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--border-subtle); background: rgba(255,255,255,.96); backdrop-filter: blur(10px); }
    .app-brand { display: flex; align-items: center; min-width: 216px; color: var(--foreground); font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
    .brand-mark { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; margin-right: 9px; border-radius: 7px; background: var(--foreground); color: #fff; font-size: 10px; font-weight: 750; }
    .header-actions { display: flex; gap: 6px; }
    .top-context { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .top-readout { display: flex; gap: 7px; min-width: 0; }
    .top-readout span { display: block; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 9px; border: 1px solid var(--border-subtle); border-radius: 7px; background: #fff; color: var(--foreground-secondary); font-size: 11px; }
    .app-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 58px); }
    .app-sidebar { position: sticky; top: 58px; height: calc(100vh - 58px); overflow: auto; border-right: 1px solid var(--border-subtle); background: #fff; }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 18px; border-bottom: 1px solid var(--border-subtle); color: var(--foreground-secondary); font-size: 12px; font-weight: 550; }
    .app-nav { display: grid; gap: 4px; padding: 12px; }
    .so-nav-group { display: grid; gap: 4px; margin: 0 0 10px; }
    .so-nav-group-title { padding: 6px 10px 4px; color: var(--foreground-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .so-nav-item, .so-nav-child { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; border: 0; border-radius: 7px; padding: 8px 10px; background: transparent; color: var(--foreground-secondary); cursor: pointer; text-align: left; font-size: 12px; }
    .so-nav-item:hover, .so-nav-child:hover { background: var(--state-hover); color: var(--foreground); }
    .so-nav-item.is-active, .so-nav-child.is-active { background: var(--state-selected); color: var(--foreground); font-weight: 600; }

.pto-model-graphviz-stage {
  position: relative;
  min-height: calc(var(--space-6) * 17.5);
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  background: var(--model-graphviz-stage-bg);
}

.pto-model-graphviz-stage svg {
  display: block;
  width: 100%;
  height: 100%;
  min-height: inherit;
}

.pto-model-graphviz-report-stage {
  height: 720px;
  min-height: 720px;
}

.pto-model-graphviz-iframe-stage {
  position: relative;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  overflow: hidden;
  background: var(--model-graphviz-stage-bg);
}

.pto-model-graphviz-iframe-stage-v32 {
  height: 1040px;
}

.pto-model-graphviz-pattern-main[data-view='graph-only'] .pto-model-graphviz-iframe-stage {
  height: 100vh;
  min-height: 720px;
  border: 0;
  border-radius: 0;
}

.pto-model-graphviz-source-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--model-graphviz-stage-bg);
}

.pto-model-graphviz-node > rect:first-child {
  stroke: var(--model-graphviz-line-soft);
  stroke-width: 0.75px;
  filter: var(--model-graphviz-node-shadow);
}

.pto-model-graphviz-node.is-collapsed > rect:first-child {
  stroke: var(--model-graphviz-toggle-border);
  stroke-width: 0.85px;
  filter: var(--model-graphviz-parent-shadow);
}

.pto-model-graphviz-node.is-tensor > rect:first-child {
  stroke: var(--model-graphviz-tensor-stroke);
  stroke-width: 0.8px;
  filter: var(--model-graphviz-node-shadow);
}

.pto-model-graphviz-node.is-op > rect:first-child {
  filter: var(--model-graphviz-node-shadow);
}

.pto-model-graphviz-svg.is-performance-heatmap
  .pto-model-graphviz-node.is-performance-heatmap-node > rect:first-child {
  fill: var(--model-graphviz-performance-fill) !important;
  fill-opacity: 0.96 !important;

.operator-tree-panel {
  overflow: auto;
  padding: var(--space-2);
  background: var(--background);
  scrollbar-width: thin;
  scrollbar-color: var(--border-default) transparent;
}

.operator-tree {
  width: 100%;
  min-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.operator-tree-row {
  min-width: 0;
  min-height: 34px;
  display: flex;
  align-items: center;
  padding-left: calc(var(--tree-depth) * 20px);
}

.operator-tree-toggle,
.operator-tree-toggle-placeholder {
  width: 26px;
  min-width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
}

button.operator-tree-toggle {
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground-muted);
  cursor: pointer;
}

button.operator-tree-toggle:hover {
  background: var(--state-hover);
  color: var(--foreground);
}

.operator-tree-toggle svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 120ms ease;
}

.operator-tree-item.is-expanded > .operator-tree-row .operator-tree-toggle svg {
  transform: rotate(90deg);
}

.operator-tree-group-button {
  width: 100%;
  min-width: 0;
  min-height: 34px;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-2) 0 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground-secondary);
  text-align: left;
  cursor: pointer;
}

.operator-tree-group-button:hover {
  background: var(--state-hover);
  color: var(--foreground);
}

.operator-tree-group-shell {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.operator-tree-group-shell .operator-tree-group-button {
  width: auto;
  flex: 1 1 auto;
}

.operator-layer-selector {
  position: relative;
  flex: 0 0 auto;
  cursor: help;
}

.operator-layer-selector-label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.operator-layer-select {
  height: 28px;
  min-width: 86px;
  padding: 0 24px 0 9px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--foreground-secondary);
  font: var(--text-mono);
  cursor: pointer;
}

.operator-layer-select:hover {
  border-color: var(--border-strong);
  color: var(--foreground);
}

.operator-layer-select:focus-visible {
  outline: 1px solid var(--focus-ring);
  outline-offset: 2px;
}

.operator-tree-group-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: var(--text-label);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--letter-spacing-label);
  text-transform: uppercase;
}

.operator-tree-count {
  color: var(--foreground-muted);
  font: var(--text-mono);
}

.mapped-node-button {
  width: 100%;
  min-height: 34px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground-secondary);
  text-align: left;
  cursor: pointer;
}

.operator-tree-node-button {
  width: auto;
  min-width: 0;
  flex: 1 1 auto;
}

.mapped-node-button:hover {
  background: var(--state-hover);
  color: var(--foreground);
}

.mapped-node-button[aria-current="true"] {
  background: var(--state-selected);
  color: var(--foreground);
}

.node-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--foreground);
  font: var(--text-body);
}

.node-metric {
  white-space: nowrap;
}

.performance-value-badge {
  min-width: 44px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--performance-badge-fill, var(--surface-3));
  color: var(--performance-badge-text, var(--foreground));
  font: var(--text-mono);
  font-weight: var(--font-weight-semibold);
  line-height: 1.35;
  text-align: center;
}

.performance-value-badge.is-aggregate {
  --performance-badge-fill: var(--surface-3);
  --performance-badge-text: var(--foreground-secondary);
  box-shadow: inset 0 0 0 1px var(--border-default);
  cursor: help;
}

.architecture-pane-body {
  position: relative;
  overflow: hidden;
  min-height: 0;
}

.operator-color-legend {
  position: absolute;
  right: var(--space-3);
  bottom: var(--space-3);
  z-index: 8;
  width: min(252px, calc(100% - 24px));
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  box-shadow: var(--shadow-md);
  color: var(--foreground-secondary);
  pointer-events: none;
}

.operator-color-legend[hidden] {
  display: none;
}

.operator-color-legend__header,
.operator-color-legend__range {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.operator-color-legend__header {
  justify-content: flex-start;
  color: var(--foreground);
  font: var(--text-body-sm);
  font-weight: var(--font-weight-semibold);
}

.operator-color-legend__gradient {
  height: 10px;
  margin-top: var(--space-2);
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg,
    #30123b 0%,
    #4145ab 11.111%,
    #4675ed 22.222%,
    #39a2fc 33.333%,
    #1bcfd4 44.444%,
    #45f884 55.556%,
    #a4fc3c 66.667%,
    #e8d721 77.778%,
    #fa8c19 88.889%,
    #da3907 100%);
}

.operator-color-legend__range {
  margin-top: 4px;
  color: var(--foreground-muted);
}

        if (!rank) return '<section class="so-card so-moe-detail"><div class="so-card-body" style="padding-top:14px"><p class="so-moe-muted-note">选择一个 Rank 查看 phase 占比、routed token 来源和底层 task / core。</p></div></section>';
        var d = moeDerived(story);
        var selectedPhase = state.selectedPhase ? moePhaseFor(story, state.selectedPhase) : null;
        var phases = moeRankPhases(story, rank);
        var phaseRows = phases.map(function (phase) { return '<button class="so-moe-phase-row ' + (selectedPhase && selectedPhase.id === phase.id ? 'is-selected' : '') + '" data-moe-phase="' + esc(phase.id) + '" data-rank="' + esc(rank.name) + '" style="--phase-color:' + phase.color + '"><span class="so-moe-phase-name"><i></i>' + esc(phase.label) + '</span><span class="so-bar"><span style="width:' + phase.share + '%;--phase-color:' + phase.color + '"></span></span><strong>' + moeDurationMs(phase.duration) + '</strong><span>' + phase.share.toFixed(1) + '%</span></button>'; }).join('');
        var flows = story.tokenFlows.filter(function (flow) { return flow.source === rank.name || flow.target === rank.name; });
        var html = '<section class="so-card so-moe-detail"><div class="so-card-head"><div class="so-moe-detail-head"><div><h3>' + esc(rank.name) + ' detail</h3><p>' + Number(rank.routedTokens).toLocaleString() + ' routed tokens · ' + moeTokenDelta(rank, d) + ' vs avg · window ' + moeDurationMs(story.totalWindow) + '</p></div></div><span class="so-pill ' + (rank.name === story.criticalRank ? 'warm' : '') + '">' + (rank.name === story.criticalRank ? 'Critical path' : 'Selected') + '</span></div><div class="so-card-body"><div class="so-moe-phase-list">' + phaseRows + '</div>' + renderMoeCoreTimeline(story, rank, evidence) + '<div class="so-divider"></div><div class="so-section-title" style="margin-top:0"><h2>Routed token flow</h2><span>' + flows.length + ' linked flows</span></div><div class="so-moe-token-flow">' + (flows.length ? flows.map(function (flow) { return '<div class="so-moe-token-flow-item"><span>' + esc(flow.source) + ' → ' + esc(flow.target) + '</span><strong>' + Number(flow.tokens).toLocaleString() + '</strong></div>'; }).join('') : '<p class="so-moe-muted-note">当前 Rank 没有展开的跨 Rank token flow。</p>') + '</div>';
        if (inline) html = html.replace('<div class="so-moe-phase-list">' + phaseRows + '</div>', '');
        if (selectedPhase) {
          var events = moeEventsForPhase(evidence, rank.name, selectedPhase.id).slice(0, 8);
          html += '<div class="so-divider"></div><div class="so-section-title" style="margin-top:0"><h2>' + esc(selectedPhase.label) + ' · Task / Core</h2><span>' + (events.length || '—') + ' linked events</span></div><div class="so-moe-task-list">' + (events.length ? events.map(function (event) { return '<button class="so-moe-task-row" data-event-id="' + esc(event.id) + '" data-event="' + esc(event.id) + '"><strong>' + esc(event.funcName || event.label || 'runtime event') + '</strong><span>' + esc(event.coreType ? event.coreType.toUpperCase() + ' · ' + event.coreId : 'runtime task') + '</span><span>' + moeDurationUs(event.dur) + '</span></button>'; }).join('') : '<p class="so-moe-muted-note">该 Semantic Phase 尚未关联可展开的底层 event。</p>') + '</div>';
        }
        if (inline) html = html.replace('so-card so-moe-detail', 'so-moe-inline-detail');
        return html + '</div></section>';
      }
      function renderMoeTraceBody(evidence) {
        return renderMoeFindingStrip(evidence) + renderMoeSummary(evidence) + renderMoeTimelineEmbedded(evidence);
      }

      function baselineForScenario(scenario) {
        return state.compareGroup === 'moe' ? runtimeEvidence.ep2 : runtimeEvidence.csa;
      }

      function overviewCandidateSwitcher(scenario, evidence) {
        var candidateIds = candidateIdsForScenario(scenario);
        var baseline = baselineForScenario(scenario);
        return '<div class="so-overview-context"><div class="so-overview-context-copy"><strong>当前 Candidate</strong><p>切换后，Overview 与 Trace 会查看同一份 Candidate evidence；Compare 的对比对象保持独立。</p><div class="so-overview-context-meta"><span>' + esc(scenario.revision) + '</span><span>·</span><span>Baseline ' + esc(baseline.label) + '</span><span class="so-pill">' + esc(evidence.path) + ' · fixed evidence snapshot</span></div></div><div class="so-overview-context-control"><label for="overview-candidate-select">Candidate</label><select id="overview-candidate-select" class="so-select" data-action="overview-candidate-select" aria-label="切换当前 Candidate">' + candidateIds.map(function (candidateId) {
          return '<option value="' + candidateId + '" ' + (candidateId === state.currentCandidate ? 'selected' : '') + '>' + esc(candidateLabel(candidateId)) + '</option>';
        }).join('') + '</select></div></div>';
      }

      function renderExplorer() {
        var scenario = currentScenario();
        var html = '';
        html += '<div class="so-nav-group"><div class="so-nav-group-title">WORKSPACE</div>';
        html += '<button class="so-nav-item ' + (state.route === 'workspace' ? 'is-active' : '') + '" data-route="workspace"><span>⌂ Workspace</span><span class="so-nav-count">1</span></button>';
        html += '<button class="so-nav-item ' + (state.route === 'model' ? 'is-active' : '') + '" data-route="model"><span>◈ Model</span><span class="so-nav-count">V4</span></button>';
        html += '<button class="so-nav-item ' + (state.route === 'scenarios' || state.route === 'scenario-new' ? 'is-active' : '') + '" data-route="scenarios"><span>◇ Scenarios</span><span class="so-nav-count">' + scenarios.length + '</span></button>';
        html += '<button class="so-nav-item ' + (state.route === 'observe' ? 'is-active' : '') + '" data-route="observe"><span>◉ Observe</span><span class="so-nav-count">RUN-042</span></button>';
        observeTabsConfig.forEach(function (item) {
          var tab = item[0];
          html += '<button class="so-nav-child ' + (state.route === 'observe' && state.observeTab === tab ? 'is-active' : '') + '" data-observe-tab="' + tab + '"><span>' + item[1] + '</span></button>';
        });
        html += '<button class="so-nav-item ' + (state.route === 'investigate' ? 'is-active' : '') + '" data-route="investigate"><span>◎ Investigation</span><span class="so-nav-count">3</span></button>';
        html += '<button class="so-nav-item ' + (state.route === 'explore' ? 'is-active' : '') + '" data-route="explore"><span>＋ Explore</span></button></div>';
        html += '<div class="so-nav-group"><div class="so-nav-group-title">OBSERVE CONTEXT</div>';
        html += '<button class="so-nav-item" data-route="observe"><span>' + esc(scenario.name) + '</span><span class="so-pill accent">' + esc(scenario.revision) + '</span></button>';
        html += '<button class="so-nav-item" data-route="run"><span>Controlled Run</span>' + status(state.runStatus) + '</button></div>';
        html += '<div class="so-context-card"><div class="so-eyebrow">MODEL</div><div class="so-context-name">DeepSeek V4 Flash Decode</div><div class="so-context-meta">Variant: Flash Decode<br>Hardware: Ascend A2 · 8 devices<br>Runtime: pypto-serving 0.4.2</div></div>';
        document.getElementById('explorer-content').innerHTML = html;
        document.getElementById('sidebar-scenario').textContent = scenario.name + ' · ' + scenario.revision;
        document.getElementById('sidebar-status').textContent = 'RUN-042 · ' + state.runStatus;
      }

      function header(title, description, actions) {
        var eyebrow = state.route === 'model' ? 'MODEL' : state.route === 'workspace' ? 'WORKSPACE' : state.route === 'scenarios' ? 'SCENARIOS' : state.route === 'scenario-new' ? 'SCENARIO / NEW' : state.route === 'run' ? 'CONTROLLED RUN' : state.route === 'investigate' ? 'INVESTIGATION' : 'OBSERVE / ' + state.observeTab;
        var html = '<div class="so-content-header"><div><div class="so-eyebrow">' + esc(eyebrow) + '</div><h1>' + esc(title) + '</h1><p>' + esc(description) + '</p></div><div class="so-header-actions">' + (actions || '') + '</div></div>';
        return state.route === 'observe' ? html + observeContextBar() : html;
      }

      function evidenceGroupLabel(group, scenario) {
        if (scenario.kind === 'batching') return 'Serving Scheduler';
        return group === 'moe' ? 'MoE Parallelism Compare' : 'Attention Path Compare';
      }

      function observeContextBar() {
        var scenario = currentScenario();
        var groups = scenario.evidenceGroups;
        return '<div class="so-context-bar"><div class="so-context-field"><label>Scenario</label><select class="so-select" data-context-scenario>' + scenarios.map(function (item) {
          return '<option value="' + item.id + '" ' + (item.id === scenario.id ? 'selected' : '') + '>' + esc(item.name + ' · ' + item.revision) + '</option>';
        }).join('') + '</select></div><div class="so-context-field"><label>Run</label><select class="so-select" data-context-run><option value="RUN-042">RUN-042 · ' + esc(state.runStatus) + '</option></select></div><div class="so-context-field"><label>Evidence group</label><select class="so-select" data-context-group>' + groups.map(function (group) {
          return '<option value="' + group + '" ' + (group === state.compareGroup ? 'selected' : '') + '>' + esc(evidenceGroupLabel(group, scenario)) + '</option>';
        }).join('') + '</select></div><button class="so-button" data-route="run">查看 Run 快照</button></div>';
      }

      function observeTabs() {
        return '<div class="so-tabs">' + observeTabsConfig.map(function (item) {
          var tab = item[0];
          return '<button class="so-tab ' + (state.observeTab === tab ? 'is-active' : '') + '" data-observe-tab="' + tab + '">' + item[1] + '</button>';
        }).join('') + '</div>';
      }

      function renderOverview() {
        var run = state.runStatus;
        var scenario = currentScenario();
        var evidence = currentEvidence();
        var html = header('Runtime Evidence', '从 Finding 进入真实 DFX 执行证据，并沿 Rank / Core → Event → Task → Tensor / Dependency 下钻。', '<button class="so-button" data-route="run">查看 Run 快照</button>');
        html += observeTabs();
        html += overviewCandidateSwitcher(scenario, evidence);
        html += '<div class="so-grid metrics">';
        html += metric('Execution window', value(evidence.window, ' μs'), evidence.group === 'moe' ? evidence.rankCount + ' ranks 取最大窗口' : evidence.coreCount + ' cores', '');
        html += metric('Runtime events', value(evidence.eventCount, ''), (evidence.rawTraceEventCount || evidence.eventCount) + ' trace records', '');
        html += metric('Task / Tensor', value(evidenceTaskCount(evidence), ''), evidenceTensorCount(evidence) + ' tensors · ' + evidenceEdgeCount(evidence) + ' edges', '');
        html += metric('Diagnostic evidence', value((evidence.hintGroups || []).length, ' groups'), (evidence.hints || []).length + ' hint occurrences · ' + (evidence.memorySections || []).length + ' memory kernels', (evidence.hints || []).length ? 'warn' : '');
        html += '</div>';
        html += '<div class="so-grid two" style="margin-top:12px">';
        html += '<section class="so-card"><div class="so-card-head"><h3>Evidence scope</h3>' + status(run) + '</div><div class="so-card-body"><dl class="so-kv"><dt>Controlled Run</dt><dd class="so-mono">RUN-042</dd><dt>Scenario snapshot</dt><dd>' + esc(scenario.revision) + '</dd><dt>Current Candidate</dt><dd>' + esc(evidence.label) + '</dd><dt>Hierarchy</dt><dd>' + (evidence.group === 'moe' ? evidence.rankCount + ' Rank → Core → Event' : 'Core → Event') + '</dd><dt>Runtime graph</dt><dd>' + evidenceTaskCount(evidence) + ' Task → ' + evidenceTensorCount(evidence) + ' Tensor → ' + evidenceEdgeCount(evidence) + ' Edge</dd><dt>Core execution</dt><dd>AIC ' + (evidence.aicoreCount || 0) + ' · AICPU ' + (evidence.aicpuCount || 0) + '</dd></dl></div></section>';
        html += '<section class="so-card"><div class="so-card-head"><h3>Evidence coverage</h3><span class="so-pill accent">DFX linked</span></div><div class="so-card-body"><dl class="so-kv"><dt>Timeline</dt><dd>' + evidence.eventCount + ' complete events</dd><dt>Dependency graph</dt><dd>' + evidenceEdgeCount(evidence) + ' creator / explicit / tensormap edges</dd><dt>Tensor metadata</dt><dd>identity · version · shape · dtype · stride · offset · storage</dd><dt>Memory report</dt><dd>' + (evidence.memorySections || []).length + ' kernel sections · ' + esc(evidence.memory) + '</dd><dt>Perf hints</dt><dd>' + (evidence.hintGroups || []).length + ' grouped problems · ' + (evidence.hints || []).length + ' occurrences</dd><dt>PMU</dt><dd><span class="so-status neutral">未采集</span></dd></dl></div></section>';
        html += '</div>';
        html += '<div class="so-section-title so-findings-section-title"><div><h2>Findings <span class="so-findings-count">' + findings.length + '</span></h2><p>按影响优先级排列；从现象进入 Investigation，再把建议变更保存为 Scenario revision</p></div><span class="so-finding-evidence">' + findings.filter(function (item) { return item.severity === 'High'; }).length + ' high priority</span></div>';
        html += '<div class="so-findings so-findings-overview">' + findings.map(findingCard).join('') + '</div>';
        if (window.PtoServingProfiler) html += window.PtoServingProfiler.render('overview');
        return html;
      }

      function findingCard(item) {
        var severityClass = item.severity === 'High' ? 'is-high' : 'is-medium';
        var candidateMeta = item.candidate ? '<span class="so-pill">' + esc(candidateLabel(item.candidate)) + '</span>' : '';
        return '<article class="so-finding ' + severityClass + '"><div class="so-finding-copy"><div class="so-finding-head"><span class="so-finding-code">' + esc(item.id) + '</span><span class="so-finding-severity ' + severityClass + '">' + esc(item.severity) + '</span></div><div class="so-finding-title">' + esc(item.title) + '</div><div class="so-finding-summary">' + esc(item.summary) + '</div><div class="so-finding-foot"><span class="so-pill ' + (item.severity === 'High' ? 'warm' : '') + '">' + esc(item.severity === 'High' ? 'High impact' : 'Perf guidance') + '</span>' + candidateMeta + '<span class="so-finding-evidence">' + esc(item.evidence) + '</span></div></div><button class="so-button primary so-finding-action" data-finding="' + esc(item.id) + '" data-event="' + esc(item.event || '') + '"><span>' + esc(item.action) + '</span><span aria-hidden="true">→</span></button></article>';
      }

      function filteredTraceEvents(evidence) {
        var rankNumber = state.selectedRank ? Number(String(state.selectedRank).replace(/\D/g, '')) : null;
        var search = state.traceSearch.trim().toLowerCase();
        return (evidence.events || []).filter(function (event) {
          if (evidence.ranks && state.selectedRank && event.rank !== rankNumber) return false;
          if (evidence.group === 'moe' && state.selectedPhase && moeEventPhase(event) !== state.selectedPhase) return false;
          if (state.coreFilter === 'aic' || state.coreFilter === 'aiv') { if (event.coreType !== state.coreFilter) return false; }
          else if (state.coreFilter !== 'all' && event.laneId !== state.coreFilter) return false;
          if (state.tracePreset === 'long' && event.dur < Math.max(10, evidence.window * .015)) return false;
          if (state.tracePreset === 'wait' && !/wait|gather|dispatch|meta|push/i.test(event.funcName)) return false;
          if (search && [event.funcName, event.taskId, event.lane, event.rawName].join(' ').toLowerCase().indexOf(search) < 0) return false;
          return true;
        });
      }

      function visibleTraceLanes(evidence) {
        var map = {};
        filteredTraceEvents(evidence).forEach(function (event) {
          if (!map[event.lane]) map[event.lane] = { id: event.laneId, label: event.lane, kind: event.laneKind, events: [] };
          map[event.lane].events.push(event);
        });
        return Object.keys(map).map(function (key) { return map[key]; }).sort(function (a, b) { return a.label.localeCompare(b.label, undefined, { numeric: true }); });
      }

      function traceRows(evidence) {
        var lanes = visibleTraceLanes(evidence);
        var shown = lanes.slice(0, state.laneLimit);
        var html = shown.map(function (lane, laneIndex) {
          var events = lane.events || [];
          var canvasId = 'trace-canvas-' + String(lane.id || lane.label).replace(/[^a-z0-9]/gi, '-') + '-' + laneIndex;
          return '<div class="so-trace-row"><div class="so-trace-label">' + esc(laneDisplayLabel(lane.label)) + '<small>' + events.length + ' events</small></div><div class="so-trace-canvas-wrap"><canvas class="so-trace-canvas" id="' + canvasId + '" data-trace-lane="' + esc(lane.label) + '" data-trace-canvas="true" tabindex="0" aria-label="' + esc(laneDisplayLabel(lane.label)) + ' timeline"></canvas><div class="so-trace-hit-layer" data-trace-hit-layer aria-label="' + esc(laneDisplayLabel(lane.label)) + ' events"></div></div></div>';
        }).join('');
        if (lanes.length > shown.length) html += '<div class="so-lane-cap">已渲染 ' + shown.length + ' / ' + lanes.length + ' lanes。<button class="so-link" data-action="show-more-lanes">继续展开</button></div>';
        return html || '<div class="so-empty">当前筛选条件下没有匹配的 runtime event。</div>';
      }

      function roundText(number) { return Math.round(Number(number || 0) * 100) / 100; }

      function laneDisplayLabel(label) {
        var match = String(label || '').match(/^r(\d+):\s*·\s*(.+)$/);
        return match ? 'Rank ' + match[1] + ' · ' + match[2] : label;
      }

      function traceLegend() {
        return '<div class="so-trace-legend" aria-label="Trace event color legend"><span class="so-trace-legend-title">事件颜色</span><span class="so-trace-legend-item"><i class="so-trace-legend-swatch" style="--legend-color:#c8945d"></i>AIC 计算 / Expert</span><span class="so-trace-legend-item"><i class="so-trace-legend-swatch" style="--legend-color:#5f9b9b"></i>AIV 计算</span><span class="so-trace-legend-item"><i class="so-trace-legend-swatch" style="--legend-color:#b86d68"></i>Wait / Gather / Metadata</span><span class="so-trace-legend-hint">悬停彩色事件条查看详情</span></div>';
      }

      function traceTooltipHtml(task) {
        var event = task && task.event || {};
        var end = Number(event.start || 0) + Number(event.dur || 0);
        return '<div class="pto-swimlane-task-tooltip__title"><span class="so-trace-tooltip-swatch" style="background:' + esc(event.color || '#5f6775') + '"></span>' + esc(event.funcName || event.label || 'runtime event') + '</div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">lane</span><span class="pto-swimlane-task-tooltip__value">' + esc(laneDisplayLabel(event.lane || task.lane || '—')) + '</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">core</span><span class="pto-swimlane-task-tooltip__value">' + esc(String(event.coreType || '—').toUpperCase()) + ' · ' + esc(event.coreId || '—') + '</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">start</span><span class="pto-swimlane-task-tooltip__value">' + roundText(event.start) + ' μs</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">duration</span><span class="pto-swimlane-task-tooltip__value">' + roundText(event.dur) + ' μs</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">end</span><span class="pto-swimlane-task-tooltip__value">' + roundText(end) + ' μs</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">task</span><span class="pto-swimlane-task-tooltip__value">' + esc(event.taskId || '—') + '</span></div>';
      }

      function renderHierarchy(evidence) {
        if (evidence.ranks) {
          var selectedLabel = state.selectedRank || 'All ranks';
          var physicalCoreCount = evidence.coreCount || (evidence.id === 'ep8' ? 66 : 6);
          return '<aside class="so-card so-hierarchy"><div class="so-hierarchy-head"><div class="so-eyebrow">TRACE SCOPE</div><div class="so-finding-title" style="margin-top:5px">Rank timeline focus</div></div><div class="so-hierarchy-list"><div class="so-hierarchy-stat"><span>Ranks</span><strong>' + evidence.rankCount + '</strong><small>在主 Timeline 选择</small></div><div class="so-hierarchy-stat"><span>Physical core lanes</span><strong>' + physicalCoreCount + '</strong><small>按执行角色聚合到右侧 Core lane summary</small></div><div class="so-hierarchy-stat"><span>Current drill</span><strong>' + esc(selectedLabel) + '</strong><small>Rank detail 在选中行内展开</small></div></div></aside>';
        }
        var html = '<aside class="so-card so-hierarchy"><div class="so-hierarchy-head"><div class="so-eyebrow">EXECUTION HIERARCHY</div><div class="so-finding-title" style="margin-top:5px">' + (evidence.ranks ? 'Rank → Core' : 'Core → Event') + '</div></div><div class="so-hierarchy-list">';
        if (evidence.ranks) {
          var maxWindow = Math.max.apply(null, evidence.ranks.map(function (rank) { return rank.window; }));
          html += '<button class="so-hierarchy-item ' + (!state.selectedRank ? 'is-active' : '') + '" data-rank=""><span>Rank Overview</span><span>' + evidence.rankCount + '</span></button>';
          evidence.ranks.forEach(function (rank) {
            html += '<button class="so-hierarchy-item ' + (state.selectedRank === rank.name ? 'is-active' : '') + '" data-rank="' + esc(rank.name) + '"><span>' + esc(rank.name) + '<small style="display:block;color:var(--foreground-muted);margin-top:3px">' + rank.eventCount + ' events</small></span><span style="width:54px"><span class="so-bar"><span style="width:' + Math.max(3, rank.window / maxWindow * 100) + '%"></span></span><small>' + roundText(rank.window) + ' μs</small></span></button>';
          });
        }
        if (!evidence.ranks || state.selectedRank) {
          var rankNumber = state.selectedRank ? Number(String(state.selectedRank).replace(/\D/g, '')) : null;
          var lanes = (evidence.lanes || []).filter(function (lane) { return rankNumber == null || (lane.events[0] && lane.events[0].rank === rankNumber); });
          var aic = lanes.filter(function (lane) { return lane.kind === 'aic'; });
          var aiv = lanes.filter(function (lane) { return lane.kind === 'aiv'; });
          html += '<div class="so-divider"></div><button class="so-hierarchy-item ' + (state.coreFilter === 'all' ? 'is-active' : '') + '" data-core-filter="all"><span>All cores</span><span>' + lanes.length + '</span></button>';
          html += '<button class="so-hierarchy-item ' + (state.coreFilter === 'aic' ? 'is-active' : '') + '" data-core-filter="aic"><span>AIC</span><span>' + aic.length + '</span></button>';
          html += '<button class="so-hierarchy-item ' + (state.coreFilter === 'aiv' ? 'is-active' : '') + '" data-core-filter="aiv"><span>AIV</span><span>' + aiv.length + '</span></button>';
          lanes.slice(0, 24).forEach(function (lane) { html += '<button class="so-hierarchy-item ' + (state.coreFilter === lane.id ? 'is-active' : '') + '" data-core-filter="' + esc(lane.id) + '"><span>' + esc(lane.label.replace(/^r\d+:?\s*·?\s*/, '')) + '</span><span>' + lane.events.length + '</span></button>'; });
        }
        return html + '</div></aside>';
      }

      function renderRankOverview(evidence) {
        var maxWindow = Math.max.apply(null, evidence.ranks.map(function (rank) { return rank.window; }));
        return '<div class="so-card"><div class="so-card-head"><div><h3>Rank Overview</h3><div class="so-finding-summary">按执行窗口和 dispatch activity 定位长尾 Rank，再展开其 core lanes。</div></div><span class="so-pill">' + evidence.rankCount + ' ranks</span></div><div class="so-rank-overview">' + evidence.ranks.slice().sort(function (a, b) { return b.window - a.window; }).map(function (rank) { return '<button class="so-rank-row" data-rank="' + esc(rank.name) + '"><strong>' + esc(rank.name) + '</strong><span class="so-rank-track"><span style="width:' + Math.max(3, rank.window / maxWindow * 100) + '%"></span></span><span>' + roundText(rank.window) + ' μs</span><span>wait ' + roundText(rank.wait) + '</span><span>' + rank.eventCount + ' events</span></button>'; }).join('') + '</div></div>';
      }

      function selectedTaskContext(evidence, event) {
        var task = event && evidence.taskIndex && evidence.taskIndex[event.taskKey || event.taskId];

      function currentDseCandidate() {
        var candidates = dseCandidateCatalog(state.scenarioExplore);

      function dseField(label, field, value, options) {

      function renderDseKnob(explore, id, label, summary, form) {

      function renderDseSearchMode(explore) {

        var tabs = strategies.map(function (item) {
          return '<button class="so-dse-search-tab' + (item.id === mode ? ' is-active' : '') + '" type="button" data-dse-search-strategy="' + item.id + '" role="tab" aria-selected="' + (item.id === mode) + '"><b>' + item.label + '</b><small>' + item.sub + '</small>' + (item.alpha ? '<i>Alpha</i>' : '') + '</button>';
        }).join('');

        return '<div class="so-dse-search-mode"><div class="so-dse-search-head"><h3>搜索策略</h3><span class="so-dse-search-recommendation">' + current.badge + '</span></div><div class="so-dse-search-tabs" role="tablist" aria-label="搜索策略">' + tabs + '</div>' + bruteModes + '<div class="so-dse-search-copy"><strong>' + current.title + '</strong><p>' + current.copy + '</p>' + (current.alpha ? '<span class="alpha">Alpha · 适合探索性搜索</span>' : '') + '</div><div class="so-dse-search-budget"><div class="so-dse-search-budget-head"><span>搜索预算</span><strong data-dse-search-budget-label>' + candidateText + '</strong></div><input type="range" ' + range + ' value="' + budget + '" data-dse-search-budget aria-label="搜索预算"><small>' + note + '</small></div><div class="so-dse-search-complexity"><div class="so-dse-search-complexity-label"><span>枚举</span><span>智能搜索</span></div><div class="so-dse-search-complexity-track"><b style="left: ' + current.marker + '%"></b></div><div class="so-dse-search-complexity-modes"><span>Manual</span><span>Automatic</span><span>Quick</span><span>Optuna</span></div></div></div>';

      function renderDseIntentPanel(explore) {

        html += renderDseKnob(explore, 'model', 'Model', explore.model + ' · ' + explore.precision, '<div class="so-dse-field-grid">' + dseField('Model', 'model', explore.model, { full: true, values: [{ value: 'DeepSeek V4', label: 'DeepSeek V4' }, { value: 'Qwen3 235B-A22B', label: 'Qwen3 235B-A22B' }] }) + dseField('Precision', 'precision', explore.precision, { full: true, values: [{ value: 'W8A8', label: 'W8A8' }, { value: 'BF16', label: 'BF16' }] }) + '</div>');
        html += renderDseKnob(explore, 'workload', 'Workload', explore.requestRate + ' req/s · P95 ' + Number(explore.promptP95).toLocaleString() + ' prompt', '<div class="so-dse-field-grid">' + dseField('Peak request rate', 'requestRate', explore.requestRate, { type: 'number' }) + dseField('Concurrency', 'concurrency', explore.concurrency, { type: 'number' }) + dseField('Prompt P95', 'promptP95', explore.promptP95, { type: 'number' }) + dseField('Output P50', 'outputP50', explore.outputP50, { type: 'number' }) + '</div>');
        html += renderDseKnob(explore, 'sla', 'SLA', 'TTFT ≤ ' + explore.ttftSla + ' ms · TPOT ≤ ' + explore.tpotSla + ' ms', '<div class="so-dse-field-grid">' + dseField('P95 TTFT · ms', 'ttftSla', explore.ttftSla, { type: 'number' }) + dseField('P95 TPOT · ms', 'tpotSla', explore.tpotSla, { type: 'number' }) + '</div>');
        html += renderDseKnob(explore, 'hardware', 'Hardware budget', explore.deviceType + ' × ' + explore.maxDevices, '<div class="so-dse-field-grid">' + dseField('Accelerator', 'deviceType', explore.deviceType, { full: true, values: [{ value: 'Ascend A2 64 GB', label: 'Ascend A2 · 64 GB' }, { value: 'Ascend A3 96 GB', label: 'Ascend A3 · 96 GB' }] }) + dseField('Max devices', 'maxDevices', explore.maxDevices, { type: 'number' }) + dseField('HBM reserve · %', 'hbmReserve', explore.hbmReserve, { type: 'number' }) + '</div>');
        html += renderDseKnob(explore, 'evaluation', 'Evaluation mode', explore.evaluationMode === 'fast' ? 'Fast estimate' : 'Hardware benchmark', '<div class="so-dse-mode"><button type="button" class="' + (explore.evaluationMode === 'fast' ? 'is-active' : '') + '" data-dse-mode="fast">Fast estimate</button><button type="button" class="' + (explore.evaluationMode === 'hardware' ? 'is-active' : '') + '" data-dse-mode="hardware">Hardware benchmark</button></div>');
        html += '</div>' + renderDseSearchMode(explore) + '<div class="so-dse-update"><div class="so-dse-change-state' + (explore.dirty ? ' is-dirty' : '') + '">' + (explore.dirty ? '条件已变更，右侧仍为上一轮结果' : '当前结果基于已显示的条件') + '</div><button class="so-button primary" type="button" data-action="update-design-space" ' + (explore.dirty ? '' : 'disabled') + '>更新设计空间</button></div></section></aside>';

      function renderDseLineage(explore) {
        return '<section class="so-dse-section"><div class="so-dse-section-head"><div><h2>Candidate population lineage</h2><p>从并行策略组合到可部署 Pareto 方案的收敛路径。</p></div><div class="so-dse-meta"><span class="so-pill">EXP-' + String(explore.revision).padStart(3, '0') + '</span><span class="so-pill accent">' + (explore.evaluationMode === 'fast' ? 'Fast estimate' : 'Hardware benchmark') + '</span></div></div><div class="so-dse-lineage" id="dse-candidate-lineage"></div></section>';
      }

      function dseLineageData(explore) {
        var designCount = Number(explore.maxDevices) <= 8 ? 6144 : 12288;
        var prunedCount = Math.round(designCount * .0664);
        var evaluationCount = explore.evaluationMode === 'hardware' ? 28 : 72;
        var constraintRejectCount = designCount - prunedCount;
        var hardwareCapacityRejectCount = Math.round(constraintRejectCount * .42);
        var kvAllocationRejectCount = Math.round(constraintRejectCount * .28);
        var concurrencyCapacityRejectCount = Math.round(constraintRejectCount * .18);
        var otherConstraintRejectCount = constraintRejectCount - hardwareCapacityRejectCount - kvAllocationRejectCount - concurrencyCapacityRejectCount;
        var evaluationRejectCount = prunedCount - evaluationCount;
        var slaRejectCount = Math.round(evaluationRejectCount * .45);
        var schedulerRejectCount = Math.round(evaluationRejectCount * .35);
        var communicationRejectCount = evaluationRejectCount - slaRejectCount - schedulerRejectCount;
        var paretoCount = 4;
        var dominatedCount = evaluationCount - paretoCount;
        return {
          title: 'Candidate population lineage',
          stages: [
            {
              id: 'design-space', label: 'Design space', kind: 'parallelism combinations', count: designCount,
              summary: '自动搜索 PP、EP、TP、DP、是否 P/D 分离以及是否使用 hybrid parallelism',
              next: {
                id: 'constraint-pruning', type: 'converge', label: 'PRUNE −' + constraintRejectCount.toLocaleString(),
                rejected: [
                  { label: 'Hardware capacity · ' + hardwareCapacityRejectCount.toLocaleString(), count: hardwareCapacityRejectCount, tone: 2 },
                  { label: 'KV allocation · ' + kvAllocationRejectCount.toLocaleString(), count: kvAllocationRejectCount, tone: 1 },
                  { label: 'Concurrency · ' + concurrencyCapacityRejectCount.toLocaleString(), count: concurrencyCapacityRejectCount, tone: 4 },
                  { label: 'Other constraints · ' + otherConstraintRejectCount.toLocaleString(), count: otherConstraintRejectCount, tone: 6 }
                ]
              }
            },
            {
              id: 'feasible', label: 'Constraints pruning', kind: 'feasible plans', count: prunedCount,
              summary: '根据 hardware capacity、KV allocation capacity、concurrency capacity 与其他约束收敛方案',
              next: {
                id: 'candidate-evaluation', type: 'converge', label: 'RUN −' + evaluationRejectCount.toLocaleString(),
                rejected: [
                  { label: 'SLA · ' + slaRejectCount.toLocaleString(), count: slaRejectCount, tone: 1 },
                  { label: 'Scheduler · ' + schedulerRejectCount.toLocaleString(), count: schedulerRejectCount, tone: 2 },
                  { label: 'Communication · ' + communicationRejectCount.toLocaleString(), count: communicationRejectCount, tone: 4 }
                ]
              }
            },
            {
              id: 'evaluated', label: '方案运行',
              kind: explore.evaluationMode === 'fast' ? '仿真模拟结果' : '真实硬件运行结果', count: evaluationCount,
              summary: explore.evaluationMode === 'fast' ? '根据用户意图执行快速仿真模拟计算' : '根据用户意图在所选 Ascend 硬件上真实运行',
              next: {
                id: 'pareto-filter', type: 'converge', label: 'RANK −' + dominatedCount,
                rejected: [{ label: 'Dominated · ' + dominatedCount, count: dominatedCount, tone: 6 }]
              }
            },
            { id: 'pareto', label: 'Pareto frontier', kind: 'non-dominated candidates', count: paretoCount, summary: '给出 latency、throughput 与 resource trade-offs 的 Pareto frontier' }
          ]
        };
      }

      function mountDseLineage(explore) {
        var host = document.getElementById('dse-candidate-lineage');
        if (!host) return;
        if (!window.PtoCandidatePopulationLineage) {
          host.innerHTML = '<div class="so-empty">正在加载候选收敛图…</div>';
          if (!dseLineageRetryStarted) {
            dseLineageRetryStarted = true;
            var retryScript = document.createElement('script');
            retryScript.src = 'candidate-population-lineage/pattern.js?v=20260829-2&retry=' + Date.now();
            retryScript.onload = function () {
              if (window.PtoCandidatePopulationLineage && document.getElementById('dse-candidate-lineage')) {
                mountDseLineage(state.scenarioExplore);
                return;
              }
              var currentHost = document.getElementById('dse-candidate-lineage');
              if (currentHost) currentHost.innerHTML = '<div class="so-empty">候选收敛图加载失败，请刷新页面后重试。</div>';
            };
            retryScript.onerror = function () {
              var currentHost = document.getElementById('dse-candidate-lineage');
              if (currentHost) currentHost.innerHTML = '<div class="so-empty">候选收敛图加载失败，请刷新页面后重试。</div>';
            };
            document.head.appendChild(retryScript);
          }
          return;
        }
        try {
          dseLineageController = window.PtoCandidatePopulationLineage.render(host, {
            data: dseLineageData(explore),
            initialSelection: 'pareto',
            maxVisibleCandidates: 240
          });
        } catch (error) {
          console.error(error);
          host.innerHTML = '<div class="so-empty">候选数据不满足数量守恒，请检查本轮探索结果。</div>';
        }
      }

      function renderDseCandidates(explore) {
        var candidates = dseCandidateCatalog(explore);
        return '<section class="so-dse-section"><div class="so-dse-section-head"><div><h2>Pareto frontier candidates</h2><p>所有候选均满足硬约束；选择一个方案查看 rank placement 与 Deployment config。</p></div><span class="so-pill accent">4 non-dominated</span></div><div class="so-dse-candidates">' + candidates.map(function (item) {
          var active = item.id === explore.selectedCandidate;

        }).join('') + '</div></section>';
      }

      function renderDseTopology(candidate) {
        function rangeFor(pool) {

          return pool.id === 'prefill' ? 'Prefill' : pool.id === 'decode' ? 'Decode' : 'Unified';

        }
        function renderStages(pool) {
          var topology = pool.topology || candidate.parallelism;
          var stageCount = Math.max(1, topology.pp);
          var stages = [];
          for (var stage = 0; stage < stageCount; stage += 1) {
            var firstLayer = Math.floor(43 * stage / stageCount);

          }

        }
        function renderLayers() {
          var layers = [];

          return layers.join('');
        }
        function renderShards(axis, count, color) {

            shards.push('<span class="so-placement-shard" style="--shard-color:' + color + '" data-placement-source="' + axis + '" data-placement-value="' + shard + '">' + axis.toUpperCase() + shard + '</span>');

      function drawTrace() {
        var evidence = currentEvidence();
        var visibleEvents = filteredTraceEvents(evidence);
        var max = evidence.window;
        document.querySelectorAll('[data-trace-canvas]').forEach(function (canvas) {
          var lane = canvas.getAttribute('data-trace-lane');
          var events = visibleEvents.filter(function (item) { return item.lane === lane; });
          var rect = canvas.getBoundingClientRect();
          var width = Math.max(620, rect.width || 620);
          var dpr = window.devicePixelRatio || 1;
          canvas.width = width * dpr;
          canvas.height = 58 * dpr;
          var ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          var hitLayer = canvas.parentElement.querySelector('[data-trace-hit-layer]');
          if (hitLayer) hitLayer.innerHTML = '';
          events.forEach(function (task) {
            var x = (task.start / max) * width;
            var barWidth = Math.max(6, (task.dur / max) * width * state.traceZoom);
            window.PtoSwimlaneTaskPattern.drawTaskBar(ctx, {
              x: x, y: 14, width: Math.min(barWidth, width - x), height: 27,
              task: { taskId: task.id, label: task.label, displayName: task.label, rawName: task.label, opName: task.task || task.label, laneKind: task.kind, laneId: lane, totalCycle: task.dur, clcCycle: task.dur, gap: 0, gapRatio: 0, status: 'completed', dominantCounter: task.hint || '' },
              baseColor: task.color,
              isSelected: state.selectedEvent === task.id
            });
            if (hitLayer) {
              var hit = document.createElement('button');
              hit.type = 'button';
              hit.className = 'so-trace-hit' + (state.selectedEvent === task.id ? ' is-selected' : '');
              hit.setAttribute('data-trace-hit', 'true');
              hit.setAttribute('aria-label', task.funcName + ' · ' + roundText(task.dur) + ' μs');
              hit.style.left = Math.max(0, x) + 'px';
              hit.style.top = '14px';
              hit.style.width = Math.max(6, Math.min(barWidth, width - x)) + 'px';
              hit.style.height = '27px';
              hit.__ptoSwimlaneTask = { event: task, lane: lane };
              hit.addEventListener('click', function () {
                state.selectedEvent = task.id;
                state.selectedTensor = null;
                state.selectedRequest = null;
                render();
              });
              hitLayer.appendChild(hit);
            }
          });
        });
        var traceRoot = document.querySelector('.so-trace');
        if (traceRoot) traceHoverController = window.PtoSwimlaneTaskPattern.initHoverTooltip({
          root: traceRoot,
          targets: '[data-trace-hit]',
          appendTo: traceRoot,
          bounds: traceRoot,
          getTask: function (target) { return target.__ptoSwimlaneTask; },
          getTooltipHtml: traceTooltipHtml
        });
        document.querySelectorAll('[data-trace-canvas]').forEach(function (canvas) {
          var lane = canvas.getAttribute('data-trace-lane');
          var events = visibleEvents.filter(function (item) { return item.lane === lane; });
          canvas.addEventListener('click', function (event) {
            var bounds = canvas.getBoundingClientRect();
            var cycle = ((event.clientX - bounds.left) / Math.max(1, bounds.width)) * max;
            var hit = events.find(function (item) { return cycle >= item.start && cycle <= item.start + item.dur; }) || events[0];
            if (hit) {
              state.selectedEvent = hit.id;
              state.selectedTensor = null;
              state.selectedRequest = null;
              render();
            }
          });
        });
        drawMoeRankRelations();
        drawMoeTooltips();
      }

      function drawMoeRankRelations() {
        var evidence = currentEvidence();
        if (!evidence || evidence.group !== 'moe') return;
        var story = moeStoryFor(evidence);
        var svg = document.querySelector('[data-moe-relations-svg]');
        var stage = document.querySelector('[data-moe-timeline-stage]');
        if (!svg || !stage) return;
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        if (!state.crossRankRelationsEnabled) return;
        var stageRect = stage.getBoundingClientRect();
        var svgRect = svg.getBoundingClientRect();
        var ns = 'http://www.w3.org/2000/svg';
        var defs = document.createElementNS(ns, 'defs');
        var marker = document.createElementNS(ns, 'marker');
        marker.setAttribute('id', 'moe-arrow'); marker.setAttribute('viewBox', '0 0 10 10'); marker.setAttribute('refX', '9'); marker.setAttribute('refY', '5'); marker.setAttribute('markerWidth', '5'); marker.setAttribute('markerHeight', '5'); marker.setAttribute('orient', 'auto-start-reverse');
        var arrow = document.createElementNS(ns, 'path'); arrow.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z'); arrow.setAttribute('fill', 'currentColor'); marker.appendChild(arrow); defs.appendChild(marker); svg.appendChild(defs);
        function phaseNode(rankName, phaseId) { return document.querySelector('[data-moe-rank-track="' + CSS.escape(rankName) + '"] [data-moe-phase="' + CSS.escape(phaseId) + '"]'); }
        function point(node) {
          if (!node) return null;
          var rect = node.getBoundingClientRect();
          return { x: rect.left + rect.width / 2 - svgRect.left, y: rect.top + rect.height / 2 - svgRect.top };
        }
        function allowed(source, target) {
          if (state.crossRankRelationScope === 'all') return true;
          if (state.selectedRank) return source === state.selectedRank || target === state.selectedRank;
          return source === story.criticalRank || target === story.criticalRank;
        }
        function addPath(relation, kind, variant, from, to) {
          if (!from || !to) return;
          var dx = Math.max(28, Math.abs(to.x - from.x) * .38);
          var path = document.createElementNS(ns, 'path');
          path.setAttribute('class', 'so-moe-relation ' + kind + ' ' + (variant || ''));
          path.setAttribute('d', 'M ' + from.x + ' ' + from.y + ' C ' + (from.x + dx) + ' ' + from.y + ', ' + (to.x - dx) + ' ' + to.y + ', ' + to.x + ' ' + to.y);
          path.setAttribute('marker-end', 'url(#moe-arrow)');
          path.setAttribute('data-moe-relation-kind', kind);
          var title = document.createElementNS(ns, 'title'); title.textContent = relation.label || kind; path.appendChild(title);
          path.addEventListener('click', function () {
            state.selectedRank = relation.target || relation.source;
            state.selectedPhase = relation.targetPhase || relation.sourcePhase || null;
            state.selectedTimeWindow = null;
            render();
          });
          svg.appendChild(path);
        }
        if (state.crossRankRelationKinds.communication) {
          story.tokenFlows.forEach(function (flow) {
            if (!allowed(flow.source, flow.target)) return;
            var dispatch = { source: flow.source, target: flow.target, sourcePhase: 'dispatch', targetPhase: 'dispatch', label: flow.source + ' → ' + flow.target + ' · Dispatch · ' + Number(flow.tokens).toLocaleString() + ' tokens' };
            addPath(dispatch, 'communication', 'dispatch', point(phaseNode(flow.source, 'dispatch')), point(phaseNode(flow.target, 'dispatch')));
            var gather = { source: flow.target, target: flow.source, sourcePhase: 'gather', targetPhase: 'gather', label: flow.target + ' → ' + flow.source + ' · Gather · ' + Number(flow.tokens).toLocaleString() + ' tokens' };
            addPath(gather, 'communication', 'gather', point(phaseNode(flow.target, 'gather')), point(phaseNode(flow.source, 'gather')));
          });
        }
        if (state.crossRankRelationKinds.dependency) {
          story.dependencies.forEach(function (dependency) {
            if (!allowed(dependency.source, dependency.target)) return;
            addPath(dependency, 'dependency', '', point(phaseNode(dependency.source, dependency.sourcePhase)), point(phaseNode(dependency.target, dependency.targetPhase)));
          });
        }
      }

      function moeTooltipHtml(item) {
        if (item.isRank) {
          return '<div class="pto-swimlane-task-tooltip__title"><span class="so-trace-tooltip-swatch" style="background:' + esc(item.color || '#5f6775') + '"></span>' + esc(item.rank + ' summary') + '</div>' +
            '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">routed tokens</span><span class="pto-swimlane-task-tooltip__value">' + item.tokens + ' · ' + item.delta + ' vs avg</span></div>' +
            '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">window</span><span class="pto-swimlane-task-tooltip__value">' + item.window + '</span></div>' +
            '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">expert</span><span class="pto-swimlane-task-tooltip__value">' + item.expert + '</span></div>' +

        }

          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">core</span><span class="pto-swimlane-task-tooltip__value">' + esc(item.core || 'Rank phase') + '</span></div>' +

          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">duration</span><span class="pto-swimlane-task-tooltip__value">' + item.duration + ' μs · ' + item.share + '% of Rank window</span></div>' +
          '<div class="pto-swimlane-task-tooltip__row"><span class="pto-swimlane-task-tooltip__key">routed tokens</span><span class="pto-swimlane-task-tooltip__value">' + item.tokens + '</span></div>';
      }

      function drawMoeTooltips() {
        var evidence = currentEvidence();
        if (!evidence || evidence.group !== 'moe' || !window.PtoSwimlaneTaskPattern) return;
        var story = moeStoryFor(evidence);
        var stage = document.querySelector('[data-moe-timeline-stage]');
        if (!stage) return;
        stage.querySelectorAll('[data-moe-phase], .so-moe-rank-label').forEach(function (node) {
          var rankName = node.getAttribute('data-rank');
          var rank = moeRankFor(story, rankName);
          if (!rank) return;
          if (node.classList.contains('so-moe-rank-label')) {
            var signal = moeRankSignal(story, rank);
            node.__ptoMoeTooltipTask = {
              isRank: true,
              rank: rank.name,
              color: rank.color,
              tokens: Number(rank.routedTokens).toLocaleString(),
              delta: moeTokenDelta(rank, moeDerived(story)),
              window: moeDurationMs(story.totalWindow),
              expert: moeDurationMs(rank.phaseDurations['expert-compute']),
              wait: moeDurationMs(rank.phaseDurations['wait-sync']),
              signal: signal.label
            };
            return;
          }
          var phaseId = node.getAttribute('data-moe-phase');
          var phase = moeRankPhases(story, rank).find(function (item) { return item.id === phaseId; });
          if (!phase) return;
          var coreRow = node.closest('.so-moe-core-row');
          node.__ptoMoeTooltipTask = {
            rank: rank.name,
            phaseLabel: phase.label,
            core: coreRow ? (coreRow.querySelector('.so-moe-core-label strong') || {}).textContent : null,
            color: phase.color,
            start: Math.round(phase.start),
            duration: Math.round(phase.duration),
            share: phase.share.toFixed(1),
            tokens: Number(rank.routedTokens).toLocaleString()
          };
        });
        moeHoverController = window.PtoSwimlaneTaskPattern.initHoverTooltip({
          root: stage,
          targets: '[data-moe-phase], .so-moe-rank-label',
          appendTo: stage,
          bounds: stage,
          getTask: function (target) { return target.__ptoMoeTooltipTask; },
          getTooltipHtml: function (task) { return moeTooltipHtml(task); }
        });
      }
