            state.selectedRank = rankName;
            state.selectedPhase = phaseId;
            state.selectedTimeWindow = phase ? [phase.start, phase.end] : null;
            state.coreFilter = 'all';
            state.selectedEvent = null;
            state.selectedTensor = null;
            render();
          });
        });
        document.querySelectorAll('[data-moe-findings-toggle]').forEach(function (el) {
          el.addEventListener('click', function () { state.expandedFindings = !state.expandedFindings; render(); });
        });
        document.querySelectorAll('[data-moe-relations-toggle]').forEach(function (el) {
          el.addEventListener('change', function () {
            state.crossRankRelationsEnabled = el.checked;
            if (el.checked && !state.crossRankRelationKinds.communication && !state.crossRankRelationKinds.dependency) state.crossRankRelationKinds.communication = true;
            render();
          });
        });
        document.querySelectorAll('[data-moe-relation-kind]').forEach(function (el) {
          el.addEventListener('click', function () {
            var kind = el.getAttribute('data-moe-relation-kind');
            state.crossRankRelationKinds[kind] = !state.crossRankRelationKinds[kind];
            state.crossRankRelationsEnabled = true;
            render();
          });
        });
        document.querySelectorAll('[data-moe-relation-scope]').forEach(function (el) {
          el.addEventListener('click', function () { state.crossRankRelationScope = el.getAttribute('data-moe-relation-scope'); state.crossRankRelationsEnabled = true; render(); });
        });
        document.querySelectorAll('[data-core-filter]').forEach(function (el) {
          el.addEventListener('click', function () { state.coreFilter = el.getAttribute('data-core-filter'); state.selectedEvent = null; state.selectedTensor = null; render(); });
        });
        document.querySelectorAll('[data-trace-view]').forEach(function (el) {
          el.addEventListener('click', function () { state.traceView = el.getAttribute('data-trace-view'); render(); });
        });
        document.querySelectorAll('[data-evidence-tab]').forEach(function (el) {
          el.addEventListener('click', function () { state.evidenceTab = el.getAttribute('data-evidence-tab'); render(); });
        });
        document.querySelectorAll('[data-compare-open-trace]').forEach(function (el) {
          el.addEventListener('click', function () { state.currentCandidate = el.getAttribute('data-compare-open-trace'); state.observeTab = 'trace'; state.route = 'observe'; state.selectedRank = null; state.selectedPhase = null; state.selectedTimeWindow = null; state.selectedEvent = null; state.crossRankRelationsEnabled = false; render(); });
        });
        document.querySelectorAll('[data-scenario-template]').forEach(function (el) {
          el.addEventListener('click', function () { applyScenarioTemplate(el.getAttribute('data-scenario-template')); render(); });
        });
        document.querySelectorAll('[data-draft-pattern]').forEach(function (el) {
          el.addEventListener('click', function () { state.scenarioDraft.trafficPattern = el.getAttribute('data-draft-pattern'); state.scenarioDraft.status = 'editing'; render(); });
        });
        document.querySelectorAll('[data-draft-field]').forEach(function (el) {
          el.addEventListener('change', function () {
            var field = el.getAttribute('data-draft-field');
            var numericFields = ['requestRate', 'promptTokens', 'outputTokens', 'prefillRatio', 'previewTime', 'nodes', 'devicesPerNode', 'dp', 'tp', 'ep', 'maxSequences', 'memoryUtilization'];
            state.scenarioDraft[field] = numericFields.indexOf(field) >= 0 ? Number(el.value) : el.value;
            state.scenarioDraft.status = 'editing';
            render();
          });
        });
        document.querySelectorAll('[data-observation]').forEach(function (el) {
          el.addEventListener('change', function () {
            var id = el.getAttribute('data-observation');
            var next = state.scenarioDraft.observation.filter(function (item) { return item !== id; });
            if (el.checked) next.push(id);
            state.scenarioDraft.observation = next;
            state.scenarioDraft.status = 'editing';
            render();
          });
        });
        document.querySelectorAll('[data-viz-mode]').forEach(function (el) {
          el.addEventListener('click', function () { state.scenarioDraft.visualizationMode = el.getAttribute('data-viz-mode'); render(); });
        });
        var modelLayerSelect = document.querySelector('[data-model-layer]');
        if (modelLayerSelect) modelLayerSelect.addEventListener('change', function () {
          state.scenarioDraft.modelLayer = modelLayerSelect.value;
          state.scenarioDraft.status = 'editing';
          render();
        });
        document.querySelectorAll('[data-model-layer-button]').forEach(function (el) {
          el.addEventListener('click', function () {
            state.scenarioDraft.modelLayer = el.getAttribute('data-model-layer-button');
            state.scenarioDraft.status = 'editing';
            render();
          });
        });
        document.querySelectorAll('[data-planned-device]').forEach(function (el) {
          el.addEventListener('click', function () { state.scenarioDraft.selectedDevice = Number(el.getAttribute('data-planned-device')); render(); });
        });
        var dseIntent = document.querySelector('[data-dse-intent]');
        if (dseIntent) dseIntent.addEventListener('input', function () {
          state.scenarioExplore.intent = dseIntent.value;
          state.scenarioExplore.parsed = false;
        });
        document.querySelectorAll('[data-dse-edit]').forEach(function (el) {
          el.addEventListener('click', function () {
            var group = el.getAttribute('data-dse-edit');
            state.scenarioExplore.editingGroup = state.scenarioExplore.editingGroup === group ? null : group;
            render();
          });
        });
        document.querySelectorAll('[data-dse-field]').forEach(function (el) {
          function syncDseField() {
            var field = el.getAttribute('data-dse-field');
            var numericFields = ['requestRate', 'concurrency', 'promptP95', 'outputP50', 'ttftSla', 'tpotSla', 'maxDevices', 'hbmReserve'];
            state.scenarioExplore[field] = numericFields.indexOf(field) >= 0 ? Number(el.value) : el.value;
            state.scenarioExplore.dirty = true;
          }
          el.addEventListener('input', function () {
            syncDseField();
            var update = document.querySelector('[data-action="update-design-space"]');
            var changeState = document.querySelector('.so-dse-change-state');
            if (update) update.disabled = false;
            if (changeState) { changeState.classList.add('is-dirty'); changeState.textContent = '条件已变更，右侧仍为上一轮结果'; }
          });
          el.addEventListener('change', function () {
            syncDseField();
            render();
          });
        });
        document.querySelectorAll('[data-dse-mode]').forEach(function (el) {
          el.addEventListener('click', function () {
            state.scenarioExplore.evaluationMode = el.getAttribute('data-dse-mode');
            state.scenarioExplore.dirty = true;
            render();
          });
        });
        document.querySelectorAll('[data-dse-search-strategy]').forEach(function (el) {
          el.addEventListener('click', function () {
            state.scenarioExplore.searchStrategy = el.getAttribute('data-dse-search-strategy');
            state.scenarioExplore.dirty = true;
            render();
          });
        });
        document.querySelectorAll('[data-dse-brute-mode]').forEach(function (el) {
          el.addEventListener('click', function () {
            state.scenarioExplore.searchBruteMode = el.getAttribute('data-dse-brute-mode');
            state.scenarioExplore.dirty = true;
            render();
          });
        });
        var dseSearchBudget = document.querySelector('[data-dse-search-budget]');
        if (dseSearchBudget) dseSearchBudget.addEventListener('input', function () {
          var explore = state.scenarioExplore;
          var mode = explore.searchStrategy || 'quick';
          var value = Number(dseSearchBudget.value);
          if (mode === 'quick') explore.searchIterations = value;
          else explore.searchBudget = value;
          explore.dirty = true;
          var label = document.querySelector('[data-dse-search-budget-label]');
          var bruteMode = explore.searchBruteMode || 'automatic';
          if (label) label.textContent = mode === 'quick' ? value + ' iterations · ' + (value + 10) + ' candidates' : mode === 'optuna' ? value + ' trials' : (bruteMode === 'manual' ? value + ' combinations' : value + ' candidates');
          var update = document.querySelector('[data-action="update-design-space"]');
          var changeState = document.querySelector('.so-dse-change-state');
          if (update) update.disabled = false;
          if (changeState) { changeState.classList.add('is-dirty'); changeState.textContent = '条件已变更，右侧仍为上一轮结果'; }
        });
        document.querySelectorAll('[data-dse-candidate]').forEach(function (el) {
          el.addEventListener('click', function () {
            state.scenarioExplore.selectedCandidate = el.getAttribute('data-dse-candidate');
            render();
          });
        });
        document.querySelectorAll('[data-action]').forEach(function (el) {
          el.addEventListener('click', function () {
            var action = el.getAttribute('data-action');
            if (action === 'import-config') { state.modal = 'import'; renderModal(); }
            if (action === 'start-run') startRun();
            if (action === 'trace-zoom-in') { state.traceZoom = Math.min(2, +(state.traceZoom + .25).toFixed(2)); render(); }
            if (action === 'trace-zoom-out') { state.traceZoom = Math.max(.5, +(state.traceZoom - .25).toFixed(2)); render(); }
            if (action === 'show-more-lanes') { state.laneLimit += 18; render(); }
            if (action === 'new-scenario') { resetScenarioExplorer(); state.route = 'scenario-new'; state.scenarioCreatedNotice = null; render(); }
            if (action === 'copy-scenario') { copyCurrentScenarioToDraft(); render(); }
            if (action === 'save-scenario-draft') { state.scenarioDraft.status = 'saved'; render(); }
            if (action === 'create-scenario') createScenarioFromDraft();
            if (action === 'parse-scenario-intent') parseScenarioIntent();
            if (action === 'update-design-space') { state.scenarioExplore.dirty = false; state.scenarioExplore.revision += 1; state.scenarioExplore.selectedCandidate = 'balanced'; render(); }
            if (action === 'adopt-dse-candidate') createScenarioFromExplorer();
            if (action === 'run-created-scenario') { state.route = 'run'; startRun(); }
            if (action === 'rerun') startRun();
          });
        });
        var overviewSelect = document.querySelector('[data-action="overview-candidate-select"]');
        if (overviewSelect) overviewSelect.addEventListener('change', function () {
          state.currentCandidate = overviewSelect.value;
          state.selectedEvent = null;
          state.selectedRank = null;
          state.selectedPhase = null;
          state.selectedTimeWindow = null;
          state.crossRankRelationsEnabled = false;
          state.selectedRequest = null;
          render();
        });
        var traceCandidate = document.querySelector('[data-action="trace-candidate-select"]');
        if (traceCandidate) traceCandidate.addEventListener('change', function () { state.currentCandidate = traceCandidate.value; state.selectedEvent = null; state.selectedTensor = null; state.selectedRank = null; state.selectedPhase = null; state.selectedTimeWindow = null; state.crossRankRelationsEnabled = false; state.crossRankRelationKinds = { communication: true, dependency: false }; state.crossRankRelationScope = 'related'; state.coreFilter = 'all'; state.laneLimit = 18; render(); });
        var tracePreset = document.querySelector('[data-trace-preset]');
        if (tracePreset) tracePreset.addEventListener('change', function () { state.tracePreset = tracePreset.value; state.selectedEvent = null; state.laneLimit = 18; render(); });
        var traceSearch = document.querySelector('[data-trace-search]');
        if (traceSearch) traceSearch.addEventListener('change', function () { state.traceSearch = traceSearch.value; state.selectedEvent = null; state.laneLimit = 18; render(); });
        var select = document.querySelector('[data-action="candidate-select"]');
        if (select) select.addEventListener('change', function () { state.compareCandidate = select.value; render(); });
        var contextScenario = document.querySelector('[data-context-scenario]');
        if (contextScenario) contextScenario.addEventListener('change', function () {
          state.scenarioId = contextScenario.value;
          state.scenarioViewId = contextScenario.value;
          state.currentCandidate = null;
          state.compareCandidate = null;
          state.compareGroup = 'attention';
          syncScenarioCandidates();
          state.selectedEvent = null;
          state.selectedRequest = null;
          state.selectedRank = null;
          state.selectedPhase = null;
          state.selectedTimeWindow = null;
          state.crossRankRelationsEnabled = false;
          render();
        });
        var contextGroup = document.querySelector('[data-context-group]');
        if (contextGroup) contextGroup.addEventListener('change', function () {
          state.compareGroup = contextGroup.value;
          state.currentCandidate = null;
          state.compareCandidate = null;
          syncScenarioCandidates();
          state.selectedEvent = null;
          state.selectedRank = null;
          state.selectedPhase = null;
          state.selectedTimeWindow = null;
          state.crossRankRelationsEnabled = false;
          render();
        });
      }

      function parseScenarioIntent() {
        var explore = state.scenarioExplore;
        var intent = String(explore.intent || '');
        var requestRate = intent.match(/(\d+)\s*(?:req\/?s|requests?\/?s|请求\/?秒)/i);
        var ttft = intent.match(/TTFT[^\d]*(\d+(?:\.\d+)?)\s*ms/i);
        var tpot = intent.match(/TPOT[^\d]*(\d+(?:\.\d+)?)\s*ms/i);
        var devices = intent.match(/(\d+)\s*(?:张|卡|devices?)/i);
        if (requestRate) explore.requestRate = Number(requestRate[1]);
        if (ttft) explore.ttftSla = Number(ttft[1]);
        if (tpot) explore.tpotSla = Number(tpot[1]);
        if (devices) explore.maxDevices = Number(devices[1]);
        if (/A3/i.test(intent)) explore.deviceType = 'Ascend A3 96 GB';
        else if (/A2/i.test(intent)) explore.deviceType = 'Ascend A2 64 GB';
        if (/hardware benchmark|硬件实测|真实运行/i.test(intent)) explore.evaluationMode = 'hardware';
        else if (/fast estimate|快速估算|快速模式/i.test(intent)) explore.evaluationMode = 'fast';
        explore.parsed = true;
        explore.dirty = true;
        explore.editingGroup = null;
        render();
      }

      function createScenarioFromExplorer() {
        var explore = state.scenarioExplore;
        var candidate = currentDseCandidate();
        var serial = 43 + scenarios.length;
        var id = 'scenario-' + serial;
        var revision = 'SC-' + String(serial).padStart(3, '0') + ' r1';
        var item = {
          id: id,
          name: explore.model + ' · ' + candidate.name + ' Serving',
          subtitle: candidate.name + ' · Design space exploration',
          revision: revision,
          model: explore.model,
          workload: explore.requestRate + ' req/s · prompt P95 ' + explore.promptP95 + ' · output P50 ' + explore.outputP50,
          hardware: explore.deviceType + ' / ' + candidate.devices + ' devices',
          goal: 'P95 TTFT ≤ ' + explore.ttftSla + ' ms · P95 TPOT ≤ ' + explore.tpotSla + ' ms · maximize sustained throughput',
          kind: 'deepseek',
          evidenceGroups: ['attention', 'moe'],
          planning: {
            intent: explore.intent,
            scenarioSpec: {
              model: { name: explore.model, precision: explore.precision },
              workload: { requestRate: explore.requestRate, promptP95: explore.promptP95, outputP50: explore.outputP50, concurrency: explore.concurrency },
              sla: { p95TtftMs: explore.ttftSla, p95TpotMs: explore.tpotSla, objective: 'maximize sustained throughput' },
              hardwareBudget: { deviceType: explore.deviceType, maxDevices: explore.maxDevices, hbmReservePercent: explore.hbmReserve },
              evaluationMode: explore.evaluationMode
            },
            deploymentConfig: {
              candidateId: candidate.id,
              mode: candidate.split ? 'prefill-decode-disaggregated' : 'unified-serving',
              parallelism: JSON.parse(JSON.stringify(candidate.parallelism)),
              pools: JSON.parse(JSON.stringify(candidate.poolPlan)),
              schedulerPolicy: JSON.parse(JSON.stringify(candidate.schedulerPolicy)),
              memoryPolicy: JSON.parse(JSON.stringify(candidate.memoryPolicy))
            },
            evaluationEvidence: {
              throughputTokensPerSecond: candidate.throughput,
              p95TtftMs: candidate.ttft,
              p95TpotMs: candidate.tpot,
              hbmUtilizationPercent: candidate.hbm,
              kvHeadroomPercent: candidate.kv,
              concurrencyCapacity: candidate.concurrency,
              communicationPercent: candidate.communication,
              confidencePercent: candidate.confidence
            }
          }
        };
        scenarios.push(item);
        state.scenarioId = item.id;
        state.scenarioViewId = item.id;
        state.scenarioCreatedNotice = { id: item.id, name: item.name, revision: item.revision, candidate: candidate.name, evaluationMode: explore.evaluationMode };
        state.currentCandidate = null;
        state.compareCandidate = null;
        state.compareGroup = 'attention';
        syncScenarioCandidates();
        state.route = 'scenarios';
        render();
      }

      function createScenarioFromDraft() {
        var draft = state.scenarioDraft;
        var readiness = scenarioDraftReadiness(draft);
        if (!readiness.ready) { render(); return; }
        var serial = 43 + scenarios.length;
        var id = 'scenario-' + serial;
        var revision = 'SC-' + String(serial).padStart(3, '0') + ' r1';
        var item = {
          id: id,
          name: String(draft.name).trim(),
          subtitle: scenarioTemplates[draft.template].name + ' · Serving Scenario',
          revision: revision,
          model: 'DeepSeek V4',
          workload: draft.trafficPattern + ' · ' + draft.requestRate + ' req/s · prompt ' + draft.promptTokens + ' · output ' + draft.outputTokens,
          hardware: draft.nodes + ' node' + (draft.nodes > 1 ? 's' : '') + ' · Ascend A2 / ' + (draft.nodes * draft.devicesPerNode) + ' devices',
          goal: draft.goal,
          kind: draft.template === 'throughput' || draft.template === 'mixed-traffic' ? 'batching' : 'deepseek',
          evidenceGroups: draft.ep > 1 ? ['attention', 'moe'] : ['attention'],
          planning: JSON.parse(JSON.stringify(draft))
        };
        scenarios.push(item);
        state.scenarioId = item.id;
        state.scenarioViewId = item.id;
        state.scenarioCreatedNotice = { id: item.id, name: item.name, revision: item.revision };
        state.scenarioDraft.status = 'created';
        state.currentCandidate = null;
        state.compareCandidate = null;
        state.compareGroup = 'attention';
        syncScenarioCandidates();
        state.route = 'scenarios';
        render();
      }

      function startRun() {
        state.runStatus = 'Preparing'; state.runProgress = 12; render();
        window.setTimeout(function () { state.runStatus = 'Running'; state.runProgress = 42; render(); }, 650);
        window.setTimeout(function () { state.runStatus = 'Collecting evidence'; state.runProgress = 76; render(); }, 1450);
        window.setTimeout(function () { state.runStatus = 'Completed'; state.runProgress = 100; render(); }, 2350);
      }

      function renderModal() {
        var root = document.getElementById('modal-root');
        if (!state.modal) { root.innerHTML = ''; return; }
        var detail = scenarioDetail();
        if (state.modal === 'import') {
          root.innerHTML = '<div class="so-modal-backdrop" data-close-modal><section class="so-modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><div class="so-modal-head"><div><h2 id="import-title">导入 CLI</h2><p>解析当前 pypto-serving parser 支持的参数，并预览 Scenario 配置。</p></div><button class="so-button ghost" data-close-modal>关闭</button></div><div class="so-modal-body"><div class="so-field"><label>CLI command</label><input id="cli-input" class="so-input" value="pypto-serving --model /data/models/dsv4-flash-w8a8 --backend npu --platform a2a3 --devices 0,1,2,3,4,5,6,7 --dp 8 --tp 1 --ep 8 --max-model-len 8192 --max-num-seqs 32 --max-num-batched-tokens 512 --long-prefill-token-threshold 2048 --port 8000 --profile --profile-level e2e,kernel"></div><div class="so-import-preview so-card"><div class="so-card-head"><h3>解析预览</h3><span class="so-pill accent">14 supported</span></div><div class="so-card-body"><pre class="so-code">model: /data/models/dsv4-flash-w8a8\nbackend: npu\nplatform: a2a3\ndevices: 0,1,2,3,4,5,6,7\ndata_parallel_size: 8\ntensor_parallel_size: 1\nexpert_parallel_size: 8\nmax_model_len: 8192\nmax_num_seqs: 32\nmax_num_batched_tokens: 512\nlong_prefill_token_threshold: 2048\nport: 8000\nprofile: true\nprofile_level: e2e,kernel</pre><div class="so-divider"></div><div class="so-callout">当前 parser 不提供 --config 文件参数；节点拓扑、扩缩容、故障恢复与 rollout 也不进入 CLI 预览。</div></div></div></div><div class="so-modal-foot"><button class="so-button" data-close-modal>取消</button><button class="so-button primary" data-apply-import>应用到 Scenario revision</button></div></section></div>';
        } else {
          root.innerHTML = '<div class="so-modal-backdrop" data-close-modal><section class="so-modal" role="dialog" aria-modal="true" aria-labelledby="revision-title"><div class="so-modal-head"><div><h2 id="revision-title">创建 Scenario revision</h2><p>历史 Controlled Run 保持不可变快照。</p></div><button class="so-button ghost" data-close-modal>关闭</button></div><div class="so-modal-body"><div class="so-form-grid"><div class="so-field"><label>Revision name</label><input class="so-input" value="' + esc(detail.revision.replace(/r(\d+)$/, function (_, n) { return 'r' + (Number(n) + 1); })) + '"></div><div class="so-field"><label>变更原因</label><input class="so-input" value="调整 --max-num-batched-tokens"></div><div class="so-field full"><label>Scenario</label><input class="so-input" value="' + esc(detail.name + ' · ' + detail.revision) + '" disabled></div></div><div class="so-callout" style="margin-top:14px">Scenario 可以变化；RUN-042 仍绑定当前 revision，不会被回写。</div></div><div class="so-modal-foot"><button class="so-button" data-close-modal>取消</button><button class="so-button primary" data-apply-revision>保存 revision</button></div></section></div>';
        }
        root.querySelectorAll('[data-close-modal]').forEach(function (el) { el.addEventListener('click', function (event) { if (event.target === el || el.tagName === 'BUTTON') { state.modal = null; renderModal(); } }); });
        var apply = root.querySelector('[data-apply-import]');
        if (apply) apply.addEventListener('click', function () { state.modal = null; state.scenarioViewId = detail.id; render(); });
        var applyRevision = root.querySelector('[data-apply-revision]');
        if (applyRevision) applyRevision.addEventListener('click', function () {
          var revision = detail.revision;
          var match = revision.match(/^(.* r)(\d+)$/);
          detail.revision = match ? match[1] + (Number(match[2]) + 1) : revision + ' r2';
          state.scenarioViewId = detail.id;
          state.modal = null;
          state.route = 'scenarios';
          render();
        });
      }

      syncFromHash();
      syncScenarioCandidates();
      if (window.PtoServingProfiler) window.PtoServingProfiler.bind({ state: state, render: render });
      window.addEventListener('hashchange', function () { syncFromHash(); render(); });
      render();
      if (window.PtoDfxEvidence) {
        window.PtoDfxEvidence.load().then(function (bundle) {
          runtimeEvidence = bundle;
          findings = bundle.findings || findings;
          state.dfxStatus = 'ready';
          state.dfxError = null;
          render();
        }).catch(function (error) {
          state.dfxStatus = 'error';
          state.dfxError = error && error.message || String(error);
          render();
        });
      }
    }());
  </script>
</body>
</html>
