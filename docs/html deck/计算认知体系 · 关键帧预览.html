<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>从代码阅读到计算探索 · Compute Explorer</title>
<style>
:root{color-scheme:dark;--paper:#111419;--ink:#eff1f4;--muted:#a3afbd;--line:#303943;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10}
body{font:22px/1.5 var(--sans);color:var(--ink)}
main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--fit,1));background:var(--paper);overflow:hidden}
.mast,.footer{position:absolute;left:74px;right:74px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:15px var(--mono);letter-spacing:.08em;z-index:2}
.mast{top:38px;height:42px;border-bottom:1px solid var(--line)}
.mast b{color:#b8cced;font-weight:500}
header{position:absolute;top:112px;left:74px}
h1{margin:0;font-size:58px;line-height:1.15;font-weight:650;letter-spacing:-.04em}
header p{margin:12px 0 0;font-size:26px;color:#bfcbdc}
.diagram{position:absolute;inset:0;width:100%;height:100%}
.note{position:absolute;left:74px;top:343px;width:405px}
.kicker{font:15px var(--mono);letter-spacing:.1em;color:#a9c1e3}
.note h2{margin:17px 0 11px;font-size:32px;line-height:1.24;font-weight:630}
.note p{margin:0;height:72px;font-size:21px;color:#bfc8d2}
.pairs{margin-top:30px;border-top:1px solid var(--line)}
button{color:#c2cbd7;font:inherit;border:1px solid transparent;background:transparent;cursor:pointer}
button:focus-visible,[data-region]:focus-visible{outline:2px solid #adc7ef;outline-offset:4px}
.pairs button{display:flex;width:100%;text-align:left;align-items:center;gap:14px;height:54px;border-bottom:1px solid var(--line);font-size:20px;padding:0 10px}
.pairs button[aria-pressed="true"]{background:#212b36;color:#fff}
.pairs i{width:8px;height:8px;background:var(--pair-color)}
.rail{position:absolute;left:1572px;top:295px;width:274px;display:grid;gap:36px}
.rail button{display:grid;grid-template-columns:36px 1fr;align-content:center;text-align:left;height:110px;padding:7px 10px 7px 17px;border-left:1px solid var(--line)}
.rail button[aria-pressed="true"]{border-left:2px solid #aac3e8;background:#1b2430;color:#fff}
.rail small{font:15px var(--mono);color:#aab9cb;padding-top:7px}
.rail strong{font-size:29px;line-height:1.1;font-weight:620}
.rail span{grid-column:2;font-size:18px;color:#b6c0cc;margin-top:6px}
.rail em{grid-column:2;font:12px var(--mono);font-style:normal;color:#b5cff2;margin-top:5px;visibility:hidden}
.rail button[aria-pressed="true"] em{visibility:visible}
.footer{bottom:31px;height:57px;border-top:1px solid var(--line)}
.controls{display:flex;gap:7px;align-items:center;letter-spacing:0}
.controls button{padding:9px 13px;font:15px var(--mono)}
.controls button[aria-pressed="true"]{color:#fff;border-color:#53657a;background:#202a37}
.debug{position:absolute;left:74px;bottom:100px;display:flex;align-items:center;gap:13px;font:15px var(--mono);color:#bfcbdc}
.debug input{width:310px;accent-color:#a9c1e3}
[hidden]{display:none!important}
.view-label{text-anchor:middle;pointer-events:none}
.view-label .name{font:600 21px var(--mono);letter-spacing:.08em}
.view-label .role{font:620 27px var(--sans);fill:#f0f2f5}
.object-label{font:650 25px var(--sans);text-anchor:middle;fill:#eef2f8;pointer-events:none}
.object-label tspan{font:600 10px var(--mono);letter-spacing:.08em;fill:#b8c9df}
[data-region]{cursor:pointer}
.view-controls{display:flex;gap:3px;margin-top:20px}
.view-controls button,.debug button,.debug select{font:14px var(--mono);padding:8px 10px;border:1px solid #303943;background:#171d25;color:#c2cbd7}
.view-controls button[aria-pressed="true"],.debug button[aria-pressed="true"]{border-color:#728ba8;color:#fff;background:#263448}
.controls button:hover,.pairs button:hover,.rail button:hover{border-color:#596d86}
.pair-id{font:600 15px var(--mono);text-anchor:middle;pointer-events:none}
</style>
</head>
<body>
<main aria-label="从代码阅读到计算探索">
<div class="mast"><b>PyPTO 3.0 / COMPUTE EXPLORER</b><span>UX 设计 / 计算认知模型</span></div>
<header><h1>从代码阅读到计算探索</h1><p>建立三位一体的计算认知体系</p></header>
<svg class="diagram" viewBox="0 0 1920 1080" aria-label="计算、数据、时间三圆及其执行层级">
  <defs>
    <circle id="g" cx="-155" cy="-89.5" r="214"/>
    <circle id="a" cx="155" cy="-89.5" r="214"/>
    <circle id="p" cx="0" cy="179" r="214"/>
    <clipPath id="cg"><use href="#g"/></clipPath>
    <clipPath id="ca"><use href="#a"/></clipPath>
    <clipPath id="cp"><use href="#p"/></clipPath>
    <g id="wire" fill="none" stroke-width="1.65">
      <use href="#g" stroke="#728ba8"/><use href="#a" stroke="#688e88"/><use href="#p" stroke="#9d7c66"/>
    </g>
  </defs>
  <g id="leaders" fill="none" stroke-width="1.4" aria-hidden="true"></g>
  <g id="context" aria-hidden="true"></g>
  <g id="focus-plane">
    <use href="#g" fill="#243e5d" data-region="0" role="button" tabindex="0" aria-label="Graph / 计算"/>
    <use href="#a" fill="#204b48" data-region="1" role="button" tabindex="0" aria-label="Assignment / 数据"/>
    <use href="#p" fill="#573b2c" data-region="2" role="button" tabindex="0" aria-label="Pipeline / 时间"/>
    <use href="#g" clip-path="url(#ca)" fill="#366373" data-region="3" role="button" tabindex="0" aria-label="计算与数据"/>
    <use href="#g" clip-path="url(#cp)" fill="#55516b" data-region="4" role="button" tabindex="0" aria-label="计算与时间"/>
    <use href="#a" clip-path="url(#cp)" fill="#5c6247" data-region="5" role="button" tabindex="0" aria-label="数据与时间"/>
    <use href="#wire" pointer-events="none"/>
    <g clip-path="url(#cp)"><use href="#g" clip-path="url(#ca)" data-region="6" role="button" tabindex="0" aria-label="算子交集" fill="#273242" stroke="#a9bdd8" stroke-width="3"/></g>
  </g>
  <g id="focus-labels">
    <text class="view-label" data-x="-236" data-y="-126"><tspan class="name" fill="#bed5f5">GRAPH</tspan><tspan class="role" x="0" dy="35">计算</tspan></text>
    <text class="view-label" data-x="236" data-y="-126"><tspan class="name" fill="#b6e3d9">ASSIGNMENT</tspan><tspan class="role" x="0" dy="35">数据</tspan></text>
    <text class="view-label" data-x="0" data-y="251"><tspan class="name" fill="#f0c3a4">PIPELINE</tspan><tspan class="role" x="0" dy="35">时间</tspan></text>
    <text class="object-label" data-x="0" data-y="-7">算子<tspan x="0" dy="16">OPERATOR</tspan></text>
    <text class="pair-id" fill="#e6eff6" data-x="0" data-y="-94">01</text>
    <text class="pair-id" fill="#e6eff6" data-x="-84" data-y="55">02</text>
    <text class="pair-id" fill="#e6eff6" data-x="84" data-y="55">03</text>
  </g>
</svg>

<aside class="note" aria-label="当前模型说明">
  <div class="kicker" id="note-kicker">三个观察维度</div>
  <h2 id="note-title">同一个算子，三个视角</h2>
  <p id="note-copy">计算结构、数据分配与执行时间，共同描述一个算子的计算上下文。</p>
  <div class="pairs" aria-label="两两交集">
    <button type="button" data-pair="0" aria-pressed="false" style="--pair-color:#6e9cad"><i></i>01　计算 × 数据</button>
    <button type="button" data-pair="1" aria-pressed="false" style="--pair-color:#a299b6"><i></i>02　计算 × 时间</button>
    <button type="button" data-pair="2" aria-pressed="false" style="--pair-color:#a8aa78"><i></i>03　数据 × 时间</button>
  </div>
  <div class="view-controls" role="group" aria-label="聚焦视角">
    <button type="button" data-view="all">全部</button>
    <button type="button" data-view="graph">Graph</button>
    <button type="button" data-view="assignment">Assignment</button>
    <button type="button" data-view="pipeline">Pipeline</button>
  </div>
</aside>

<div class="rail" role="group" aria-label="执行层级" inert>
  <button type="button" data-level="0" aria-pressed="true"><small>01</small><strong>Operator</strong><span>完整算子上下文</span><em>FOCUS</em></button>
  <button type="button" data-level="1" aria-pressed="false"><small>02</small><strong>Block</strong><span>同组 Task 的分配</span><em>FOCUS</em></button>
  <button type="button" data-level="2" aria-pressed="false"><small>03</small><strong>Task</strong><span>批次与 KV Head</span><em>FOCUS</em></button>
  <button type="button" data-level="3" aria-pressed="false"><small>04</small><strong>Stack</strong><span>Task 内的一组 KV 页</span><em>FOCUS</em></button>
</div>

<div class="debug" hidden>
  <label for="progress">动画进度</label>
  <input type="range" id="progress" min="0" max="100" step="any" value="0">
  <output id="progress-value" for="progress">0%</output>
  <button id="playback" type="button">暂停</button>
  <label for="speed">速度</label>
  <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option></select>
  <button type="button" data-step="0">S0</button>
  <button type="button" data-step="1">S1</button>
  <button type="button" data-step="2">S2</button>
  <button type="button" data-step="3">S3</button>
  <button type="button" data-step="4">S4</button>
</div>
<div class="footer">
  <span id="scene-step">S0 / 三位一体</span>
  <div class="controls">
    <button id="previous" type="button">Previous</button>
    <button id="reset" type="button">Reset</button>
    <button id="next" type="button">Next</button>
  </div>
</div>
</main>
<script>
/* Timing in milliseconds. Story beats and the scrubber share this clock. */
const MOTION = Object.freeze({
  entrance:1000, relation:400, hold:260, tilt:820, spread:920, layer:780, view:340,
});
const relationStart = MOTION.entrance;
const relationSpan = MOTION.relation + MOTION.hold;
const relationEnd = relationStart + 4 * relationSpan;
const tiltEnd = relationEnd + MOTION.tilt;
const spreadEnd = tiltEnd + MOTION.spread;
const total = spreadEnd + MOTION.layer;
const steps = [relationStart,relationEnd,tiltEnd,spreadEnd,total];
const scene = document.querySelector('main');
const svg = document.querySelector('.diagram');
const rail = document.querySelector('.rail');
const levelButtons = [...rail.querySelectorAll('button')];
const pairButtons = [...document.querySelectorAll('[data-pair]')];
const viewButtons = [...document.querySelectorAll('[data-view]')];
const stepButtons = [...document.querySelectorAll('[data-step]')];
const slider = document.querySelector('#progress');
const playback = document.querySelector('#playback');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const levels = ['operator','block','task','stack'];
const layerCopy = [
  '观察整个算子的计算结构、数据分配与执行组织。',
  '观察同一执行分组内的 Task 分配与运行组织。',
  '沿同一个 Task 查看计算依赖、所属数据和执行阶段。',
  '观察同一批 KV 页如何参与计算，以及如何在阶段间流转。',
];
const views = ['all','graph','assignment','pipeline','graph-assignment','graph-pipeline','assignment-pipeline','center'];
const viewCopy = [
  ['同一个算子，三个视角','计算结构、数据分配与执行时间，共同描述一个算子的计算上下文。'],
  ['Graph / 计算','沿计算图观察操作与依赖，理解结果如何产生。'],
  ['Assignment / 数据','沿数据分配观察 Task 处理哪些数据，以及它们归属哪个 Block。'],
  ['Pipeline / 时间','沿执行时间观察任务如何组织，以及各阶段何时发生。'],
  ['计算 × 数据','计算任务如何划分，以及任务需要哪些数据。'],
  ['计算 × 时间','计算步骤如何依赖、排序并组织成流水。'],
  ['数据 × 时间','数据在各阶段如何流转，何时可以复用。'],
  ['算子 / Operator','三种视角共同描述同一个算子的计算上下文。'],
];
const regionColors = ['#243e5d','#204b48','#573b2c','#366373','#55516b','#5c6247','#273242'];
const regionBright = ['#315783','#2c685f','#79513a','#517f91','#756985','#727c55','#435a74'];
const regionDim = ['#192634','#172d2c','#30251f','#233740','#302e3b','#343727','#212a37'];
const regionSets = [[],[0],[1],[2],[3],[4],[5],[6]];
const labelOffsets = [[-236,-126],[236,-126],[0,251]];
const circlePositions = [[-155,-89.5],[155,-89.5],[0,179]];
const circleStarts = [[-89,-31],[89,-31],[0,71]];
const circles = ['g','a','p'].map(id => document.getElementById(id));
const clamp = n => Math.max(0,Math.min(1,n));
const lerp = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const segment = (t,a,b) => smooth(clamp((t-a)/(b-a)));
const mix = (a,b,t) => a.map((n,i) => lerp(n,b[i],t));
const unit = (length,index) => Array.from({length},(_,i) => Number(i===index));
const dominant = weights => weights.indexOf(Math.max(...weights));
const rgb = hex => [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
const color = channels => 'rgb('+channels.map(Math.round).join(' ')+')';
const neutral = regionColors.map(rgb);
const bright = regionBright.map(rgb);
const dim = regionDim.map(rgb);
const blendRegion = (region,weights) => color(neutral[region].map((_,channel) =>
  weights.reduce((sum,weight,view) => {
    const palette = view===0 ? neutral : regionSets[view].includes(region) ? bright : dim;
    return sum + weight*palette[region][channel];
  },0)
));
const svgNode = (name,parent) => parent.appendChild(document.createElementNS(svg.namespaceURI,name));
const matrix = (node,values) => node.setAttribute('transform','matrix('+values.join(' ')+')');
const point = (m,x,y) => [m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
const focusSeed = document.querySelector('#focus-plane');
const labelSeed = document.querySelector('#focus-labels');
const planes = levels.map((id,i) => {
  const fill = i ? focusSeed.cloneNode(true) : focusSeed;
  const labelGroup = i ? labelSeed.cloneNode(true) : labelSeed;
  if (i) {
    fill.removeAttribute('id');
    labelGroup.removeAttribute('id');
    svg.insertBefore(fill,labelSeed);
    svg.append(labelGroup);
  }
  fill.dataset.plane = id;
  const wire = svgNode('use',document.querySelector('#context'));
  wire.setAttribute('href','#wire');
  const line = svgNode('path',document.querySelector('#leaders'));
  const regions = [...fill.querySelectorAll('[data-region]')];
  const labels = [...labelGroup.children];
  labels[3].firstChild.nodeValue = ['算子','分组','任务','批次'][i];
  labels[3].querySelector('tspan').textContent = id.toUpperCase();
  return {fill,wire,line,regions,labelGroup,labels,x:1267+i*17,y:350+i*146};
});

const state = {
  time:0, requestedStep:0, speed:1, clock:null, frame:0,
  viewFocus:null, layerFocus:null, viewTween:null, layerTween:null,
};
let noteKey = '';

function storyView(time) {
  const sequence = [0,4,5,6,7];
  if (time <= relationStart) return unit(views.length,0);
  if (time >= relationEnd) {
    return mix(unit(views.length,7),unit(views.length,0),segment(time,relationEnd,relationEnd+MOTION.view));
  }
  const local = time-relationStart;
  const beat = Math.min(3,Math.floor(local/relationSpan));
  return mix(unit(views.length,sequence[beat]),unit(views.length,sequence[beat+1]),
    segment(local-beat*relationSpan,0,MOTION.relation));
}
function storyLayer(time) {
  return mix(unit(4,0),unit(4,2),segment(time,spreadEnd,total));
}
function resolveFocus(kind,time,now) {
  const automatic = kind==='view' ? storyView(time) : storyLayer(time);
  const chosen = state[kind+'Focus'];
  let to = chosen===null ? automatic : unit(automatic.length,chosen);
  if (kind==='layer' && chosen!==null) {
    to = mix(automatic,to,segment(time,tiltEnd,spreadEnd));
  }
  const tween = state[kind+'Tween'];
  if (!tween) return to;
  return mix(tween.from,to,segment(now,tween.start,tween.start+tween.duration));
}

/* All circle centers, clips, and strokes share the same animated geometry.
   The plane is an orthographic projection of a single X-axis tilt. */
function projectPlane(tilt,x,y,scale=1) {
  const vertical = Math.cos(Math.sin(tilt*Math.PI/2)*0.84);
  const roll = -tilt*.065;
  return [scale*Math.cos(roll),scale*Math.sin(roll),
    -scale*vertical*Math.sin(roll),scale*vertical*Math.cos(roll),x,y];
}
function paint(now=performance.now()) {
  const t = state.time;
  const tilt = segment(t,relationEnd,tiltEnd);
  const spread = segment(t,tiltEnd,spreadEnd);
  const viewWeights = resolveFocus('view',t,now);
  const layerWeights = resolveFocus('layer',t,now);
  const activeLayer = dominant(layerWeights);
  const activeView = dominant(viewWeights);
  const entry = circlePositions.map((_,i) => segment(t,i*120,MOTION.entrance-160+i*80));
  circles.forEach((circle,i) => {
    const [x,y] = mix(circleStarts[i],circlePositions[i],entry[i]);
    circle.setAttribute('cx',x);
    circle.setAttribute('cy',y);
    circle.setAttribute('r',lerp(163,214,entry[i]));
  });
  const foreground = projectPlane(tilt,lerp(1115,952,spread),lerp(545,552,spread),lerp(1,.92,spread));
  const palette = regionColors.map((_,i) => blendRegion(i,viewWeights));
  planes.forEach((plane,i) => {
    const staggered = segment(t,tiltEnd+i*95,spreadEnd-((3-i)*55));
    const contextMatrix = projectPlane(tilt,plane.x,plane.y,.60);
    contextMatrix[3] *= .58;
    const resting = mix(foreground,contextMatrix,staggered);
    const weight = layerWeights[i];
    const pose = mix(resting,foreground,weight);
    matrix(plane.fill,pose);
    matrix(plane.wire,pose);
    const visibleFill = smooth(weight) * segment(t,0,260);
    plane.fill.style.opacity = visibleFill;
    plane.wire.style.opacity = staggered * .63 * (1-visibleFill);
    plane.regions.forEach((region,j) => region.setAttribute('fill',palette[j]));
    const available = i===activeLayer && weight>.72 && t>=steps[0];
    plane.fill.style.pointerEvents = available ? '' : 'none';
    plane.fill.inert = !available;
    plane.fill.setAttribute('aria-hidden',String(!available));
    plane.regions.forEach(region => {
      if (region.hasAttribute('role')) region.setAttribute('tabindex',available ? '0' : '-1');
    });
    plane.labelGroup.style.opacity = segment(weight,.40,.90);
    plane.labels.forEach((label,j) => {
      let x=Number(label.dataset.x), y=Number(label.dataset.y);
      if (j<3) {
        const delta = mix(circleStarts[j],circlePositions[j],entry[j]);
        x = labelOffsets[j][0]+delta[0]-circlePositions[j][0];
        y = labelOffsets[j][1]+delta[1]-circlePositions[j][1];
      }
      const [px,py] = point(pose,x,y);
      label.setAttribute('transform',`translate(${px} ${py})`);
      const region = j<3 ? j : j===3 ? 6 : j-1;
      const emphasis = viewWeights.reduce((sum,value,view) =>
        sum+value*(view===0 || regionSets[view].includes(region) ? 1 : .64),0);
      label.style.opacity = (j<3 ? entry[j] : segment(t,610,MOTION.entrance))*emphasis;
    });
    const anchor = point(pose,367,-88);
    const labelY = 350+i*146;
    plane.line.setAttribute('d',`M${anchor.join(' ')} H1537 L1567 ${labelY}`);
    plane.line.setAttribute('stroke',color(mix(rgb('#465463'),rgb('#a8c1e3'),weight)));
    plane.line.style.opacity = segment(staggered,.72,1) * (.65+weight*.35);
    const button = levelButtons[i];
    const arrival = segment(staggered,.54,1);
    button.style.opacity = arrival;
    button.style.transform = `translate(${(1-arrival)*-24}px,${(1-arrival)*(pose[5]-labelY)*.2}px)`;
    button.setAttribute('aria-pressed',String(i===activeLayer));
  });
  rail.inert = spread<.98;
  pairButtons.forEach((button,i) => button.setAttribute('aria-pressed',String(activeView===i+4)));
  viewButtons.forEach((button,i) => button.setAttribute('aria-pressed',String(activeView===i)));
  const step = steps.findIndex(end => t<=end+.001);
  document.querySelector('#scene-step').textContent = 'S'+step+' / '+['三位一体','建立关联','空间倾斜','层级展开','跨层聚焦'][step];
  stepButtons.forEach((button,i) => button.setAttribute('aria-pressed',String(step===i)));
  slider.value = 100*t/total;
  document.querySelector('#progress-value').value = Math.round(100*t/total)+'%';
  playback.textContent = state.clock ? '暂停' : '播放';
  const layered = spread>.8;
  const key = [activeView,activeLayer,step,layered].join('/');
  if (noteKey !== key) {
    noteKey = key;
    document.querySelector('#note-kicker').textContent = layered ? '当前粒度 / '+levels[activeLayer].toUpperCase() : '三个观察维度';
    document.querySelector('#note-title').textContent = activeView===0 && layered ? '下钻粒度，保留视角' : viewCopy[activeView][0];
    document.querySelector('#note-copy').textContent = activeView===0 && layered ? layerCopy[activeLayer] : viewCopy[activeView][1];
  }
}
function schedule() {
  if (!state.frame) state.frame = requestAnimationFrame(tick);
}
function tick(now) {
  state.frame = 0;
  if (state.clock) {
    const {from,to,start} = state.clock;
    const elapsed = Math.max(0,now-start)*state.speed;
    state.time = from + Math.sign(to-from)*Math.min(Math.abs(to-from),elapsed);
    if (state.time===to) state.clock = null;
  }
  for (const kind of ['view','layer']) {
    const tween = state[kind+'Tween'];
    if (tween && now>=tween.start+tween.duration) state[kind+'Tween']=null;
  }
  paint(now);
  if (state.clock || state.viewTween || state.layerTween) schedule();
}
function play(to) {
  state.resumeTo = to;
  if (state.time===to || reducedMotion.matches) {
    state.time=to;
    state.clock=null;
  } else {
    state.clock={from:state.time,to,start:performance.now()};
    schedule();
  }
  paint();
}
function changeFocus(kind,index) {
  const now = performance.now();
  const from = resolveFocus(kind,state.time,now);
  state[kind+'Focus']=index;
  state[kind+'Tween']=reducedMotion.matches ? null : {from,start:now,duration:MOTION[kind]};
  paint(now);
  schedule();
}
function goToStep(index) {
  if (!Number.isInteger(index) || index<0 || index>=steps.length) return false;
  state.requestedStep=index;
  if (state.viewFocus!==null) changeFocus('view',null);
  if (state.layerFocus!==null) changeFocus('layer',null);
  play(steps[index]);
  return true;
}
function next() { return goToStep(state.requestedStep+1); }
function previous() { return goToStep(state.requestedStep-1); }
function seek(time) {
  state.clock=null;
  state.resumeTo=total;
  state.time=time;
  state.requestedStep=steps.findIndex(end => time<=end+.001);
  state.viewFocus=state.layerFocus=state.viewTween=state.layerTween=null;
  paint();
}
function reset() { seek(0); play(steps[0]); }
function focusLayer(id) {
  const index=levels.indexOf(id);
  if (index<0 || state.time<spreadEnd) return false;
  changeFocus('layer',index);
  return true;
}
function focusView(id,intersection='graph-assignment') {
  const index=views.indexOf(id==='intersection' ? intersection : id);
  if (index<0) return false;
  changeFocus('view',index);
  return true;
}
window.ComputeExplorerStory=Object.freeze({
  next,previous,reset,goToStep,focusLayer,focusView,
  getState() {
    const now = performance.now();
    const view = dominant(resolveFocus('view',state.time,now));
    return {
      presentationProgress:state.time/total,
      viewFocus:view>=4 ? 'intersection' : views[view],
      intersection:view>=4 ? views[view] : null,
      layerFocus:levels[dominant(resolveFocus('layer',state.time,now))],
    };
  },
});
function selectRegion(region) {
  const selected=views[region+1];
  const current=dominant(resolveFocus('view',state.time,performance.now()));
  focusView(views[current]===selected ? 'all' : selected);
}
planes.forEach(plane => plane.regions.forEach((node,i) => {
  node.addEventListener('click',() => selectRegion(i));
  node.addEventListener('keydown',event => {
    if (event.key==='Enter' || event.key===' ') { event.preventDefault(); selectRegion(i); }
  });
}));
levelButtons.forEach((button,i) => button.onclick=() => focusLayer(levels[i]));
pairButtons.forEach((button,i) => button.onclick=() => selectRegion(i+3));
viewButtons.forEach((button,i) => button.onclick=() => focusView(views[i]));
document.querySelector('#next').onclick=next;
document.querySelector('#previous').onclick=previous;
document.querySelector('#reset').onclick=reset;
slider.oninput=() => seek(Number(slider.value)*total/100);
playback.onclick=() => {
  if (state.clock) { state.clock=null; paint(); }
  else play(state.time===state.resumeTo ? (state.time===total ? 0 : total) : state.resumeTo);
};
document.querySelector('#speed').onchange=event => {
  if (state.clock) state.clock={from:state.time,to:state.clock.to,start:performance.now()};
  state.speed=Number(event.target.value);
};
stepButtons.forEach((button,i) => button.onclick=() => seek(steps[i]));
function fit() {
  scene.style.setProperty('--fit',Math.min(innerWidth/1920,innerHeight/1080));
}
const params = new URLSearchParams(location.search);
document.querySelector('.debug').hidden=!params.has('debug');
const captures = {s0:steps[0],s1:relationStart+MOTION.relation,s2:relationEnd+MOTION.tilt/2,s3:steps[3],s4:steps[4]};
const capture=params.get('frame');
addEventListener('resize',fit);
fit();
if (Object.hasOwn(captures,capture)) {
  seek(captures[capture]);
  if (params.get('view') && views.includes(params.get('view'))) {
    state.viewFocus=views.indexOf(params.get('view'));
    paint();
  }
} else {
  reset();
}
</script>
</body>
