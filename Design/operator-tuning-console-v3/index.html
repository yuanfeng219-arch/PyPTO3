<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning Atlas · decode_csa</title>
<meta name="description" content="把一次真实上板执行的每一个 AICore 块画成一格：两条可刷选的总览带、一张全块矩阵、一列 scope 图例，页面上唯一的大号文字是被选中的块数。">
<link rel="stylesheet" href="../../vendor/pto-design-system/tokens/foundation.css">
<link rel="stylesheet" href="../../vendor/pto-design-system/tokens/semantic.css">
<link rel="stylesheet" href="atlas.css?v=14">
</head>
<body>

<div class="atlas">

  <!-- 第 0 层：谁、哪一路。正文只有这一行标识 -->
  <header class="bar bar-top">
    <div class="bar-l">
      <span class="wordmark">TUNING ATLAS</span>
      <span class="seg" id="runSeg"></span>
    </div>
    <div class="bar-c">
      <button class="linkish" type="button" data-overlay="read">怎么读</button>
    </div>
    <div class="bar-r">
      <button class="linkish" type="button" data-overlay="about">关于这份 dump</button>
      <a class="linkish" href="../../launch.html">启动台</a>
    </div>
  </header>

  <!-- 第 1 层：两条可刷选的总览带 -->
  <section class="strips">
    <div class="strip" data-strip="seq">
      <div class="strip-hd">
        <span class="k">下发序</span>
        <span class="v">每块耗时 · 拖动选择区间</span>
        <span class="r" data-bind="seqRange"></span>
      </div>
      <canvas data-canvas="seq"></canvas>
    </div>
    <div class="strip" data-strip="time">
      <div class="strip-hd">
        <span class="k">墙钟时间</span>
        <span class="v">同时占用的核数 · 拖动选择窗口</span>
        <span class="r" data-bind="timeRange"></span>
      </div>
      <canvas data-canvas="time"></canvas>
    </div>
  </section>

  <!-- 第 2 层：排列与过滤开关 -->
  <div class="controls">
    <span class="ctl-lead">显示</span>
    <span class="seg" data-seg="scope-mode"></span>
    <span class="ctl-lead">按</span>
    <span class="seg" data-seg="order"></span>
    <span class="ctl-lead">排列</span>
    <button class="reset" type="button" data-act="reset">重置选择</button>
  </div>

  <!-- 第 3 层：主体 —— 一个块一格 -->
  <main class="body">
    <div class="matrix-wrap">
      <canvas data-canvas="matrix"></canvas>
    </div>
    <aside class="rail">
      <div class="rail-hd">
        <span class="k">单块耗时</span>
        <span class="v">决定颜色 · 可筛</span>
      </div>
      <div class="legend" data-bind="legend"></div>

      <div class="rail-hd rail-hd-2">
        <span class="k">SCOPE</span>
        <span class="v">点击筛选，可多选</span>
      </div>
      <div class="scopes" data-bind="scopes"></div>

      <div class="pathnote" data-bind="pathnote"></div>
    </aside>
  </main>

  <!-- 第 4 层：唯一的大号文字是一个数字 -->
  <div class="readout">
    <div class="big"><span data-bind="bigNum">0</span> <em>个块被选中</em></div>
    <div class="sub" data-bind="bigSub"></div>
  </div>

  <footer class="bar bar-bot">
    <span class="mono" data-bind="footL"></span>
    <span class="mono" data-bind="footC"></span>
    <span class="mono">V3 / ATLAS</span>
  </footer>

</div>

<!-- ===================================================================
     第二屏：单个 kernel 的详情。结构对应参考图的详情页 ——
     顶部胶片条（总览页筛出来的 kernel）→ 左栏构成 → 中央块分布 →
     右栏构成相近的 kernel。文字仍然只有极小号标签和数字。
     =================================================================== -->
<div class="detail" hidden>

  <header class="bar bar-top">
    <div class="bar-l">
      <button class="linkish" type="button" data-act="back">‹ 返回总览</button>
      <span class="dcrumb mono" data-bind="dCrumb"></span>
    </div>
    <div class="bar-c">
      <button class="linkish" type="button" data-overlay="read">怎么读</button>
    </div>
    <div class="bar-r">
      <button class="linkish" type="button" data-overlay="about">关于这份 dump</button>
      <a class="linkish" href="../../launch.html">启动台</a>
    </div>
  </header>

  <!-- 胶片条：选中的 kernel，当前那个高亮 -->
  <section class="filmstrip">
    <div class="fs-side">
      <button class="fs-count" type="button" data-act="cycle-sort">
        <span data-bind="fsCount">0</span><span class="caret">⌄</span>
      </button>
      <div class="fs-label" data-bind="fsLabel"></div>
    </div>
    <div class="fs-scroll"><canvas data-canvas="strip"></canvas></div>
  </section>

  <main class="dbody">

    <aside class="dleft">
      <div class="rail-hd">
        <span class="k">KERNEL</span>
        <span class="v">名字 · 三口径 · 来源</span>
      </div>
      <div class="dk-name" data-bind="dkName"></div>
      <div class="dk-sub mono" data-bind="dkSub"></div>

      <div class="dk-comp">
        <div class="dk-bar" data-bind="dkBar"></div>
        <div class="dk-key" data-bind="dkKey"></div>
      </div>

      <div class="rail-hd rail-hd-2">
        <span class="k">构成</span>
        <span class="v">展开 · 引擎 · 路径</span>
      </div>
      <div class="dk-facts" data-bind="dkFacts"></div>
    </aside>

    <div class="dcenter">
      <div class="dc-prov mono" data-bind="dProv"></div>
      <div class="dc-stage">
        <button class="dc-nav" type="button" data-act="prev" aria-label="上一个">‹</button>
        <div class="dc-plot"><canvas data-canvas="plot"></canvas></div>
        <button class="dc-nav" type="button" data-act="next" aria-label="下一个">›</button>
      </div>
      <div class="dc-face"><span class="seg" data-seg="face"></span></div>
    </div>

    <aside class="dright">
      <div class="rail-hd">
        <span class="k">构成相近</span>
        <span class="v">比例最接近</span>
      </div>
      <div class="simlist" data-bind="sim"></div>
    </aside>

  </main>

  <footer class="bar bar-bot">
    <span class="mono" data-bind="dFootL"></span>
    <span class="mono" data-bind="dFootC"></span>
    <span class="mono">V3 / KERNEL</span>
  </footer>

</div>

<div class="tip" data-bind="tip" hidden></div>

<div class="overlay" data-bind="overlay" hidden>
  <div class="sheet">
    <button class="sheet-x" type="button" data-act="close-overlay" aria-label="关闭">×</button>
    <div class="sheet-bd" data-bind="overlayBody"></div>
  </div>
</div>

<script src="../operator-tuning-console/data.js?v=13"></script>
<script src="atlas.js?v=17"></script>
</body>
</html>
