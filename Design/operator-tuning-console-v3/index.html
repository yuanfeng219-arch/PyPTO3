<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning Atlas · decode_csa</title>
<meta name="description" content="把一次真实上板执行的每一个 AICore 块画成一格：两条可刷选的总览带、一张全块矩阵、一列 scope 图例，页面上唯一的大号文字是被选中的块数。">
<link rel="stylesheet" href="../../vendor/pto-design-system/tokens/foundation.css">
<link rel="stylesheet" href="../../vendor/pto-design-system/tokens/semantic.css">
<link rel="stylesheet" href="atlas.css?v=9">
</head>
<body>

<div class="atlas">

  <!-- 第 0 层：谁、哪一路。正文只有这一行标识 -->
  <header class="bar bar-top">
    <div class="bar-l">
      <span class="wordmark">TUNING ATLAS</span>
      <span class="seg" id="runSeg"></span>
    </div>
    <div class="bar-c">
      <button class="linkish" type="button" data-overlay="read">怎么读</button>
    </div>
    <div class="bar-r">
      <button class="linkish" type="button" data-overlay="about">关于这份 dump</button>
      <a class="linkish" href="../../launch.html">启动台</a>
    </div>
  </header>

  <!-- 第 1 层：两条可刷选的总览带 -->
  <section class="strips">
    <div class="strip" data-strip="seq">
      <div class="strip-hd">
        <span class="k">下发序</span>
        <span class="v">每块耗时 · 拖动选择区间</span>
        <span class="r" data-bind="seqRange"></span>
      </div>
      <canvas data-canvas="seq"></canvas>
    </div>
    <div class="strip" data-strip="time">
      <div class="strip-hd">
        <span class="k">墙钟时间</span>
        <span class="v">同时占用的核数 · 拖动选择窗口</span>
        <span class="r" data-bind="timeRange"></span>
      </div>
      <canvas data-canvas="time"></canvas>
    </div>
  </section>

  <!-- 第 2 层：排列与过滤开关 -->
  <div class="controls">
    <span class="ctl-lead">显示</span>
    <span class="seg" data-seg="scope-mode"></span>
    <span class="ctl-lead">按</span>
    <span class="seg" data-seg="order"></span>
    <span class="ctl-lead">排列</span>
    <button class="reset" type="button" data-act="reset">重置选择</button>
  </div>

  <!-- 第 3 层：主体 —— 一个块一格 -->
  <main class="body">
    <div class="matrix-wrap">
      <canvas data-canvas="matrix"></canvas>
    </div>
    <aside class="rail">
      <div class="rail-hd">
        <span class="k">单块耗时</span>
        <span class="v">决定颜色 · 可筛</span>
      </div>
      <div class="legend" data-bind="legend"></div>

      <div class="rail-hd rail-hd-2">
        <span class="k">SCOPE</span>
        <span class="v">点击筛选，可多选</span>
      </div>
      <div class="scopes" data-bind="scopes"></div>

      <div class="pathnote" data-bind="pathnote"></div>
    </aside>
  </main>

  <!-- 第 4 层：唯一的大号文字是一个数字 -->
  <div class="readout">
    <div class="big"><span data-bind="bigNum">0</span> <em>个块被选中</em></div>
    <div class="sub" data-bind="bigSub"></div>
  </div>

  <footer class="bar bar-bot">
    <span class="mono" data-bind="footL"></span>
    <span class="mono" data-bind="footC"></span>
    <span class="mono">V3 / ATLAS</span>
  </footer>

</div>

<div class="tip" data-bind="tip" hidden></div>

<div class="overlay" data-bind="overlay" hidden>
  <div class="sheet">
    <button class="sheet-x" type="button" data-act="close-overlay" aria-label="关闭">×</button>
    <div class="sheet-bd" data-bind="overlayBody"></div>
  </div>
</div>

<script src="../operator-tuning-console/data.js?v=13"></script>
<script src="atlas.js?v=5"></script>
</body>
</html>
