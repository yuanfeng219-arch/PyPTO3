<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>计算领域体验设计创新</title>
<link rel="stylesheet" href="vendor/liquid-glass-controls/liquid-glass.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
.scene{min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;padding:7.2vh 3.55vw 7vh;background:url('assets/computing-innovation-bg.png') center bottom/cover no-repeat}
header{text-align:center;position:relative;z-index:1;margin-bottom:3vh}h1{font-family:inherit;font-weight:500;font-size:clamp(32px,3.65vw,90px);line-height:1.25;letter-spacing:-.035em;margin:0 0 1.7vh}header p{font-size:clamp(16px,1.5vw,36px);font-weight:400;letter-spacing:.015em;margin:0;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.45vw;flex:1;min-height:0}
.card[data-liquid-glass]{position:relative;isolation:isolate;border-radius:clamp(20px,1.4vw,36px);min-height:58vh;overflow:hidden;background:rgb(45 45 45 / 24%);box-shadow:inset 0 0 0 1px rgb(255 255 255 / 13%);}
.card::before{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,rgb(255 255 255 / 5%),transparent 35%,rgb(255 255 255 / 2%));box-shadow:inset 0 1px 1px rgb(255 255 255 / 23%)}
.card::after{display:none}
h2{position:relative;z-index:2;text-align:center;font-family:inherit;font-weight:500;font-size:clamp(25px,2.65vw,64px);line-height:1.27;margin:5.1vh 12px 0;letter-spacing:-.025em}
.card:nth-child(1){--light:#88ec30;--pale:#e3ffbc}.card:nth-child(2){--light:#1953fc;--pale:#c9e4ff}.card:nth-child(3){--light:#f6e900;--pale:#fffdb3}.card:nth-child(4){--light:#a459ff;--pale:#f9c9ff}
@media(min-aspect-ratio:2/1){.scene{min-height:100svh;padding-top:5vh}.card{min-height:60vh}}
@media(max-width:700px){.scene{padding:40px 20px;background-attachment:fixed}header{margin-bottom:28px}h1{font-size:30px}header p{font-size:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card[data-liquid-glass]{min-height:340px}h2{font-size:28px;margin-top:32px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.brand{position:absolute;top:28px;left:3.55vw;width:64px;height:64px;object-fit:contain;border-radius:14px}
.card:nth-child(1){--title-top:#e4ffbd;--title-bottom:#88ec30}.card:nth-child(2){--title-top:#c9deff;--title-bottom:#5986ff}.card:nth-child(3){--title-top:#fff2a1;--title-bottom:#ffd600}.card:nth-child(4){--title-top:#eed6ff;--title-bottom:#b073ff}
h2{background:linear-gradient(180deg,var(--title-top),var(--title-bottom));background-clip:text;-webkit-background-clip:text;color:transparent}
.card ul{position:relative;z-index:2;list-style:none;margin:5vh 0 0;padding:0 8%;display:grid;gap:22px;text-align:center}
.card li{font-size:clamp(16px,1.25vw,30px);line-height:1.5;font-weight:400;color:#f4f4f4;overflow-wrap:anywhere;letter-spacing:-.015em}
@media(max-width:700px){.brand{position:relative;top:auto;left:auto;width:44px;height:44px;margin-bottom:20px}.card ul{margin-top:28px;gap:16px}.card li{font-size:17px}}

/* Each card retains its portrait proportion as the viewport changes. */
.cards{flex:0 0 auto;align-items:start}
.card[data-liquid-glass]{aspect-ratio: .57;min-height:0}
h2{font-size:clamp(28px,2.65vw,64px);margin-top:12%;line-height:1.25}
.card ul{margin-top:14%;gap:clamp(16px,1.7vw,40px);padding:0 5%}
.card li{font-size:clamp(20px,1.65vw,40px);line-height:1.45}
.scene{background-position:center bottom}
@media(max-width:700px){.card[data-liquid-glass]{aspect-ratio:.57;min-height:0}.card li{font-size:clamp(14px,2.8vw,20px)}h2{font-size:clamp(22px,4.5vw,32px)}.card ul{gap:14px}}

/* Distribute the heading and product list through the card, rather than top stacking. */
.card[data-liquid-glass]{display:flex;flex-direction:column;align-items:stretch;padding:14% 0 13%}
.card h2{flex:0 0 auto;margin:0 12px;font-size:clamp(28px,2.65vw,64px)}
.card ul{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,2.4vw,58px);margin:10% 0 0;padding:0 5%}
@media(max-width:700px){.card[data-liquid-glass]{padding:14% 0 12%}.card h2{font-size:clamp(22px,4.5vw,32px)}.card ul{gap:20px;margin-top:12%}}
.product-logo{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-.2em;margin-right:.45em}

/* Center the title and cards together within the viewport. */
.scene{justify-content:center;padding-top:7vh;padding-bottom:7vh}
.brand{flex:none}
.product-logo{width:1.8em;height:1.8em;background:#fff;border-radius:.28em;padding:.18em;vertical-align:middle;object-fit:contain;margin-right:.45em}
.card li{display:flex;align-items:center;justify-content:center}
.product-logo[src*="ascend-community"]{width:2.35em;padding:.16em}
@media(max-width:700px){.scene{justify-content:center}.brand{position:absolute;top:18px;left:20px;margin:0}header{margin-top:42px}}
.product-logo[src*="mindstudio"],.product-logo[src*="ccae"]{background:transparent;padding:0;border-radius:0}

.pypto-logo{background:transparent;padding:0;border-radius:0}
.ascend-symbol{display:inline-block;position:relative;overflow:hidden;flex:0 0 1.8em;width:1.8em;height:1.8em;border-radius:.28em;background:white;margin-right:.45em}
.ascend-symbol img{position:absolute;max-width:none;width:4.65em;height:auto;clip-path:inset(0 72% 0 0);left:.25em;top:50%;transform:translateY(-50%)}

.ascend-symbol{background:transparent;border-radius:0;width:1.5em;height:1.5em;flex-basis:1.5em}
.ascend-symbol img{width:3.9em;left:.2em}

@keyframes welcome-rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
header{animation:welcome-rise .8s cubic-bezier(.22,.78,.3,1) both}
.card{animation:welcome-rise .9s cubic-bezier(.22,.78,.3,1) both}
.card:nth-child(1){animation-delay:.15s}.card:nth-child(2){animation-delay:.26s}.card:nth-child(3){animation-delay:.37s}.card:nth-child(4){animation-delay:.48s}
@media(prefers-reduced-motion:reduce){header,.card{animation:none}}
</style><link rel="stylesheet" href="home-pages.css"><link rel="stylesheet" href="opening-titles.css?v=1"><link rel="stylesheet" href="tour-brand.css?v=1"></head>
