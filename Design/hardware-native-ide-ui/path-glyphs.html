<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />

<body>
  <div class="hp-app">
    <header class="hp-top">
      <div class="hp-top-left">
        <span class="hp-brand">HARDWARE-NATIVE LENS</span>
        <span class="hp-mode">图元版</span>
        <span class="hp-crumb">decode_layer.py<i>/</i><b>fa_fused</b></span>
      </div>
      <div class="hp-top-right">
        <span class="hp-target" title="UB 保留区数据取自 pto-isa#170（a2a3）；Right 容量沿用 Lens 的示例口径">
          <span class="hp-dot"></span>目标 a2a3
        </span>
        <button class="hp-topbtn" type="button" id="hpStoryToggle" aria-controls="hpStoryPane" aria-expanded="false">显示主线</button>
      </div>
    </header>

    <main class="hp-main">
      <section class="hp-pane hp-code" id="hpCodePane" aria-label="算子代码">
        <header class="hp-pane-head">
          <span class="hp-pane-title">源码</span>
          <details class="pane-info"><summary aria-label="源码说明">ⓘ</summary><div class="pane-info-body">decode_layer.py · 728–798 · 40 行代码</div></details>
        </header>
        <div class="hp-code-body" id="hpCode"></div>
        <div class="hp-resize" id="hpCodeResize" role="separator" tabindex="0" aria-label="调整源码区宽度" aria-orientation="vertical" aria-controls="hpCodePane" title="拖动或使用左右方向键调整源码区宽度"></div>
      </section>

      <section class="hp-pane hp-mid" aria-label="算子逻辑与硬件映射">
        <div class="hp-logic" id="hpLogicPane">
          <header class="hp-pane-head">
            <span class="hp-pane-title">算子逻辑</span>
            <details class="pane-info"><summary aria-label="算子逻辑说明">ⓘ</summary><div class="pane-info-body" id="hpLogicMeta">fa_fused · 作用域、循环嵌套与计算链</div></details>
          </header>
          <div class="hp-logic-svg" id="hpLogic"></div>
        </div>
        <div class="hp-splitter" id="hpVerticalResize" role="separator" tabindex="0" aria-label="调整算子逻辑与硬件映射高度" aria-orientation="horizontal" aria-controls="hpLogicPane" title="拖动或使用上下方向键调整高度"></div>
        <div class="hp-chip">
          <header class="hp-pane-head">
            <span class="hp-pane-title">硬件映射</span>
            <details class="pane-info"><summary aria-label="硬件映射说明">ⓘ</summary><div class="pane-info-body"><p id="hpChipMeta">示意 · 不按比例 · Vec 地址条按比例</p></div></details>
          </header>
          <div class="hp-diagnostic" id="hpDiagnostic" aria-live="polite"></div>
          <div class="hp-svg" id="hpSvg"></div>
          <div class="hp-object-detail" id="hpCaption" aria-live="polite"></div>
        </div>
      </section>

      <aside class="hp-pane hp-story" id="hpStoryPane" aria-label="主线" hidden>
        <header class="hp-pane-head">
          <span class="hp-pane-title">诊断主线</span>
          <span class="hp-pane-meta">Pipeline · stage 2 → 4</span>
        </header>
        <div class="hp-story-body" id="hpStory"></div>
      </aside>
    </main>

    <footer class="hp-status">
      <span class="hp-status-main" id="hpStatus" aria-live="polite">—</span>
      <span class="hp-status-dim">编码期估算 · 未经编译 · 未上板</span>
    </footer>
  </div>

  <script src="../../vendor/pto-design-system/patterns/aic-core-object/pattern.js?v=20261103-error33"></script>

  <script src="./js/path-grid-glyphs.js?v=20261103-error33"></script>

  <script src="./js/logic-glyphs.js?v=20261106-glyphs1"></script>
  <script src="./js/path-glyphs.js?v=20261106-glyphs1"></script>
