    const codeResize = document.getElementById("hpCodeResize");
    lensToggle.addEventListener("click", () => {
      lensPane.hidden = !lensPane.hidden;
      codeResize.hidden = lensPane.hidden;

      storyPane.hidden = !storyPane.hidden;
      storyToggle.setAttribute("aria-expanded", String(!storyPane.hidden));
      const label = storyPane.hidden ? "显示主线" : "隐藏主线";

      storyToggle.title = label;
      syncResizeHandle();
