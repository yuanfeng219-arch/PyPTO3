<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>编译并上板 · 演示</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#101214;color:#e8ebea}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{height:54px;border-bottom:1px solid #303537;display:flex;align-items:center;padding:0 28px;justify-content:space-between;color:#aab2af;font-size:12px;letter-spacing:.08em}header b{color:#e6eae7}main{max-width:680px;margin:12vh auto 0;padding:0 24px 50px}.eyebrow{color:#c8ef6b;font-size:11px;letter-spacing:.16em;font-weight:700}h1{font-size:30px;letter-spacing:-.03em;margin:16px 0 8px}p{color:#9aa39f;line-height:1.7;font-size:14px}.card{margin-top:32px;border:1px solid #343b38;background:#191d1c;padding:26px;border-radius:8px}.progress{height:4px;background:#343c35;border-radius:4px;overflow:hidden;margin:22px 0 28px}.progress span{display:block;width:0;height:100%;background:#c8ef6b;transition:width .6s}.step{display:flex;gap:15px;align-items:flex-start;padding:14px 0;border-top:1px solid #303633}.icon{width:24px;height:24px;border:1px solid #515c54;color:#7e8b82;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}.step.active .icon{border-color:#c8ef6b;color:#c8ef6b;animation:pulse 1s infinite}.step.done .icon{background:#c8ef6b;border-color:#c8ef6b;color:#17200a}.step strong{display:block;font-size:14px}.step small{display:block;color:#89938d;margin-top:5px;line-height:1.5}.step:not(.active):not(.done){opacity:.52}.bottom{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px}.bottom a{font-size:13px;color:#b7c3b8}.next{background:#c8ef6b;color:#17200a!important;font-weight:700;padding:10px 16px;border-radius:4px;text-decoration:none}.next[hidden]{display:none}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.icon{animation:none!important}}
</style></head><body><header><b>HARDWARE-NATIVE LENS</b><span>编译 / 上板</span></header><main><div class="eyebrow">COMPILE → DEVICE → ANALYZE</div><h1 id="title">正在编译并上板</h1><p id="detail">正在准备演示流程，请稍候。</p><div class="card" aria-live="polite"><div class="progress" role="progressbar" aria-label="演示进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div><div class="step active"><span class="icon">1</span><div><strong>编译算子</strong><small>生成设备执行所需的编译产物</small></div></div><div class="step"><span class="icon">2</span><div><strong>上板执行</strong><small>加载产物并采集设备执行信息</small></div></div><div class="step"><span class="icon">3</span><div><strong>准备性能分析</strong><small>载入预置的设备 trace</small></div></div></div><p>演示流程：此处不会实际编译或连接设备；性能页面展示同一 CSA 运行的预置 trace，不会随前页交互参数变化。</p><div class="bottom"><a href="workbench.html">← 返回编码视图</a><a class="next" href="result.html" hidden>查看性能分析 →</a></div></main><script>
const steps=[...document.querySelectorAll('.step')], bar=document.querySelector('.progress'), fill=bar.firstElementChild, next=document.querySelector('.next');
function update(n){steps.forEach((step,i)=>{step.classList.toggle('done',i<n);step.classList.toggle('active',i===n);step.querySelector('.icon').textContent=i<n?'✓':i+1});let pct=[12,45,78,100][n];fill.style.width=pct+'%';bar.setAttribute('aria-valuenow',pct);if(n===3){document.querySelector('#title').textContent='演示流程已完成';document.querySelector('#detail').textContent='预置性能数据已准备就绪，即将进入分析页面。';next.hidden=false;setTimeout(()=>location.href='result.html',1800)}}
update(0);setTimeout(()=>update(1),1800);setTimeout(()=>update(2),3600);setTimeout(()=>update(3),5100);
</script></body></html>
