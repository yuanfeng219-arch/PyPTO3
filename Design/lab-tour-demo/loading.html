<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编译并上板 · CSA</title>
  <link rel="stylesheet" href="../hardware-native-ide-ui/styles/path.css?v=20261105-focus38" />
<style>
/* 同 workbench.html 的返回键，两页顶栏必须完全对齐 */
.demo-home{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border:1px solid #444;border-radius:5px;background:#1a1a1a;color:#c8d2ce;text-decoration:none}
.demo-home:hover,.demo-home:focus-visible{color:#fff;border-color:#9bafa3;background:#292f2b;outline:2px solid transparent;outline-offset:2px}
.demo-home:focus-visible{outline-color:var(--lime)}
.hp-topbtn{text-decoration:none}
.cb-clock{font:11px var(--mono);color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.cb-next{border-color:var(--lime);color:var(--lime)}
.cb-next:hover,.cb-next:focus-visible{background:rgba(177,239,107,.12);border-color:var(--lime);color:var(--lime)}
.cb-next[hidden]{display:none}

/* ── 进度梁：贴在顶栏下沿的 1px 线，IDE 自己的说法 ── */
.cb-main{position:relative;min-height:0;overflow-y:auto;background:var(--canvas);
  /* the single track must fill, or it shrinks to the rail's max-content width */
  /* safe center: centred when it fits, top-aligned when it would overflow */
  display:grid;grid-template-columns:minmax(0,1fr);align-items:safe center}
/* fixed, not absolute: .cb-main scrolls, and the beam belongs to the top bar */
.cb-beam{position:fixed;top:44px;left:0;z-index:5;height:1px;width:0;background:var(--lime);
  transition:width .5s linear}

/* width:100% is required — auto margins alone make a grid item shrink to max-content */
.cb-col{--lh:22px;width:100%;max-width:880px;margin:0 auto;padding:40px clamp(24px,4vw,40px)}
.cb-eyebrow{margin:0;font:600 10px/1.4 var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.cb-col h1{margin:14px 0 0;font:500 28px/1.25 var(--sans);letter-spacing:-.022em;color:var(--text)}
.cb-sub{margin:9px 0 0;color:var(--muted);font-size:13.5px;line-height:1.7;max-width:60ch}

/* ── 流水线轨：四个节点 + 会被走满的连线 ── */
.cb-rail{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;
  margin:46px 0 0;padding:0;list-style:none}
.cb-node{display:flex;flex-direction:column;align-items:center;gap:10px;width:126px;text-align:center}
.cb-tile{position:relative;width:42px;height:42px;display:grid;place-items:center;flex:none;
  border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--dim);
  transition:color .35s ease,border-color .35s ease,background-color .35s ease}
.cb-tile svg{width:19px;height:19px}
/* 运行中：一圈 1px 的呼吸环，保持平面无阴影 */
.cb-tile::after{content:"";position:absolute;inset:-4px;border:1px solid var(--c);border-radius:8px;opacity:0}
.cb-node[data-state="run"] .cb-tile{color:var(--c);border-color:var(--c)}
.cb-node[data-state="run"] .cb-tile::after{animation:cb-ring 1.5s ease-out infinite}
.cb-node[data-state="done"] .cb-tile{color:var(--c);border-color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,var(--surface))}
@keyframes cb-ring{0%{opacity:.55;transform:scale(.94)}70%,100%{opacity:0;transform:scale(1.1)}}
.cb-name{font:600 10px/1.4 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
  transition:color .35s ease}
.cb-node[data-state="run"] .cb-name,.cb-node[data-state="done"] .cb-name{color:var(--text)}
.cb-meta{min-height:1.4em;font:11px/1.4 var(--mono);color:var(--dim);white-space:nowrap;
  opacity:0;transition:opacity .45s ease}
.cb-node[data-state="done"] .cb-meta{opacity:1}

.cb-link{position:relative;height:1px;margin:21px 14px 0;background:var(--divider)}
.cb-link i{position:relative;display:block;height:100%;width:0;background:var(--c);transition:width linear}
.cb-link i::after{content:"";position:absolute;top:50%;right:-2px;width:4px;height:4px;margin-top:-2px;
  border-radius:50%;background:var(--c);opacity:0;transition:opacity .25s ease}
.cb-link[data-state="run"] i::after{opacity:1}

/* ── 日志：IDE 里本来就有的那条流 ── */
.cb-log{margin:44px 0 0;border:1px solid var(--divider);border-radius:5px;background:var(--surface);overflow:hidden}
.cb-log-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--divider)}
.cb-log-head .t{font:600 10px/1.4 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.cb-log-head .m{font:11px var(--mono);color:var(--dim)}
/* exactly 8 lines and no vertical padding, so a scroll always lands on a line */
.cb-log-body{height:calc(var(--lh) * 8);overflow-y:auto;padding:0;font:11.5px var(--mono)}
.cb-line{display:grid;grid-template-columns:52px 76px 1fr;gap:10px;padding:0 14px;
  line-height:var(--lh);color:var(--dim);animation:cb-in .32s ease both}
.cb-line .ts{color:#5a5a5a;font-variant-numeric:tabular-nums}
.cb-line .kind{color:var(--c);letter-spacing:.06em}
.cb-line .msg{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-line:last-child .msg{color:var(--text)}
@keyframes cb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.cb-foot{display:flex;align-items:center;gap:10px;margin:18px 2px 0;
  font:11px/1.6 var(--mono);color:var(--dim);letter-spacing:.04em}
.cb-foot .d{width:4px;height:4px;border-radius:50%;background:var(--lime);flex:none;
  animation:cb-breathe 2.4s ease-in-out infinite}
@keyframes cb-breathe{0%,100%{opacity:.3}50%{opacity:1}}

/* the 44px top bar has no room to wrap; drop the optional bits instead */
@media(max-width:620px){
  .hp-top{flex-wrap:nowrap}
  .hp-mode,.cb-clock{display:none}
}
@media(max-width:720px){
  .cb-rail{grid-template-columns:1fr;gap:0}
  .cb-node{flex-direction:row;width:auto;gap:14px;text-align:left}
  .cb-node .cb-name{flex:none;width:7em}
  .cb-link{height:18px;width:1px;margin:0 0 0 21px;background:var(--divider)}
  .cb-link i{width:1px;height:0;transition:height linear}
  .cb-link i::after{top:auto;bottom:-2px;right:50%;margin:0 -2px 0 0}
  .cb-col h1{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* 无顶栏时，主体占满视口，底部状态栏保持可见。 */
.cb-app { height:100dvh; min-height:0; grid-template-rows:minmax(0,1fr) auto; }
.cb-next { margin-top:16px; }
</style>
</head>
<body>
  <div class="hp-app cb-app">


    <main class="cb-main">
      <div class="cb-col">
        <p class="cb-eyebrow">Compile · Device · Analyze</p>
        <h1 id="title">正在编译并上板</h1>
        <p class="cb-sub" id="detail">把 <code>qk_pv</code> 的源码降到设备可执行的产物，再加载到 a2a3 上取回一次真实执行。</p>

        <ol class="cb-rail" id="rail" aria-label="编译上板流程">
          <li class="cb-node" data-state="done" style="--c:var(--muted)">
            <span class="cb-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5 5 12l4.5 5.5M14.5 6.5 19 12l-4.5 5.5"/></svg></span>
            <span class="cb-name">源码</span>
            <span class="cb-meta">208–313 行</span>
          </li>
          <li class="cb-link" data-state="idle" style="--c:var(--lav)" aria-hidden="true"><i></i></li>

          <li class="cb-node" data-state="idle" style="--c:var(--lav)">
            <span class="cb-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.1"/><circle cx="18" cy="7" r="2.1"/><circle cx="18" cy="17" r="2.1"/><path d="m8 11.2 7.9-3.5M8 12.8l7.9 3.5"/></svg></span>
            <span class="cb-name">编译产物</span>
            <span class="cb-meta" data-fill="51 passes"></span>
          </li>
          <li class="cb-link" data-state="idle" style="--c:var(--lime)" aria-hidden="true"><i></i></li>

          <li class="cb-node" data-state="idle" style="--c:var(--lime)">
            <span class="cb-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.6"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/></svg></span>
            <span class="cb-name">上板执行</span>
            <span class="cb-meta" data-fill="24 AIC · 48 AIV"></span>
          </li>
          <li class="cb-link" data-state="idle" style="--c:var(--sky)" aria-hidden="true"><i></i></li>

          <li class="cb-node" data-state="idle" style="--c:var(--sky)">
            <span class="cb-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8h9M4.5 12h14M4.5 16h6"/></svg></span>
            <span class="cb-name">性能 Trace</span>
            <span class="cb-meta" data-fill="30 tasks · 4.82 ms"></span>
          </li>
        </ol>

        <section class="cb-log" aria-label="编译日志">
          <header class="cb-log-head">
            <span class="t">Build log</span>
            <span class="m" id="logMeta">_jit_l3_decode_csa_20260903_010617</span>
          </header>
          <div class="cb-log-body" id="log" role="log" aria-live="polite"></div>
        </section>

        <p class="cb-foot"><span class="d" aria-hidden="true"></span>演示流程 · 此处不会实际编译或连接设备，性能页展示同一次 CSA 运行的预置 trace</p>
        <a class="hp-topbtn cb-next" id="next" href="result.html" hidden>查看性能分析 <span aria-hidden="true">→</span></a>
      </div>
    </main>

    <footer class="hp-status">
      <span class="hp-status-main" id="status" aria-live="polite">—</span>
      <span class="hp-status-dim">数据：真实编译产物 · 预置 trace · 未实时 profiling</span>
    </footer>
  </div>

<script>
const nodes  = [...document.querySelectorAll('.cb-node')];
const links  = [...document.querySelectorAll('.cb-link')];
const log    = document.getElementById('log');
const next   = document.getElementById('next');
const title  = document.getElementById('title');
const detail = document.getElementById('detail');
const statusLine = document.getElementById("status");
const still  = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 三段，各自的时长就是它那条连线被走满的时间 */
const STAGES = [
  { at:  .15, ms: 2150, node: 1, link: 0, kind: 'var(--lav)',
    title: '正在编译算子', detail: '降级、分块、内存复用，最后落到设备地址。',
    status: 'compile · lowering qk_pv' },
  { at: 2.40, ms: 1650, node: 2, link: 1, kind: 'var(--lime)',
    title: '正在上板执行', detail: '把编译产物加载到 a2a3，采集一次真实执行。',
    status: 'device · a2a3 · launching' },
  { at: 4.15, ms: 1300, node: 3, link: 2, kind: 'var(--sky)',
    title: '正在准备性能分析', detail: '读取这次执行的 trace，整理到设备泳道上。',
    status: 'trace · building lanes' }
];
const END = 5.55;

const LINES = [
  [ .05, 'load',   'decode_sparse_attn_csa.py · 208–313'],
  [ .30, 'pass',   '01_after_InlineFunctions'],
  [ .60, 'pass',   '05_after_Simplify'],
  [ .95, 'pass',   '11_after_ConvertTensorToTileOps'],
  [1.30, 'pass',   '12_after_OptimizeOrchTensors'],
  [1.65, 'pass',   '35_after_MemoryReuse'],
  [1.95, 'pass',   '36_after_AllocateMemoryAddr'],
  [2.25, 'pass',   '51_after_MaterializeValidShapeSymbols'],
  [2.50, 'emit',   'kernel qk_pv · 51 passes · 1 op'],
  [2.85, 'launch', 'grid 24 AIC / 48 AIV · a2a3'],
  [3.25, 'launch', 'csa_merge · tiling 64 × 128'],
  [3.70, 'sync',   'device done · 4.82 ms'],
  [4.25, 'trace',  '30 tasks · critical path 19'],
  [4.70, 'trace',  'lane focus csa_merge · 0.663 ms'],
  [5.15, 'ready',  'trace 已就绪']
];

const stamp = t => t.toFixed(1).padStart(4, '0') + 's';

function line(t, kind, msg) {
  const el = document.createElement('div');
  el.className = 'cb-line';
  el.style.setProperty('--c', colourFor(t));
  el.innerHTML = '<span class="ts"></span><span class="kind"></span><span class="msg"></span>';
  el.children[0].textContent = stamp(t);
  el.children[1].textContent = kind;
  el.children[2].textContent = msg;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
/* 一行用它所属阶段的角色色，和轨上的节点对上 */
function colourFor(t) {
  for (let i = STAGES.length - 1; i >= 0; i--) if (t >= STAGES[i].at) return STAGES[i].kind;
  return 'var(--muted)';
}

function runStage(s) {
  nodes[s.node].dataset.state = 'run';
  const link = links[s.link];
  link.dataset.state = 'run';
  const fill = link.firstElementChild;
  fill.style.transitionDuration = (still ? 0 : s.ms) + 'ms';
  requestAnimationFrame(() => {
    const vertical = matchMedia('(max-width: 720px)').matches;
    fill.style[vertical ? 'height' : 'width'] = '100%';
  });
  title.textContent = s.title;
  detail.textContent = s.detail;
  statusLine.textContent = s.status;
  setTimeout(() => {
    link.dataset.state = 'done';
    const node = nodes[s.node];
    node.dataset.state = 'done';
    const meta = node.querySelector('.cb-meta');
    if (meta && meta.dataset.fill) meta.textContent = meta.dataset.fill;
  }, still ? 0 : s.ms);
}

function finish() {
  title.textContent = '演示流程已完成';
  detail.textContent = '这次运行的 trace 已准备就绪，正在进入性能分析页面。';
  statusLine.textContent = 'ready · opening device perf lane';
  next.hidden = false;
  next.focus({ preventScroll: true });
  setTimeout(() => { location.href = 'result.html'; }, 1600);
}

LINES.forEach(([t, kind, msg]) => setTimeout(() => line(t, kind, msg), t * 1000));
STAGES.forEach(s => setTimeout(() => runStage(s), s.at * 1000));
setTimeout(finish, END * 1000);
</script>
</body>
</html>
