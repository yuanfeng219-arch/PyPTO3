<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昇腾算子开发可解释/可观测设计</title>
<link rel="stylesheet" href="cover-glow.css?v=20261111-bg2">
<style>
:root{
  color-scheme:dark;
  --kn-sans:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --kn-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --kn-void:#060607;
  --kn-text:#f5f5f7;
  --kn-soft:#c6c7cb;
  --kn-dim:#92939a;
  --kn-faint:#6b6c73;
  --kn-green:#88EC30;
  --kn-purple:#b76bff;
  --kn-blue:#849bff;
  --kn-ease:cubic-bezier(.22,.78,.3,1);
  --kn-backdrop:.12;        /* how much of the real product shows behind each act */
  --kn-backdrop-lit:.4;    /* …and on hover / focus */
  --kn-seam:linear-gradient(180deg,transparent 5%,rgba(226,227,233,.15) 32%,rgba(226,227,233,.15) 70%,transparent 96%);
  font-family:var(--kn-sans);
  background:var(--kn-void);
  color:var(--kn-text);
}
*{box-sizing:border-box}
body{margin:0;background:var(--kn-void);-webkit-font-smoothing:antialiased}

/* ---------------- poster shell ---------------- */
.poster{position:relative;min-height:100svh;display:flex;flex-direction:column;isolation:isolate;
  background:radial-gradient(118% 68% at 50% -8%,rgba(40,41,46,.44),transparent 58%),var(--kn-void)}
.ascend-brand{position:absolute;left:clamp(20px,3vw,42px);top:24px;z-index:5;width:105px;height:40px;object-fit:contain;pointer-events:none}
@media(max-width:600px){.ascend-brand{top:12px;left:16px;width:84px;height:32px}.poster .heading{padding-top:64px}}
/* v3：本页是开场三页（map → intro → index）的结尾；右上角回到上一页 PyPTO 背景 */
.to-intro{position:absolute;z-index:5;top:24px;right:clamp(20px,3vw,42px);display:inline-flex;align-items:center;gap:8px;
  height:36px;padding:0 16px;border:1px solid rgba(226,227,233,.18);border-radius:999px;background:rgba(255,255,255,.04);
  color:var(--kn-soft);font:500 12px/1 var(--kn-sans);letter-spacing:.04em;text-decoration:none;
  transition:color .3s var(--kn-ease),border-color .3s var(--kn-ease),background .3s var(--kn-ease)}
.to-intro span{color:var(--kn-dim);transition:transform .3s var(--kn-ease),color .3s var(--kn-ease)}
.to-intro:hover,.to-intro:focus-visible{color:#f5f5f7;border-color:rgba(226,227,233,.42);background:rgba(255,255,255,.07);outline:none}
.to-intro:hover span,.to-intro:focus-visible span{color:#f5f5f7;transform:translateX(-3px)}
@media(max-width:600px){.to-intro{top:12px;right:16px;height:30px;padding:0 12px;font-size:11px}}
.poster::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(128% 80% at 50% 46%,transparent 38%,rgba(0,0,0,.52) 78%,rgba(0,0,0,.86) 100%)}

/* ---------------- heading ---------------- */
.heading{position:absolute;z-index:4;top:0;left:0;right:0;text-align:center;
  padding:clamp(34px,6.4vh,70px) 24px 40px;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,6,7,.95) 16%,rgba(6,6,7,.7) 56%,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;margin:0 0 18px;color:#a7a8af;
  font:600 10px/1 var(--kn-mono);letter-spacing:.24em}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,168,175,.78))}
.eyebrow::after{background:linear-gradient(90deg,rgba(167,168,175,.78),transparent)}
h1{margin:0;font-size:clamp(32px,4vw,70px);font-weight:600;line-height:1.1;letter-spacing:-.035em;
  text-wrap:balance;color:#f7faf9;
  background:linear-gradient(168deg,#fff 10%,#dcdde2 58%,#aeafb6);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 20px rgba(0,0,0,.9))}
.subtitle{margin:16px 0 0;color:var(--kn-dim);font-size:clamp(14px,1.15vw,19px);letter-spacing:.03em}

/* ---------------- stages ---------------- */
.stages{position:relative;flex:1;min-height:100svh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  background-image:var(--kn-seam),var(--kn-seam);background-size:1px 100%;background-repeat:no-repeat;
  background-position:33.3333% 0,66.6667% 0}
.stage{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  overflow:hidden;isolation:isolate;color:inherit;text-decoration:none;
  padding:clamp(190px,24vh,250px) clamp(22px,3vw,52px) clamp(95px,12vh,130px);
  background:radial-gradient(ellipse 70% 46% at 50% 47%,var(--tint),transparent 70%);
  transition:opacity .45s var(--kn-ease),filter .45s var(--kn-ease)}
.stage:nth-of-type(1){--image:url('../assets/launch-previews/hardware-native-ui.png');--accent:var(--kn-green);--tint:rgba(66,150,105,.12);--glow:rgba(143,227,180,.36)}
.stage:nth-of-type(2){--image:url('../assets/launch-previews/pass-error-cases-cp01.png');--accent:var(--kn-purple);--tint:rgba(128,98,186,.12);--glow:rgba(195,168,247,.36)}
.stage:nth-of-type(3){--image:url('../assets/launch-previews/device-perf-lane-focus.png');--accent:var(--kn-blue);--tint:rgba(62,130,170,.12);--glow:rgba(143,214,245,.36)}

/* distant atmosphere behind each scene */
.stage::before{content:"";position:absolute;z-index:-1;opacity:var(--kn-backdrop);pointer-events:none;
  background-image:var(--image);background-repeat:no-repeat;filter:blur(.6px) saturate(.6) brightness(.66);
  mask-image:radial-gradient(ellipse 66% 62% at 50% 50%,#000 10%,rgba(0,0,0,.5) 46%,transparent 76%);
  transition:opacity .45s var(--kn-ease),filter .45s var(--kn-ease)}
/* each one frames the panel that names the act: hardware map, pass graph, device lanes */
.stage:nth-of-type(1)::before{inset:15% -16% 23% -24%;background-size:300% auto;background-position:69% 95%}
.stage:nth-of-type(2)::before{inset:13% -22% 25% -18%;background-size:260% auto;background-position:39% 37%}
.stage:nth-of-type(3)::before{inset:15% -24% 23% -16%;background-size:260% auto;background-position:82% 79%}
.stage:hover::before,.stage:focus-visible::before{opacity:var(--kn-backdrop-lit);filter:blur(0) saturate(.9) brightness(.86)}

/* act numeral, same place in every panel */
.stage::after{position:absolute;z-index:-1;top:26%;right:6%;color:var(--accent);opacity:.12;
  font:200 clamp(64px,7.5vw,132px)/1 var(--kn-sans);letter-spacing:-.07em;pointer-events:none;
  transition:opacity .45s var(--kn-ease)}
.stage:nth-of-type(1)::after{content:"01"}
.stage:nth-of-type(2)::after{content:"02"}
.stage:nth-of-type(3)::after{content:"03"}
.stage:hover::after,.stage:focus-visible::after{opacity:.26}

/* spotlight: the hovered act stays lit, the others step back */
.stages:has(.stage:hover) .stage:not(:hover),
.stages:has(.stage:focus-visible) .stage:not(:focus-visible){opacity:.82;filter:none}

.stage:focus-visible{outline:2px solid #d5d6dc;outline-offset:-6px;z-index:3}

.orbit-node{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;max-width:390px;aspect-ratio:1.52;padding:3%;
  background:radial-gradient(ellipse at 48% 50%,rgba(6,6,7,.82) 5%,rgba(7,7,8,.5) 46%,transparent 74%)}
.orbit-node::before{content:"";position:absolute;inset:8% 0;pointer-events:none;opacity:.6;
  background:radial-gradient(ellipse at 50% 55%,var(--glow),transparent 68%);filter:blur(28px);
  transition:opacity .5s var(--kn-ease),transform .5s var(--kn-ease)}
.stage:hover .orbit-node::before,.stage:focus-visible .orbit-node::before{opacity:1;transform:scale(1.09)}
.orbit-node .stage-illustration{max-width:350px;margin:0}

.stage-illustration{display:block;position:relative;width:100%;max-width:390px;height:auto;aspect-ratio:1.6;
  pointer-events:none;transition:transform .5s var(--kn-ease),filter .5s var(--kn-ease);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.9)) drop-shadow(0 18px 34px rgba(0,0,0,.8))}
.stage:hover .stage-illustration,.stage:focus-visible .stage-illustration{transform:scale(1.015);
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.9)) drop-shadow(0 22px 44px rgba(0,0,0,.8)) drop-shadow(0 0 26px var(--glow))}

.stage-content{width:100%;max-width:390px;text-align:left;margin:34px auto 0;text-shadow:0 2px 16px rgba(0,0,0,.9)}
.stage-kicker{color:var(--accent);font:500 10px/1.3 var(--kn-mono);letter-spacing:.18em;opacity:.82;
  transition:opacity .35s var(--kn-ease)}
.stage:hover .stage-kicker,.stage:focus-visible .stage-kicker{opacity:1}
.stage-title{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-top:12px}
h2{margin:0;font-size:clamp(24px,2.1vw,36px);line-height:1.18;font-weight:600;letter-spacing:-.022em;color:#f3f4f7}
.go{color:var(--kn-dim);font-size:19px;transition:transform .3s var(--kn-ease),color .3s var(--kn-ease)}
.stage:hover .go,.stage:focus-visible .go{color:var(--accent);transform:translate(4px,-4px)}
.desc{margin:14px 0 0;color:var(--kn-soft);font-size:clamp(13px,.95vw,15px);line-height:1.65}
.stage-content::after{content:"";display:block;height:1px;width:42px;margin-top:22px;opacity:.7;
  background:linear-gradient(90deg,var(--accent),transparent);
  transition:width .55s var(--kn-ease),opacity .55s var(--kn-ease)}
.stage:hover .stage-content::after,.stage:focus-visible .stage-content::after{width:100%;opacity:1}

/* A longer crossfade applies only while the idle sequence is running. */
.stages.is-rotating .stage,.stages.is-rotating .stage::before,.stages.is-rotating .stage::after,
.stages.is-rotating .orbit-node::before,.stages.is-rotating .stage-illustration,
.stages.is-rotating .stage-kicker,.stages.is-rotating .go,.stages.is-rotating .stage-content::after{transition-duration:1.1s}
/* Idle spotlight uses the same visual treatment as pointer hover. */
.stage.is-auto::before{opacity:var(--kn-backdrop-lit);filter:blur(0) saturate(.9) brightness(.86)}
.stage.is-auto::after{opacity:.26}
.stages:has(.stage.is-auto) .stage:not(.is-auto){opacity:.82;filter:none}
.stage.is-auto .orbit-node::before{opacity:1;transform:scale(1.09)}
.stage.is-auto .stage-illustration{transform:scale(1.015);filter:drop-shadow(0 6px 8px rgba(0,0,0,.9)) drop-shadow(0 22px 44px rgba(0,0,0,.8)) drop-shadow(0 0 26px var(--glow))}
.stage.is-auto .stage-kicker{opacity:1}
.stage.is-auto .go{color:var(--accent);transform:translate(4px,-4px)}
.stage.is-auto .stage-content::after{width:100%;opacity:1}

/* ---------------- the cycle ---------------- */
.cycle{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.cycle path{fill:none}
.cycle .trunk{stroke:url(#cycle-gradient);stroke-width:1.6;stroke-opacity:.88;marker-end:url(#cycle-arrow);
  stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 3px rgba(188,196,204,.45))}
/* the halo carries the weight, and decays with distance from where the feedback leaves act 3 */
.cycle .halo{stroke:url(#cycle-gradient);stroke-width:6;stroke-opacity:.55;stroke-linecap:round;
  mask:url(#cycle-decay);filter:blur(5px);stroke-dasharray:1;stroke-dashoffset:1}
.cycle .ticks{stroke:#b7b9c1;stroke-opacity:.45;stroke-width:1;stroke-linecap:round}
.cycle .origin{fill:#f2f3f7;filter:drop-shadow(0 0 5px rgba(224,232,244,.95)) drop-shadow(0 0 12px rgba(224,232,244,.5))}
.is-ready .cycle .trunk,.is-ready .cycle .halo{animation:kn-draw 1.7s var(--kn-ease) 1.15s forwards}
.cycle .pulse{stroke:#f2f3f7;stroke-width:2.2;stroke-linecap:round;stroke-opacity:0;
  stroke-dasharray:.05 .95;filter:drop-shadow(0 0 7px rgba(226,234,246,.92))}
.is-ready .cycle .pulse{animation:kn-travel 6.5s linear 2.8s infinite}
.is-ready #pulse-forward-2{animation-delay:3.35s}
.is-ready #pulse-return{animation-delay:3.9s}
@keyframes kn-draw{to{stroke-dashoffset:0}}
@keyframes kn-travel{0%{stroke-dashoffset:1;stroke-opacity:0}
  8%{stroke-opacity:.95}
  92%{stroke-opacity:.95}
  100%{stroke-dashoffset:0;stroke-opacity:0}}

.cycle-caption{position:absolute;z-index:3;left:50%;top:76%;transform:translate(-50%,-50%);
  display:inline-flex;align-items:center;gap:9px;padding:5px 15px;color:#c4c5cb;white-space:nowrap;
  background:rgba(7,7,8,.82);border:1px solid rgba(226,227,233,.13);border-radius:999px;
  font:10px/1.6 var(--kn-sans);letter-spacing:.14em;pointer-events:none;backdrop-filter:blur(6px)}
.cycle-caption::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--kn-green);
  box-shadow:0 0 9px var(--kn-green);animation:kn-breathe 2.8s ease-in-out infinite}
@keyframes kn-breathe{0%,100%{opacity:.35}50%{opacity:1}}
.mobile-cycle{display:none}

/* ---------------- rails ---------------- */
.footer{position:absolute;z-index:3;bottom:26px;left:clamp(26px,4vw,72px);right:clamp(26px,4vw,72px);
  display:flex;justify-content:space-between;gap:16px;color:var(--kn-faint);
  font:10px/1.3 var(--kn-mono);letter-spacing:.16em;pointer-events:none}

/* ---------------- entrance ---------------- */
@keyframes kn-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes kn-fade{from{opacity:0}to{opacity:1}}
.poster:not(.is-ready) .eyebrow,.poster:not(.is-ready) h1,.poster:not(.is-ready) .subtitle,
.poster:not(.is-ready) .stage,.poster:not(.is-ready) .cycle,.poster:not(.is-ready) .cycle-caption,
.poster:not(.is-ready) .to-intro,.poster:not(.is-ready) .mobile-cycle,.poster:not(.is-ready) .footer{opacity:0}
.is-ready .eyebrow{animation:kn-rise .8s var(--kn-ease) .05s both}
.is-ready h1{animation:kn-rise .9s var(--kn-ease) .16s both}
.is-ready .subtitle{animation:kn-rise .9s var(--kn-ease) .3s both}
.is-ready .stage:nth-of-type(1){animation:kn-rise 1s var(--kn-ease) .46s both}
.is-ready .stage:nth-of-type(2){animation:kn-rise 1s var(--kn-ease) .6s both}
.is-ready .stage:nth-of-type(3){animation:kn-rise 1s var(--kn-ease) .74s both}
.is-ready .mobile-cycle{animation:kn-fade 1s var(--kn-ease) .9s both}
.is-ready .to-intro{animation:kn-fade 1s var(--kn-ease) .9s both}
.is-ready .cycle{animation:kn-fade 1s var(--kn-ease) 1.1s both}
.is-ready .footer{animation:kn-fade 1s var(--kn-ease) 1.2s both}
.is-ready .cycle-caption{animation:kn-fade .7s var(--kn-ease) 2.75s both}

/* ---------------- narrow ---------------- */
@media(max-width:760px){
  .heading{position:relative;padding:45px 22px 32px;background:none}
  h1{font-size:clamp(28px,7vw,40px)}
  .stages{min-height:0;grid-template-columns:1fr;background-image:none}
  .cycle,.cycle-caption{display:none}
  .mobile-cycle{display:block;text-align:center;color:#a7a8af;font:11px/1.6 var(--kn-mono);
    letter-spacing:.14em;padding:18px 16px;border-top:1px solid rgba(226,227,233,.1);
    border-bottom:1px solid rgba(226,227,233,.1)}
  .stage{min-height:395px;padding:38px 26px 48px}
  .stage+.stage{border-top:1px solid rgba(226,227,233,.1)}
  .stage::after{font-size:70px;top:6%}
  .stage-illustration,.orbit-node{max-width:350px}
  .stage-content{margin-top:22px}
  .stages:has(.stage:hover) .stage:not(:hover){opacity:1;filter:none}
  .footer{position:relative;left:auto;right:auto;bottom:auto;margin:0 24px;padding:24px 0;
    border-top:1px solid rgba(255,255,255,.12)}
  .footer span:last-child{display:none}
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .poster .eyebrow,.poster h1,.poster .subtitle,.poster .stage,.poster .cycle,
  .poster .cycle-caption,.poster .to-intro,.poster .mobile-cycle,.poster .footer{opacity:1!important}
  .cycle .trunk{stroke-dashoffset:0}
  .cycle .pulse{display:none}
}
/* Lab Tour: glow-edge surfaces, SVG content stays on the foreground plane. */
.stage-illustration.glass-scene{filter:none!important}
.glass-scene{contain:layout style;will-change:transform,opacity}
.glass-scene > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2}
.cover-glass{overflow:hidden;clip-path:inset(0 round var(--cover-radius));position:absolute;pointer-events:none;z-index:1;border-radius:var(--cover-radius);}

/* Desktop spotlight: stable illustration baseline, animated 25 / 50 / 25 columns. */
@media(min-width:761px){
 .stages{background-image:none;transition:grid-template-columns .85s var(--kn-ease)}
 .stages[data-active="0"]{grid-template-columns:2fr 1fr 1fr}
 .stages[data-active="1"]{grid-template-columns:1fr 2fr 1fr}
 .stages[data-active="2"]{grid-template-columns:1fr 1fr 2fr}
 .stage{padding-left:clamp(18px,2.4vw,42px);padding-right:clamp(18px,2.4vw,42px)}
 .stage+.stage{border-left:1px solid rgb(226 227 233 / 10%)}
 .orbit-node{height:clamp(170px,23vw,300px);aspect-ratio:auto;max-width:500px}
 .orbit-node .stage-illustration{width:clamp(240px,29vw,460px);max-width:none;flex-shrink:0;transition:opacity .4s var(--kn-ease),transform .85s var(--kn-ease)}
 .compact-illustration{position:absolute;width:100%;max-width:300px;aspect-ratio:1.6;opacity:0;transition:opacity .4s var(--kn-ease);pointer-events:none}
 .stage.is-compact .stage-illustration{opacity:0;transform:scale(.9)}
 .stage.is-compact .compact-illustration{opacity:1}
 .stage.is-compact .desc{opacity:.55}
 .desc{transition:opacity .4s var(--kn-ease)}
}
@media(max-width:760px){.compact-illustration{display:none}}
</style>
<style>/* Balance scene 03 against its neighboring cover illustrations. */
.stage[href="result.html"] .stage-illustration,.stage[href="result.html"] .compact-illustration{scale:.9;transform-origin:50% 50%}</style><style>
/* Scene 03: full illustration contracts before the compact drawing settles. */
@media(min-width:761px){
 .stage[href="result.html"] .stage-illustration{transition:transform 500ms cubic-bezier(.22,1,.36,1),opacity 300ms ease-out;transform-origin:center}
 .stage[href="result.html"].is-compact .stage-illustration{transform:scale(.72);opacity:0}
 .stage[href="result.html"] .compact-illustration{transform:scale(1.12);opacity:0;transition:transform 450ms cubic-bezier(.22,1,.36,1),opacity 250ms ease-out;transform-origin:center}
 .stage[href="result.html"].is-compact .compact-illustration{transform:scale(1);opacity:1;transition-delay:100ms}
}
@media(prefers-reduced-motion:reduce){.stage[href="result.html"] :is(.stage-illustration,.compact-illustration){transition:none!important}}
</style><style>
.poster .stage:is([href="compile.html"],[href="result.html"]) .go{color:#fff}
.poster .stage[href="result.html"]::before{display:block}
.poster .stage[href="result.html"] .stage-illustration{filter:none!important}
.pass-neighbors{transition:opacity 300ms ease-out,transform 450ms cubic-bezier(.22,1,.36,1);transform-origin:200px 79px}
.stage.is-compact .pass-neighbors{opacity:0;transform:scale(.8)}
/* Draw the surrounding loop first, then introduce the two internal links. */
.poster.is-ready #cycle-forward-1,.poster.is-ready #cycle-forward-2{
 animation:kn-links-in 700ms ease-out 3s both;stroke-dasharray:1;stroke-dashoffset:0
}
@keyframes kn-links-in{from{opacity:0;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
/* A single dashed stroke bends with the actual loop, including its rounded corners. */
.poster .cycle .pulse{display:none;animation:none}
.poster.is-ready #pulse-return{display:block;stroke:#f2f3f7;stroke-width:2.2;stroke-dasharray:.035 .965;stroke-linecap:round;animation:kn-travel 6.5s linear 3.8s infinite;filter:none}
@media(prefers-reduced-motion:reduce){.poster.is-ready #pulse-return{display:none;animation:none}}
@media(prefers-reduced-motion:reduce){
 .poster.is-ready #cycle-forward-1,.poster.is-ready #cycle-forward-2{animation:none;opacity:1}
}
</style><style>
/* Performance: only small local surfaces are filtered, never the full loop layer. */
.poster .cycle .halo{display:none}
.poster .cycle .pulse,.poster.is-ready #pulse-return{filter:none}
.poster .stage .cover-glass{backdrop-filter:none;-webkit-backdrop-filter:none}
.poster .stage::before{filter:none!important}
.poster .stage .glass-scene{contain:layout style;isolation:isolate}
/* Match 01's local frosted backing without blurring the exported face or labels. */
.poster .stage:nth-of-type(2) .cover-glass,
.poster .stage:nth-of-type(3) .device-asset-surface{
 background:rgb(8 9 14 / .24);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
}
.poster .stage:nth-of-type(3) .device-asset-surface{
 border-radius:var(--cover-radius);
}
/* will-change:opacity creates a backdrop root and prevents sampling the stage image. */
.poster .stage .glass-scene{will-change:transform;isolation:auto}
.poster .stage .hardware-map-caption{opacity:1;transition:opacity .35s var(--kn-ease)}
.poster .stage.is-compact .hardware-map-caption{opacity:.2}
.card-background-sample{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:-1;background:#101014}
.card-background-sample > div{position:absolute;filter:blur(12px);pointer-events:none}
.poster .pass-frost-surface{overflow:hidden}
</style></head>
<body data-prev="intro.html">

 const rectKey=rect=>['x','y','width'].map(key=>rect.getAttribute(key)).join('/');
 const criticalKeys=new Set([...svg.querySelectorAll('g[fill="#FFE300"] > rect')].map(rectKey));
 svg.querySelectorAll('g[fill="#1953FC"] > rect').forEach(rect=>{if(criticalKeys.has(rectKey(rect)))rect.remove();});
 const palettes=[['blue','#1953FC'],['critical','#FFE300']];
 palettes.forEach(([name,color])=>{
  const gradient=document.createElementNS(ns,'linearGradient');gradient.id=`task-${name}-${suffix}`;
  gradient.setAttribute('x1','0%');gradient.setAttribute('y1','0%');gradient.setAttribute('x2','100%');gradient.setAttribute('y2','0%');
  gradient.innerHTML=`<stop stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity="${name==='critical'?.85:.5}"/>`;
  defs.append(gradient);
  svg.querySelectorAll(`g[fill="${color}"] > rect`).forEach(rect=>{
   const oldHeight=Number(rect.getAttribute('height')),height=compact?8:5.6;
   rect.setAttribute('y',Number(rect.getAttribute('y'))+(oldHeight-height)/2);
   rect.setAttribute('height',height);rect.setAttribute('rx',height/2);
   rect.setAttribute('fill',`url(#task-${name}-${suffix})`);
  });
 });

 if(taskGroups.length){taskGroups[0].before(taskLayer);taskGroups.forEach(group=>taskLayer.append(group));}
 svg.prepend(defs);
}

<script>
(() => {
  const container = document.querySelector('.stages');
  const graphic = document.querySelector('.cycle');
  const nodes = [...document.querySelectorAll('.orbit-node')];
  const illustrations = nodes.map(node => node.querySelector('.stage-illustration'));
  const compactArt=[
   null,
   '<g fill="#A459FF" fill-opacity=".28"><rect x="28" y="102" width="58" height="46" rx="9"/><rect x="314" y="102" width="58" height="46" rx="9"/></g><rect x="154" y="80" width="92" height="90" rx="16" fill="#A459FF"/><g fill="#eee4ff" text-anchor="middle" font-family="monospace"><text x="200" y="114" font-size="24">36</text><text x="200" y="140" font-size="11">Allocate</text><text x="200" y="155" font-size="11">MemoryAddr</text></g><path d="M96 125h46m116 0h46" stroke="#A459FF" stroke-width="2"/>',

  ];
  nodes.forEach((node,i)=>{
   if(i===0)return; // Source summary reuses the existing card and grid.
   const art=document.createElementNS('http://www.w3.org/2000/svg','svg');
   art.setAttribute('viewBox','0 0 400 250');art.setAttribute('aria-hidden','true');art.classList.add('compact-illustration');
   art.innerHTML=compactArt[i];if(i===2)finishDeviceTasks(art,true);node.append(art);
  });
  let pointRects=[];
  function illustrationPoint(index, x, y, area) {
    const compact=nodes[index].closest('.stage').classList.contains('is-compact');
    const rect=pointRects[index]||(pointRects[index]=(compact&&index!==0?nodes[index].querySelector('.compact-illustration'):illustrations[index]).getBoundingClientRect());
    return { x: rect.left - area.left + rect.width * x / 400, y: rect.top - area.top + rect.height * y / 250 };
  }
  // Read the visible silhouettes in screen coordinates, including hover transforms.
  const sourceFace=nodes[0].querySelector('.source-asset-surface');
  const summaryFace=nodes[0].querySelector('.source-summary-card');
  const sourceSummary=nodes[0].querySelector('.source-summary-lines');
  function sourceEntry(area){
    const full=sourceFace.getBoundingClientRect(), small=summaryFace.getBoundingClientRect();
    const mix=Number.parseFloat(getComputedStyle(sourceSummary).opacity)||0;
    return {x:full.left+(small.left-full.left)*mix-area.left,y:illustrationPoint(0,0,125,area).y};
  }
  const paths = ['cycle-forward-1','cycle-forward-2','cycle-return'].map(id => document.getElementById(id));
  const pulses = ['pulse-forward-1','pulse-forward-2','pulse-return'].map(id => document.getElementById(id));

  const setAttr=(node,key,value)=>{value=String(value);if(node.getAttribute(key)!==value)node.setAttribute(key,value);};
  const setPath=(i,d)=>{setAttr(paths[i],'d',d);if(i===2)setAttr(pulses[2],'d',d);};
  const caption = document.querySelector('.cycle-caption');
  const blocks = [...document.querySelectorAll('.stage-content')];
  const footer = document.querySelector('.footer');
  const sweep = document.getElementById('cycle-gradient');
  const halo = document.getElementById('cycle-halo');
  const ticks = document.getElementById('cycle-ticks');
  const origin = document.getElementById('cycle-origin');
  const decay = document.getElementById('cycle-decay-grad');
  const K = .5523;   // circular-arc approximation for a cubic corner
  // leaving horizontally (hv) or vertically (vh), dx/dy give the turn direction
  const hv = (x, y, dx, dy, r) =>
    'C ' + (x + dx * r * K) + ' ' + y + ' ' + (x + dx * r) + ' ' + (y + dy * r * (1 - K)) +
    ' ' + (x + dx * r) + ' ' + (y + dy * r) + ' ';
  const vh = (x, y, dx, dy, r) =>
    'C ' + x + ' ' + (y + dy * r * K) + ' ' + (x + dx * r * (1 - K)) + ' ' + (y + dy * r) +
    ' ' + (x + dx * r) + ' ' + (y + dy * r) + ' ';
  function drawCycle() {
    if(document.hidden||window.innerWidth<=760)return;
    pointRects=[];
    // Batch geometry reads before SVG writes to avoid forced layout between endpoints.
    const area=container.getBoundingClientRect();
    if(!area.width)return;
    const lineY=illustrationPoint(0,0,125,area).y;
    const gridCells=nodes[0].querySelectorAll('.hardware-rear .hardware-grid rect');
    const compactSource=nodes[0].closest('.stage').classList.contains('is-compact');
    const gridEdge=gridCells[compactSource?12:24].getBoundingClientRect().right-area.left;
    const compactPass=nodes[1].closest('.stage').classList.contains('is-compact');
    const ports=[[{x:gridEdge},illustrationPoint(1,compactPass?8:130,125,area)],
      [illustrationPoint(1,compactPass?392:270,125,area),illustrationPoint(2,8,125,area)]];
    const textBottom=Math.max(...blocks.map(el=>el.getBoundingClientRect().bottom))-area.top;
    const entry=sourceEntry(area),exit=illustrationPoint(2,nodes[2].closest('.stage').classList.contains('is-compact')?350:378,125,area);
    const railOutset=Math.min(40,area.width*.018);
    const xL=-railOutset,xR=area.width+railOutset;
    const bottom=textBottom+Math.max(88,Math.min(128,area.width*.055));
    // Radius depends only on viewport geometry, never on moving artwork endpoints.
    const r=Math.min(96,area.width*.065);
    // Keep the final horizontal segment pointing into the source during entry.
    const entryRadius=Math.max(1,Math.min(r,entry.x-xL-12));
    const perimeter=' H '+(xR-r)+' Q '+xR+' '+lineY+' '+xR+' '+(lineY+r)
      +' V '+(bottom-r)+' '+vh(xR,bottom-r,-1,1,r)
      +'H '+(xL+r)+' '+hv(xL+r,bottom,-1,-1,r)
      +'V '+(lineY+entryRadius)+' Q '+xL+' '+lineY+' '+(xL+entryRadius)+' '+lineY;
    setAttr(graphic,'viewBox','0 0 '+area.width+' '+area.height);
    setAttr(sweep,'x2',area.width);
    ports.forEach((pair,i)=>setPath(i,'M '+pair[0].x+' '+lineY+' L '+pair[1].x+' '+lineY));
    setPath(2,'M '+exit.x+' '+lineY+perimeter+' H '+entry.x);
    // Static halo; only the thin connectors and return highlight follow the artwork.
    setAttr(halo,'d','M '+(xR-r)+' '+lineY+perimeter);
    setAttr(decay,'cx',xR);setAttr(decay,'cy',lineY);setAttr(decay,'r',Math.max(area.width*.55,320));
    const captionTop=bottom+'px';if(caption.style.top!==captionTop)caption.style.top=captionTop;
  }
  // One coalesced animation loop for hover, resize and class changes.
  let followFrame=0,followUntil=0;
  function requestCycle(duration=0){
    followUntil=Math.max(followUntil,performance.now()+duration);
    if(followFrame)return;
    function frame(time){
      followFrame=0;drawCycle();
      if(time<followUntil)followFrame=requestAnimationFrame(frame);
    }
    followFrame=requestAnimationFrame(frame);
  }
  function followTransition(){requestCycle(900);}
  window.addEventListener('resize',()=>requestCycle());
  if(window.ResizeObserver){const observer=new ResizeObserver(()=>requestCycle());observer.observe(container);nodes.forEach(node=>observer.observe(node));}
  drawCycle();

  // Only run the idle spotlight when the user is not interacting with a card.
  const stages=[...container.querySelectorAll('.stage')];
  let lastActiveIndex=1, introOverview=true, overviewTimer=0;
  function syncExpansion(){
    const active=stages.findIndex(stage=>stage.matches(':focus-within'));
    const hovered=pointerInCard?stages.findIndex(stage=>stage.matches(':hover')):-1;
    const automatic=stages.findIndex(stage=>stage.classList.contains('is-auto'));
    const index=introOverview?-1:active>=0?active:hovered>=0?hovered:automatic>=0?automatic:lastActiveIndex;
    if(index>=0)lastActiveIndex=index;
    let changed=container.dataset.active!==(index<0?undefined:String(index));
    if(index<0)delete container.dataset.active;else container.dataset.active=String(index);
    stages.forEach((stage,i)=>{const compact=index>=0&&index!==i&&window.innerWidth>760;if(stage.classList.contains('is-compact')!==compact){stage.classList.toggle('is-compact',compact);changed=true;}});
    if(changed)followTransition();
  }
  const expansionObserver=new MutationObserver(syncExpansion);
  stages.forEach(stage=>expansionObserver.observe(stage,{attributes:true,attributeFilter:['class']}));
  stages.forEach(stage=>['pointerenter','pointerleave','focusin','focusout'].forEach(event=>stage.addEventListener(event,()=>requestAnimationFrame(syncExpansion))));
  window.addEventListener('resize',syncExpansion);
  const hoverCapability=window.matchMedia('(hover: hover)');
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let spotlightTimer=0, spotlightIndex=1, pointerInCard=false, focusInCard=false;
  function clearSpotlight() {
    clearTimeout(spotlightTimer); spotlightTimer=0;
    container.classList.remove('is-rotating');
    const active=container.querySelector('.stage.is-auto');
    if(active){active.classList.remove('is-auto');followTransition();}
  }
  function canSpotlight() { return hoverCapability.matches && !reducedMotion.matches && !document.hidden && !pointerInCard && !focusInCard; }
  function queueSpotlight(delay=5000) {
    clearTimeout(spotlightTimer);
    if(introOverview||!canSpotlight()) return;
    spotlightTimer=setTimeout(() => {
      if(introOverview||!canSpotlight()) return;
      const previous=container.querySelector('.stage.is-auto');
      if(previous) previous.classList.remove('is-auto');
      container.classList.add('is-rotating');
      spotlightIndex=(spotlightIndex+1)%stages.length;
      stages[spotlightIndex].classList.add('is-auto');
      followTransition();
      queueSpotlight();
    },delay);
  }
  function endOverview(){
    introOverview=false;clearTimeout(overviewTimer);container.classList.remove('is-overview');
  }
  stages.forEach(stage => {
    const takePointer=()=>{
      if(introOverview||pointerInCard)return;
      pointerInCard=true;spotlightIndex=stages.indexOf(stage);clearSpotlight();requestAnimationFrame(syncExpansion);
    };
    stage.addEventListener('pointerenter',takePointer);
    stage.addEventListener('pointermove',takePointer,{passive:true});
    stage.addEventListener('pointerleave', () => { pointerInCard=false; queueSpotlight(); });
    stage.addEventListener('focusin', () => { endOverview();focusInCard=true;spotlightIndex=stages.indexOf(stage);clearSpotlight(); });
    stage.addEventListener('focusout', () => { focusInCard=false; queueSpotlight(); });
  });
  document.addEventListener('visibilitychange', () => { if(document.hidden) clearSpotlight(); else queueSpotlight(); });
  [hoverCapability,reducedMotion].forEach(media => media.addEventListener('change', () => { clearSpotlight(); queueSpotlight(); }));
  pointerInCard=false; // A stationary cursor must not interrupt the opening sequence.
  focusInCard=stages.some(stage=>stage.contains(document.activeElement));
  syncExpansion();
  overviewTimer=setTimeout(()=>{
    endOverview();spotlightIndex=1;lastActiveIndex=1;
    stages[1].classList.add('is-auto');syncExpansion();queueSpotlight(5000);
  },3000);
  const poster = document.querySelector('.poster');
  requestAnimationFrame(() => requestAnimationFrame(() => poster.classList.add('is-ready')));
})();
