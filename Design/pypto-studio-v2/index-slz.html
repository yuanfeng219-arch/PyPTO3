        ]

                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H4.5A1.5 1.5 0 0 0 3 4.5V9"/><path d="M15 3h4.5A1.5 1.5 0 0 1 21 4.5V9"/><path d="M9 21H4.5A1.5 1.5 0 0 1 3 19.5V15"/><path d="M15 21h4.5a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
                </button>
              </div>
            </header>
            <div class="tool-agentbar" id="tool-agent-filter" aria-label="按 Agent 过滤工具"></div>
            <div class="ide-tools ide-tools--grid" id="agent-tool-grid"></div>
          </aside>
        </div>
      </section>
    </div>

    <!-- 底部回放轨道（transport bar）：阶段 stepper + 播放控制 + 状态读数 -->
    <footer class="demo-transport" aria-label="回放轨道">
      <div class="demo-transport__flow">
        <div class="demo-transport__stepper" id="stepper-track" role="tablist" aria-label="7 阶段门禁"></div>
      </div>
      <div class="demo-transport__ctrl">
        <span class="demo-transport__gate" id="transport-gate"></span>
        <div class="demo-playback" aria-label="播放控制">
          <button type="button" id="step-prev" class="btn btn-icon" aria-label="上一步" title="上一步（←）">◀</button>
          <button type="button" id="step-play" class="btn btn-icon btn-solid" aria-label="自动播放" title="自动播放（空格）">▶</button>
          <button type="button" id="step-next" class="btn btn-icon" aria-label="下一步" title="下一步（→）">▶</button>
          <span class="demo-playback__counter" id="playback-counter"></span>
        </div>
      </div>
      <div class="demo-transport__meta" id="status-readout"></div>
    </footer>
    <div class="demo-toast" id="demo-toast" role="status" aria-live="polite"></div>
  </main>
