<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paged Attention · Operator Agent</title>
<!-- 外壳与工作台（workbench.html）同一套样式：顶栏、面板、状态栏、源码行与着色都直接引用工作台的样式表 -->
<link rel="stylesheet" href="../csa-operator-lens/vendor/path.css" />
<link rel="stylesheet" href="../csa-operator-lens/vendor/source-tags.css" />
<link rel="stylesheet" href="../csa-operator-lens/styles/lens.css" />
<link rel="stylesheet" href="../lab-tour-demo-v3/header.css" />
<link rel="stylesheet" href="../lab-tour-demo-v3/vendor/liquid-glass-controls/liquid-glass.css?v=final-v2" />
<link rel="stylesheet" href="../lab-tour-demo-v3/demo-shell.css?v=1" />
<link rel="stylesheet" href="../lab-tour-demo-v3/workbench-polish.css?v=2" />
<style>
/* Paged Attention 生成过程：基于已有源码的演示回放。 */
@font-face{font-family:'JetBrains Mono';src:url('../lab-tour-demo-v3/assets/fonts/JetBrainsMono-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}

/* ── 主体：图标栏 | 会话侧栏 | 对话 | 改动（生成后才展开） ── */
/* 工作台在 861–1280px 让主体随内容长高；Agent 页始终占满一屏，输入框留在底部 */
.hp-app.ag-app { grid-template-rows:minmax(0,1fr) 28px; }
@media(min-width:861px){ .hp-app.ag-app { height:100vh; } }
.hp-app.ag-app { grid-template-columns:minmax(0,1fr); }          /* 窄屏时不让长内容把整页撑宽 */
.ag-main { display:grid; grid-template-columns:52px 256px minmax(0,1fr); min-height:0; }
.ag-main.has-diff { grid-template-columns:52px 256px minmax(380px,1fr) minmax(440px,42%); }
.ag-main > * { min-height:0; min-width:0; }
.ag-main:not(.has-diff) > .ag-diff { display:none; }

/* 图标栏（Codex 最左一列） */
.ag-rail { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0 12px; background:var(--page); }
.ag-rail > * { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; color:#7c7c7c; }
.ag-rail > .is-on { background:#232323; color:var(--text); position:relative; text-decoration:none; }
.ag-rail > a:hover,.ag-rail > a:focus-visible { background:#2a2a2a; outline:none; }
.ag-rail > a:focus-visible { box-shadow:0 0 0 2px var(--demo-focus); }
.ag-rail > .is-on::after { content:""; position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--lime); }
.ag-rail svg { width:18px; height:18px; }
.ag-rail > .sp { flex:1; }

/* 会话侧栏 */
.ag-side { display:flex; flex-direction:column; min-height:0; overflow-y:auto; padding:10px 8px 12px; background:var(--surface); border-right:1px solid var(--divider,#222); }
.ag-side-h { display:flex; align-items:center; gap:6px; height:36px; padding:0 8px 0 10px; }
.ag-side-h b { font:600 15px var(--sans); color:var(--text); }
.ag-side-h .chev { width:12px; height:12px; color:var(--dim); }
.ag-side-h .tools { margin-left:auto; display:flex; gap:10px; color:var(--dim); }
.ag-side-h .tools svg { width:15px; height:15px; }
.ag-row { display:flex; align-items:center; gap:9px; width:100%; min-height:34px; padding:6px 10px; border:0; border-radius:9px; background:transparent;
  color:var(--muted); font:13px/1.4 var(--sans); text-align:left; cursor:default; }
.ag-row svg { width:15px; height:15px; flex:none; color:var(--dim); }
.ag-row.is-on { background:#232323; color:var(--text); }
.ag-row.is-on svg { color:var(--muted); }
button.ag-row { cursor:pointer; }
button.ag-row:hover,button.ag-row:focus-visible { background:#202020; color:var(--text); outline:none; }
.ag-sec { margin:16px 10px 6px; color:var(--dim); font:12px var(--sans); }
.ag-threads { margin:0; padding:0; list-style:none; }
.ag-thread { display:flex; align-items:center; gap:8px; min-height:32px; padding:5px 10px 5px 34px; border-radius:9px; color:var(--muted); font:13px/1.4 var(--sans); }
.ag-thread b { flex:1; min-width:0; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ag-thread time { color:var(--dim); font:11px var(--mono); }
.ag-thread.is-on { background:#232323; color:var(--text); }
.ag-thread.is-new { animation:ag-in .3s ease both; }
.ag-thread .st { width:7px; height:7px; flex:none; border-radius:50%; }
.ag-thread .st[data-state="run"] { width:11px; height:11px; border:1.5px solid #555; border-top-color:var(--lime); animation:ag-spin .8s linear infinite; }
.ag-thread .st[data-state="done"] { background:var(--lime); }
.ag-more { padding-left:34px; color:var(--faint,#5f5f63); }

/* 对话栏 */
.ag-chat-pane { position:relative; display:flex; flex-direction:column; background:var(--canvas); }
.ag-chat-head { display:flex; align-items:center; gap:10px; height:44px; flex:none; padding:0 12px 0 20px; }
.ag-chat-head b { font:600 13px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ag-chat-head small { color:var(--dim); font:11px var(--mono); white-space:nowrap; }
.ag-icon-btn { margin-left:auto; display:grid; place-items:center; width:32px; height:32px; border:0; border-radius:8px; background:transparent; color:var(--dim); cursor:pointer; }
.ag-icon-btn svg { width:17px; height:17px; }
.ag-icon-btn:hover,.ag-icon-btn:focus-visible { background:#222; color:var(--text); outline:none; }
.ag-icon-btn[aria-pressed="true"] { color:var(--text); }
.ag-icon-btn[disabled] { opacity:.35; cursor:default; background:transparent; }
.ag-scroll { flex:1; min-height:0; overflow-y:auto; scroll-behavior:smooth; }
.ag-col { width:100%; max-width:760px; min-height:100%; margin:0 auto; padding:12px 28px 16px; display:flex; flex-direction:column; gap:14px; }

/* 默认态：空白处居中一句提问（Codex：图标 + “你想让我们在 … 中构建什么？”） */
.ag-hero { margin:auto; padding-bottom:6vh; display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; }
.ag-hero-ic { display:grid; place-items:center; width:56px; height:56px; border-radius:18px; background:#1d1d1d; color:var(--muted); }
.ag-hero-ic svg { width:30px; height:30px; }
.ag-hero h2 { margin:0; font:500 clamp(22px,1.9vw,30px)/1.35 var(--sans); letter-spacing:-.01em; color:var(--text); }
.ag-hero h2 u { text-decoration:underline dotted #6c6c6c; text-underline-offset:6px; text-decoration-thickness:1.5px; }
.ag-hero p { margin:0; color:var(--dim); font-size:13px; }

.msg { animation:ag-in .28s ease both; }
@keyframes ag-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.msg-user { align-self:flex-end; max-width:86%; padding:10px 14px; border-radius:16px; background:#262626; color:#ececec; font-size:13.5px; line-height:1.7; white-space:pre-wrap; }
.msg-user.is-cmd { font:13px var(--mono); color:#c5f39c; }
.msg-agent { color:#d4d4d4; font-size:13.5px; line-height:1.75; }
.msg-agent p { margin:0 0 6px; }
.msg-agent b { color:var(--text); font-weight:600; }
.msg-agent code { font:12.5px var(--mono); color:#e8e8e8; background:rgb(255 255 255 / 6%); padding:1px 5px; border-radius:4px; }
.msg-agent a { color:#c5f39c; }

/* Agent 的动作行（一行一个动作，进行中文字流光，完成后变灰） */
.acts { display:grid; gap:2px; margin:2px 0 8px; }
.act-row { display:grid; grid-template-columns:18px minmax(0,1fr); gap:8px; align-items:start; padding:3px 0; color:var(--muted); font-size:13px; line-height:1.6; animation:ag-in .25s ease both; }
.act-row svg { width:15px; height:15px; margin-top:3px; color:var(--dim); }
.act-row .t b { font-weight:500; color:var(--text); }
.act-row .t code { font:12px var(--mono); color:var(--muted); background:none; padding:0; }
.act-row .add { color:#a5e780; font:12px var(--mono); margin-left:6px; }
.act-row[data-state="run"] .t { background:linear-gradient(90deg,#8a8a8a 0%,#f0f0f0 45%,#8a8a8a 90%); background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:ag-shine 1.6s linear infinite; }
.act-row[data-state="run"] .t b,.act-row[data-state="run"] .t code,.act-row[data-state="run"] .add { color:transparent; }
@keyframes ag-shine { from { background-position:120% 0; } to { background-position:-100% 0; } }
@keyframes ag-spin { to { transform:rotate(360deg); } }
.suggest { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.chip { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 13px; border:0; border-radius:var(--demo-radius-control);
  background:var(--lime-tint); color:#c5f39c; font:500 12.5px var(--sans); cursor:pointer; }
.chip code { background:none; padding:0; color:var(--lime); font:12.5px var(--mono); }
.chip:hover,.chip:focus-visible { background:color-mix(in srgb,var(--lime) 22%,transparent); outline:none; }
.chip[disabled] { opacity:.45; cursor:default; }
.lens-card { margin:6px 0 4px; padding:12px 14px; border-radius:var(--demo-radius-card); background:var(--surface); }
.lens-card-h { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:600; font-size:13px; }
.lens-card-h small { margin-left:auto; color:var(--dim); font:11px var(--mono); font-weight:400; }
.lens-views { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; }
.lens-views span { padding:2px 10px; border-radius:var(--demo-radius-control); background:var(--raised); color:var(--muted); font-size:12px; }
.lens-bar { height:3px; border-radius:2px; background:#2a2a2a; overflow:hidden; }
.lens-bar i { display:block; height:100%; width:0; background:var(--lime); transition:width 1.1s linear; }

/* 输入区（Codex：上方一条环境托盘 —— 项目 · 运行位置 · 更多；下面圆角输入框，左 + 与自定义，右模型、语音、发送） */
.ag-dock { flex:none; width:calc(100% - 56px); max-width:760px; margin:6px auto 16px; }
.ag-tray { display:flex; align-items:center; gap:16px; margin:0 14px; padding:8px 14px 14px; border-radius:14px 14px 0 0; background:#1b1b1b; color:var(--muted); font:12.5px var(--sans); }
.ag-tray span { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.ag-tray svg { width:14px; height:14px; color:var(--dim); }
.ag-tray .more { color:var(--dim); letter-spacing:.1em; }
.ag-composer { position:relative; margin-top:-8px; border-radius:18px; background:var(--surface); box-shadow:0 0 0 1px rgb(226 227 233 / 8%),var(--demo-shadow-float); }
.ag-composer:focus-within { box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 40%,transparent); }
.ag-composer textarea { display:block; width:100%; min-height:84px; max-height:180px; resize:none; border:0; background:transparent; padding:14px 16px 4px;
  outline:none; color:#ececec; font:13.5px/1.7 var(--sans); }
.ag-composer textarea::placeholder { color:#5f5f63; }
.ag-comp-f { display:flex; align-items:center; gap:4px; padding:6px 8px 8px 8px; }
.ag-tool { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 9px; border-radius:8px; color:var(--muted); font:12.5px var(--sans); white-space:nowrap; }
.ag-tool svg { width:15px; height:15px; color:var(--dim); }
.ag-tool.sq { width:30px; padding:0; justify-content:center; }
.ag-model { margin-left:auto; display:inline-flex; align-items:center; gap:6px; color:var(--muted); font:12.5px var(--sans); white-space:nowrap; }
.ag-model small { color:var(--dim); }
.ag-model svg { width:11px; height:11px; color:var(--dim); }
.send { display:grid; place-items:center; width:32px; height:32px; margin-left:4px; border:0; border-radius:50%; background:#ececec; color:#111; cursor:pointer; flex:none; }
.send svg { width:16px; height:16px; }
.send:hover,.send:focus-visible { background:#fff; outline:none; }
.send[disabled] { background:#2c2c2c; color:#6c6c6c; cursor:default; }

/* 右栏：本次改动（源码行与工作台源码栏同一套 .cl / .tk-* 样式；新增行左侧绿条） */
.ag-diff { display:flex; flex-direction:column; background:var(--surface); border-left:1px solid var(--divider,#222); animation:ag-slide .35s ease both; }
@keyframes ag-slide { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:none; } }
/* 改动面板右上角：打开 Compute Explorer（生成完成前置灰） */
.ag-diff-head { align-items:center; }
.ag-lens-btn { margin-left:auto; display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 13px; border-radius:var(--demo-radius-control);
  background:var(--lime); color:#0d1a00; font:700 12.5px var(--sans); text-decoration:none; white-space:nowrap; flex:none; }
.ag-lens-btn svg { width:14px; height:14px; }
.ag-lens-btn:hover,.ag-lens-btn:focus-visible { background:#a3f25c; outline:none; }
.ag-lens-btn:focus-visible { box-shadow:0 0 0 2px var(--demo-focus); }
.ag-lens-btn[aria-disabled="true"] { background:#262626; color:#6c6c6c; pointer-events:none; }
/* 进入 Compute Explorer 的转场：改动面板（复制一份）从原位放大成整块标签页区域，同时其余内容淡出；图标栏不动。
 * 展开时提前加载 Lens，代码和计算图随面板一起出现。 */
.ag-leaving .ag-side,.ag-leaving .ag-chat-pane,.ag-leaving .ag-diff,.ag-leaving .hp-status { opacity:0; transition:opacity .26s ease; }
.ag-leaving .ag-chat-pane { transform:translateX(-12px); transition:opacity .26s ease, transform .4s cubic-bezier(.2,.7,.2,1); }
.ag-fly { position:fixed; z-index:60; overflow:hidden; margin:0; background:var(--surface); border-radius:0; box-shadow:var(--demo-shadow-overlay);
  transition:left .8s cubic-bezier(.25,.65,.2,1), top .8s cubic-bezier(.25,.65,.2,1), width .8s cubic-bezier(.25,.65,.2,1), height .8s cubic-bezier(.25,.65,.2,1), box-shadow .8s ease; }
.ag-fly > .ag-fly-copy { position:absolute; z-index:2; inset:0; display:flex; flex-direction:column; transition:opacity .45s ease .18s; }
.ag-fly > iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--surface); }
.ag-code-flight { position:fixed; z-index:61; box-sizing:border-box; margin:0; padding:0; overflow:hidden; pointer-events:none;
  transition:left .8s cubic-bezier(.25,.65,.2,1), top .8s cubic-bezier(.25,.65,.2,1), width .8s cubic-bezier(.25,.65,.2,1), height .8s cubic-bezier(.25,.65,.2,1), opacity .32s ease; }
.ag-code-flight-content { box-sizing:border-box; padding:8px 0 24px; transform-origin:0 0; transition:opacity .22s ease; }
.ag-fly.is-full { box-shadow:none; }
.ag-fly.is-full > .ag-fly-copy { opacity:0; }
.ag-fly > .ag-fly-copy { pointer-events:none; }
.ag-file { display:flex; align-items:center; gap:8px; padding:0 14px 10px; color:var(--muted); font:12px var(--mono); }
.ag-file svg { width:14px; height:14px; color:var(--dim); flex:none; }
.ag-file .add { margin-left:auto; color:#a5e780; }
.ag-file .del { color:#6c6c6c; }
.ag-code { flex:1; min-height:0; overflow:auto; background:var(--canvas); padding:8px 0 24px; font:12px/1.75 var(--mono); }
.ag-code .cl { line-height:22px; }
.ag-code .tok-kw { color:#c084f5; font-weight:600; } .ag-code .tok-const { color:#59b0ff; }
.ag-code .tok-self { color:#d9739a; font-style:italic; } .ag-code .tok-fn { color:#e2c46b; }
.ag-code .tok-cls { color:#57c7a5; } .ag-code .tok-str { color:#c99a63; }
.ag-code .tok-num { color:#9fd08a; } .ag-code .tok-com { color:#777; font-style:italic; }
.ag-code .tok-dec { color:#8ea8ff; } .ag-code .tok-builtin { color:#4fc1e9; }
.ag-code .tok-prop { color:#9db4ff; } .ag-code .tok-op { color:#e0876a; }
.ag-code .tok-punc { color:#8a8a8a; } .ag-code .tok-doc { color:#6fae9c; font-style:italic; }
.ag-code .tok-interp { color:#ffd479; }
.ag-code .cl.is-add .cl-mark { box-shadow:inset 2px 0 0 color-mix(in srgb,var(--lime) 70%,transparent); }
.ag-code .cl.is-new { animation:ag-ln .5s ease both; }
@keyframes ag-ln { from { background:color-mix(in srgb,var(--lime) 12%,transparent); } to { background:transparent; } }
.cursor { display:inline-block; width:7px; height:14px; margin-left:1px; vertical-align:-2px; background:var(--lime); animation:ag-blink 1s steps(1) infinite; }
@keyframes ag-blink { 50% { opacity:0; } }
.ag-checks { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; flex:none; min-height:40px; padding:8px 14px; background:var(--surface); color:var(--dim); font:12px var(--sans); }
.ag-checks span { display:inline-flex; align-items:center; gap:6px; }
.ag-checks i { width:7px; height:7px; border-radius:50%; background:#3a3a3a; }
.ag-checks .ok { color:var(--muted); } .ag-checks .ok i { background:var(--lime); }
.ag-checks .warn { color:var(--amber); } .ag-checks .warn i { background:var(--amber); }

@media(max-width:1280px){ .ag-main.has-diff { grid-template-columns:52px minmax(360px,1fr) minmax(400px,46%); } .ag-main.has-diff > .ag-side { display:none; } }
@media(max-width:1000px){ .ag-main { grid-template-columns:52px minmax(0,1fr); } .ag-side,.ag-main.has-diff > .ag-side { display:none; }
  .ag-main.has-diff { grid-template-columns:52px minmax(0,1fr) minmax(340px,48%); } }
@media(max-width:860px){
  .hp-app.ag-app { height:auto; min-height:100dvh; grid-template-rows:auto auto auto; }
  .ag-main,.ag-main.has-diff { grid-template-columns:minmax(0,1fr); }
  .ag-rail { flex-direction:row; justify-content:flex-start; padding:8px 10px; }
  .ag-rail > :not(:first-child) { display:none; }
  .ag-scroll { overflow:visible; }
  .ag-col { min-height:0; }
  .ag-hero { margin:12vh auto 8vh; }
  .ag-dock { width:calc(100% - 24px); }
  .ag-code { max-height:60vh; }
  .ag-model small { display:none; }
}
@media(prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
<script defer src="../lab-tour-demo-v3/vendor/liquid-glass-controls/liquid-glass.js?v=final-v2"></script>
</head>
<body>
<div class="hp-app ag-app">

  <main class="ag-main" id="main">
    <!-- 最左图标栏（装饰，对应 Codex 的导航栏） -->
    <div class="ag-rail">
      <a class="is-on" href="agent.html" aria-label="打开 Compute Explorer" title="打开 Compute Explorer"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9 10 3.5 16.5 9v7.5h-13z"/></svg></a>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M7 3.5h6v4h4v6h-4v3H7v-3H3v-6h4z"/></svg></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/></svg></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 4h3.5v12H3.5zM8.5 4H12v12H8.5zM13.5 4.5l3 .8-2.8 10.5-3-.8"/></svg></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/></svg></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="5" r="1.8"/><circle cx="6" cy="15" r="1.8"/><circle cx="14" cy="9" r="1.8"/><path d="M6 7v6M14 11c0 3-3 2.5-6.5 3.5"/></svg></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 3.5h5v5h-5zM11.5 3.5h5v5h-5zM3.5 11.5h5v5h-5zM11.5 11.5h5v5h-5z"/></svg></span>
      <span aria-hidden="true" class="sp"></span>
      <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.8v2.4M10 14.8v2.4M2.8 10h2.4M14.8 10h2.4M4.9 4.9l1.7 1.7M13.4 13.4l1.7 1.7M4.9 15.1l1.7-1.7M13.4 6.6l1.7-1.7"/></svg></span>
    </div>

    <!-- 会话侧栏 -->
    <nav class="ag-side" aria-label="会话">

    <!-- 对话 -->
    <section class="ag-chat-pane" aria-label="Agent 对话">

        <button class="ag-icon-btn" id="diffToggle" type="button" aria-pressed="false" aria-label="显示 / 收起改动面板" title="改动面板" disabled><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="13" height="12" rx="2"/><path d="M11 3v12"/></svg></button>

            <span class="ag-hero-ic" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4.5c3 0 4.6 1.8 5.2 3.6 2.6.2 5.3 2.3 5.3 5.6 0 1.6-.6 2.7-1.3 3.5 1 1 1.6 2.2 1.6 3.7 0 3.4-3 5.6-5.8 5.4-1 1.6-2.8 2.7-5 2.7s-4-1.1-5-2.7c-2.8.2-5.8-2-5.8-5.4 0-1.5.6-2.7 1.6-3.7-.7-.8-1.3-1.9-1.3-3.5 0-3.3 2.7-5.4 5.3-5.6.6-1.8 2.2-3.6 5.2-3.6z"/><path d="m12 13.5 3 3-3 3M17.5 20h4"/></svg></span>
            <h2>想在 <u>qwen3_14b_pypto</u> 里写什么算子？</h2>

          <span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>qwen3_14b_pypto</span>
          <span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="7.5" rx="1.2"/><path d="M1.5 13h13"/></svg>a5 · 本机模拟</span>

            <span class="ag-tool"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/></svg>@paged_attention_pypto.py</span>

    <section class="hp-pane ag-diff" aria-label="本次改动">

        <a class="ag-lens-btn" id="lensBtn" href="agent.html" aria-disabled="true" tabindex="-1" title="生成完成后打开 Compute Explorer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg>Compute Explorer</a></header>

<script src="./js/paged-attention-pypto-source.js"></script>
<script src="./js/agent-python-highlight.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const main = $('main'), chat = $('chat'), scroll = $('scroll'), prompt = $('prompt'), code = $('code');
  const send = $('send'), status = $('status'), lens = $('lensBtn'), toggle = $('diffToggle');
  const source = window.PTO_PAGED_ATTENTION_PYPTO_SOURCE;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase = 'idle', fast = reduced || location.hash === '#done';
  const delay = ms => new Promise(resolve => setTimeout(resolve, fast ? 0 : ms));
  const bottom = () => { scroll.scrollTop = scroll.scrollHeight; };
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function message(className, text) {
    const node = element('div', 'msg ' + className, text);
    chat.appendChild(node); bottom(); return node;
  }
  function action(box, text) {
    const row = element('div', 'act-row'); row.dataset.state = 'run';
    const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox','0 0 16 16'); icon.setAttribute('fill','none'); icon.setAttribute('stroke','currentColor'); icon.setAttribute('stroke-width','1.5'); icon.setAttribute('aria-hidden','true');
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); circle.setAttribute('cx','8'); circle.setAttribute('cy','8'); circle.setAttribute('r','5'); icon.appendChild(circle);
    const label = element('span', 't', text); row.append(icon, label); box.appendChild(row); bottom();
    return { update(text) { label.textContent = text; }, done(text) { label.textContent = text; row.dataset.state = 'done'; } };
  }
  function showDiff(on) { main.classList.toggle('has-diff', on); toggle.setAttribute('aria-pressed', String(on)); }
  function checks(generated, analyzed) {
    $('checks').innerHTML = '<span class="' + (generated ? 'ok' : '') + '"><i></i>源码' + (generated ? ' · 已生成' : '') + '</span>' +
      '<span class="' + (analyzed ? 'ok' : '') + '"><i></i>静态结构' + (analyzed ? ' · 已整理' : '') + '</span>' +
      '<span><i></i>编译 / 精度 · 未执行</span>';
  }
  async function generate(text) {
    if (phase !== 'idle') return;
    if (typeof source !== 'string' || typeof window.agentHighlightPythonLines !== 'function') {
      status.textContent = '源码加载失败，请检查本地文件'; return;
    }
    phase = 'generating'; send.disabled = true; prompt.value = ''; prompt.disabled = true;
    $('hero')?.remove(); $('newChat').classList.remove('is-on'); $('newChat').removeAttribute('aria-current');
    const thread = element('li', 'ag-thread is-on is-new');
    const label = element('b', '', 'Paged Attention · 算子开发');
    const dot = element('span', 'st'); dot.dataset.state = 'run'; dot.setAttribute('aria-hidden','true');
    thread.append(label, dot); $('threads').prepend(thread);
    $('threadTitle').textContent = 'Paged Attention · 算子开发'; $('threadMeta').textContent = 'qwen3_14b_pypto';
    message('msg-user', text);
    const reply = message('msg-agent'); reply.append(element('p', '', '先整理算子输入与任务划分，再生成 PyPTO 源码。以下为预设演示回放。'));
    const steps = element('div', 'acts'); reply.append(steps);
    status.textContent = '演示回放 · 读取算子上下文';
    let step = action(steps, '正在读取模型配置与分页 KV 约束');
    await delay(650); step.done('已整理 Qwen3-14B 的 head 配置、KV Cache 和 block table');
    step = action(steps, '正在规划算子与任务分工');
    await delay(750); step.done('已规划 Q/K Norm、RoPE、Cache 写回与 Paged Attention 阶段');
    step = action(steps, '正在生成 paged_attention_pypto.py');
    showDiff(true); toggle.disabled = false; status.textContent = '演示回放 · 生成 Paged Attention 源码';
    const highlighted = window.agentHighlightPythonLines(source), lines = source.split('\n');
    const batchSize = 20;
    for (let start = 0; start < lines.length; start += batchSize) {
      const fragment = document.createDocumentFragment();
      for (let i = start; i < Math.min(lines.length, start + batchSize); i++) {
        const row = element('div', 'cl is-add'); row.dataset.line = i + 1;
        const mark = element('span', 'cl-mark'), number = element('span', 'cl-no', String(i + 1)), text = element('span', 'cl-text');
        text.style.setProperty('--d', Math.floor((lines[i].match(/^ */) || [''])[0].length / 4));
        text.innerHTML = highlighted[i] || ' '; row.append(mark, number, text); fragment.appendChild(row);
      }
      code.appendChild(fragment); code.scrollTop = code.scrollHeight;
      const count = Math.min(lines.length, start + batchSize);
      $('addCount').textContent = '+' + count; $('diffMeta').textContent = count + ' / ' + lines.length + ' 行';
      step.update('正在生成 paged_attention_pypto.py · ' + count + ' / ' + lines.length + ' 行');
      await delay(25);
    }
    step.done('已展示 paged_attention_pypto.py · ' + lines.length + ' 行'); checks(true, false);
    step = action(steps, '正在整理计算图与任务视图');
    await delay(700); step.done('已准备计算图、Assignment 和 Pipeline 视图'); checks(true, true);
    const finish = message('msg-agent');
    finish.append(element('p', '', 'Paged Attention 源码已展示。打开 Compute Explorer，查看算子结构、计算图和源码联动。'));
    finish.append(element('p', '', '这是基于已有源码的演示回放；本次没有执行编译、精度或硬件验证。'));
    const suggestions = element('div', 'suggest'), open = element('a', 'chip', '打开 Compute Explorer →'); open.href = 'agent.html'; suggestions.append(open); finish.append(suggestions);
    phase = 'done'; dot.dataset.state = 'done'; lens.removeAttribute('aria-disabled'); lens.removeAttribute('tabindex'); lens.title = '打开 Compute Explorer';
    status.textContent = '演示回放 · 源码已展示 · 编译与精度未执行'; prompt.disabled = false; prompt.placeholder = '输入 /explore 打开可视化'; send.disabled = false; bottom();
    // 返回生成结果时停留在当前页面；正常回放完成后自动进入可视化。
    if (location.hash !== '#done') { await delay(650); openExplorer(); }
  }
  let explorerFlight = null, explorerFrame = null, leaving = false;
  function restoreGeneration() {
    if (explorerFlight) explorerFlight.hidden = true;
    document.body.classList.remove('ag-leaving');
    leaving = false;
  }
  function openExplorer() {
    if (phase !== 'done' || leaving) return;
    if (reduced) { location.href = 'agent.html'; return; }
    leaving = true;
    if (explorerFlight) { explorerFlight.remove(); explorerFlight = null; explorerFrame = null; }
    const panel = main.querySelector('.ag-diff');
    const origin = panel && panel.offsetParent ? panel : lens;
    const rect = origin.getBoundingClientRect();
    const fly = element('div', 'ag-fly');
    const frame = document.createElement('iframe');
    frame.title = 'PyPTO Compute Explorer';
    frame.src = 'agent.html?from-generation=1';
    frame.style.width = innerWidth + 'px';
    frame.style.height = innerHeight + 'px';
    fly.appendChild(frame);
    if (origin === panel) {
      const copy = panel.cloneNode(true);
      copy.className = 'ag-fly-copy';
      copy.removeAttribute('id');
      copy.setAttribute('aria-hidden', 'true');
      copy.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
      fly.appendChild(copy);
    }
    Object.assign(fly.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
    document.body.appendChild(fly);
    const copiedCode = fly.querySelector('.ag-fly-copy .ag-code');
    if (copiedCode) { copiedCode.scrollTop = code.scrollTop; copiedCode.scrollLeft = code.scrollLeft; }
    explorerFlight = fly; explorerFrame = frame;
    let started = false;
    const start = () => {
      if (started || !leaving) return;
      started = true;
      document.body.classList.add('ag-leaving');
      try { history.pushState({ pyptoExplorer: true }, '', '#explorer'); } catch (_) { /* Local-file history may be unavailable. */ }
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fly.classList.add('is-full');
        Object.assign(fly.style, { left:'0px', top:'0px', width:innerWidth + 'px', height:innerHeight + 'px' });
      }));
    };
    frame.addEventListener('load', start, { once:true });
    setTimeout(start, 3000);
  }
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href="agent.html"]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (phase !== 'done' || link.getAttribute('aria-disabled') === 'true') { event.preventDefault(); return; }
    event.preventDefault(); openExplorer();
  });
  window.addEventListener('message', event => {
    if (explorerFrame && event.source === explorerFrame.contentWindow && event.data?.type === 'pypto-agent:back') {
      if (history.state?.pyptoExplorer) history.back(); else restoreGeneration();
    }
  });
  window.addEventListener('popstate', event => {
    if (event.state?.pyptoExplorer && explorerFlight) { explorerFlight.hidden = false; leaving = true; document.body.classList.add('ag-leaving'); }
    else restoreGeneration();
  });
  window.addEventListener('resize', () => {
    if (!explorerFlight || explorerFlight.hidden || !explorerFlight.classList.contains('is-full')) return;
    Object.assign(explorerFlight.style, { width:innerWidth + 'px', height:innerHeight + 'px' });
    Object.assign(explorerFrame.style, { width:innerWidth + 'px', height:innerHeight + 'px' });
  });

  $('composer').addEventListener('submit', event => {
    event.preventDefault(); const text = prompt.value.trim(); if (!text || send.disabled) return;
    if (phase === 'idle') generate(text);
    else if (phase === 'done' && /^\/(explore|lens)\b/i.test(text)) openExplorer();
    else if (phase === 'done') { message('msg-user', text); message('msg-agent', '当前为固定演示回放。可输入 /explore 打开可视化，或点击“新聊天”重新演示。'); prompt.value = ''; }
  });
  prompt.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('composer').requestSubmit(); } });
  toggle.addEventListener('click', () => showDiff(!main.classList.contains('has-diff')));
  $('newChat').addEventListener('click', () => { location.href = 'agent-generation.html'; });
  if (location.hash === '#done') generate(prompt.value.trim());
  else prompt.focus({preventScroll:true});
}());
</script>
