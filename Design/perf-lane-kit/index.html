<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device Perf Lane</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="src/focus-components/inline.css"></head><body>
<header class="top"><h1>Device Perf Lane</h1><span id="source">加载数据中…</span><div class="sp"></div><button id="summary-toggle" class="summary-toggle" type="button" aria-expanded="true" aria-controls="summary">执行窗口 — ▴</button><label class="upload">导入运行文件夹<input id="folder" type="file" webkitdirectory directory multiple></label><label class="upload">导入整理后 JSON<input id="file" type="file" accept=".json,application/json"></label><label class="mock-label" id="mock-label" hidden><input id="mock" type="checkbox"> 原 Demo 对照数据（含 Mock）</label><label class="mode-label">呈现 <select id="display-mode" aria-label="呈现模式"><option value="combined">关键路径与全部泳道</option><option value="path">关键路径与相关 Task</option><option value="critical">仅关键路径图</option><option value="lane">仅泳道</option></select></label><label class="rank-label">采集 <select id="rank" aria-label="选择采集"></select></label></header>
<div id="error" role="alert" hidden></div><div id="mode-notice" role="status" hidden></div><dl class="summary" id="summary"></dl>
<main class="analysis-closed"><div class="main-column"><div class="trace-pair"><section class="path-section" id="path-section"><div class="sec-h"><h2>关键路径</h2><span class="view-tag">依赖顺序</span><span id="path-info" class="muted"></span><div class="sp"></div><div class="path-legend"><span>■ 单块任务（未必等待）</span><span>■ 计算任务</span><span>■ 当前选中</span></div></div><div class="scroll path-scroll"><svg id="critical" role="img" aria-label="关键路径"></svg></div></section>
<section class="lane-section" id="lane-section"><div class="scroll lane-scroll" id="viewport" title="Ctrl + 滚轮缩放；缩放后可拖动平移"><div class="axis-sticky"><svg id="lane-axis" aria-label="设备时间轴"></svg></div><div id="single-scroll-before" aria-hidden="true"></div><svg id="lane" role="img" aria-label="设备泳道"></svg><div id="single-scroll-after" aria-hidden="true"></div></div><div class="lane-toolbar" role="toolbar" aria-label="设备泳道视图与分析控制">
  <div class="bar-group"><details class="bar-menu view-menu"><summary aria-label="泳道布局"><span id="view-label">按物理核</span></summary><div class="menu-panel" role="radiogroup" aria-label="泳道布局"><button type="button" class="view-choice" role="radio" aria-checked="false" data-view-choice="task">按 Task</button><button type="button" class="view-choice" role="radio" aria-checked="true" data-view-choice="core">按物理核</button></div></details><select id="view" class="feature-native" aria-label="泳道布局"><option value="core">按物理核</option><option value="task">按 Task</option></select></div>
  <div class="bar-group"><details class="bar-menu"><summary aria-label="图层显示">图层显示</summary><div class="menu-panel layers-menu"><strong>图层显示</strong><label><input id="ribbon" type="checkbox" checked> 并行宽度</label><label><input id="bands" type="checkbox" checked> 低并行区</label><label title="标注最长 Task、最长串行段等时间范围"><input id="marks" type="checkbox" checked> 关键时间段标注</label><label><input id="composition" type="checkbox"> 耗时构成</label></div></details></div>
  <div class="bar-group"><details class="bar-menu"><summary id="feature-mode">特征分布</summary><div class="menu-panel"><strong class="feature-menu-title">任务特征</strong><select id="feature" class="feature-native" aria-label="Task 分布"><option value="recommended">系统推荐 · 多类型</option><option value="none" selected>关闭</option><option value="tail">拖尾任务</option><option value="parallel">Task 并行度不足</option><option value="imbalance">块负载不均</option><option value="underfill">尾波空置</option><option value="fragmented">离散小 Task</option><option value="setup">Setup 占比高</option><option value="bubble">依赖间隔</option></select><div id="feature-choices" class="feature-choices" role="radiogroup" aria-label="Task 分布"></div></div></details></div>
  <div class="bar-group"><details class="bar-menu results-menu" id="results-menu"><summary id="toolbar-analysis" aria-controls="optimization-list" aria-expanded="false">优化</summary><div class="menu-panel optimization-menu"><strong>优化候选</strong><div id="optimization-list"></div></div></details></div>
  <div class="bar-group"><button id="single-toggle" type="button" aria-controls="single-panel" aria-expanded="false" aria-label="单依赖分析" title="单依赖分析"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5v8H3zM16 8h5v8h-5zM10 12h1M13 12h1"/></svg></button></div>
</div><div class="canvas-tools" role="toolbar" aria-label="泳道显示与缩放"><details class="bar-menu legend-menu"><summary aria-label="图例与交互说明"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6M12 7v.1"/></svg></summary><div class="menu-panel"><strong>图例与交互</strong><p class="legend" id="legend"></p><p>Ctrl + 滚轮缩放时间轴，拖动平移。</p></div></details><button id="rows" aria-pressed="false" aria-label="展开泳道行" title="展开行"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="expand-icon"><path d="M4 10h16M4 14h16M12 7V2m-3 3 3-3 3 3M12 17v5m-3-3 3 3 3-3"/></g><g class="compact-icon"><path d="M4 3h16M4 21h16M12 6v4m-3-3 3 3 3-3M12 18v-4m-3 3 3-3 3 3"/></g></svg></button><span class="control-divider"></span><button id="zoom-out" aria-label="缩小时间轴"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="zoom-in" aria-label="放大时间轴"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button><button id="reset" aria-label="适配整体">Fit</button></div><p class="range" id="range"></p></section></div></div>
<div id="single-grip" class="single-grip" hidden tabindex="0" role="separator" aria-orientation="vertical" aria-label="调整单依赖分析面板宽度" aria-controls="single-panel"></div><aside id="single-panel" class="single-panel" hidden aria-label="连续单依赖分析"></aside>
</main>
<section class="task-drawer" id="drawer" hidden aria-label="任务分析"><div class="drawer-head"><h2>任务分析</h2><button id="close-detail" aria-label="关闭任务分析">×</button></div><div id="detail" class="muted"></div></section><dialog id="drilldown"><div class="drill-header"><strong>核内泳道与 Pass 分析</strong><button id="close-drilldown">关闭 ×</button></div><iframe id="drill-frame" title="核内泳道与 Pass 分析"></iframe></dialog><script src="/reference/legend-library-icons.js"></script><script src="/reference/qk-residency.js"></script><script src="src/focus-components/incore.js"></script><script src="src/focus-components/pipeline.js"></script><script src="src/focus-components/evolution.js"></script><script src="src/focus-components/transform.js"></script><script type="module" src="src/app.js"></script></body></html>
