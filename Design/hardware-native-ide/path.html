<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardware-Native 主线</title>
  <link rel="stylesheet" href="./styles/path.css?v=20261031-2" />
</head>
<body>
  <div class="hp-app">
    <header class="hp-top">
      <div class="hp-top-left">
        <span class="hp-brand">HARDWARE-NATIVE LENS</span>
        <span class="hp-mode">主线</span>
        <span class="hp-crumb">decode_layer.py<i>/</i><b>fa_fused</b></span>
      </div>
      <div class="hp-top-right">
        <span class="hp-target" title="UB 保留区数据取自 pto-isa#170（a2a3）；Right 容量沿用 Lens 的示例口径">
          <span class="hp-dot"></span>目标 a2a3 · 示例口径
        </span>
        <a class="hp-topbtn" href="./index.html">Lens 工作台</a>
        <button class="hp-topbtn" type="button" id="hpReset">重来</button>
      </div>
    </header>

    <main class="hp-main">
      <section class="hp-pane hp-code" aria-label="源码节选">
        <header class="hp-pane-head">
          <span class="hp-pane-title">源码</span>
          <span class="hp-pane-meta">decode_layer.py · 728–798 节选 · 行号与原文件一致</span>
        </header>
        <div class="hp-code-body" id="hpCode"></div>
      </section>

      <section class="hp-pane hp-mid" aria-label="算子逻辑与硅片落点">
        <div class="hp-logic">
          <header class="hp-pane-head">
            <span class="hp-pane-title">算子逻辑</span>
            <span class="hp-pane-meta" id="hpLogicMeta">fa_fused · 循环嵌套与计算链</span>
          </header>
          <div class="hp-logic-svg" id="hpLogic"></div>
        </div>
        <div class="hp-chip">
          <header class="hp-pane-head">
            <span class="hp-pane-title">硅片落点</span>
            <span class="hp-pane-meta" id="hpChipMeta">示意 · 不按比例 · Vec 地址条按比例</span>
          </header>
          <div class="hp-svg" id="hpSvg"></div>
        </div>
        <div class="hp-caption" id="hpCaption" aria-live="polite"></div>
      </section>

      <aside class="hp-pane hp-story" aria-label="主线">
        <header class="hp-pane-head">
          <span class="hp-pane-title">主线</span>
          <span class="hp-pane-meta">stage 2 → 4 会发生什么</span>
        </header>
        <div class="hp-story-body" id="hpStory"></div>
      </aside>
    </main>

    <footer class="hp-status">
      <span class="hp-status-main" id="hpStatus" aria-live="polite">—</span>
      <span class="hp-status-dim">编码期估算 · 未经编译 · 未上板</span>
    </footer>
  </div>

  <script src="./js/path.js?v=20261031-2"></script>
</body>
</html>
