<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTO Pattern - Memory Reuse Viewer</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('embed')) document.documentElement.dataset.embedPreview = 'true';
      const applyTheme = (theme) => {
        if (theme !== 'light' && theme !== 'dark' && theme !== 'glass') return;
        document.documentElement.dataset.theme = theme;
        window.dispatchEvent(new CustomEvent('pto-memory-reuse-theme-change'));
      };
      applyTheme(params.get('theme'));
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'pto-preview-theme') applyTheme(event.data.theme);
      });
    })();
  </script>
  <link rel="stylesheet" href="../../tokens/foundation.css">
  <link rel="stylesheet" href="../../tokens/semantic.css">
  <link rel="stylesheet" href="../../tokens/components.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="./pattern.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--foreground);
    }

    .preview-shell {
      height: 100vh;
      padding: var(--space-6);
      box-sizing: border-box;
    }

    #memoryReusePreview {
      height: 100%;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: transparent;
    }

    html[data-embed-preview='true'] .preview-shell {
      padding: 0;
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <div id="memoryReusePreview"></div>
  </main>
  <script src="./pattern.js"></script>
  <script>
    const memoryReuseController = window.PtoMemoryReuseViewer?.render(
      document.getElementById('memoryReusePreview'),
      window.PtoMemoryReuseViewer.createDemoData({ coreTitle: 'AIV 1 UB' }),
      { initialBuffer: 'UB' }
    );
    window.addEventListener('pto-memory-reuse-theme-change', () => memoryReuseController?.resize());
    window.addEventListener('beforeunload', () => memoryReuseController?.destroy());
  </script>
</body>
</html>
