<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Training Graphviz Pattern</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const applyTheme = (theme) => {
        if (theme === 'light' || theme === 'dark' || theme === 'glass') {
          document.documentElement.dataset.theme = theme;
        }
      };
      if (params.get('embed') === '1') {
        document.documentElement.dataset.embed = '1';
      }
      applyTheme(params.get('theme'));
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'pto-preview-theme') {
          applyTheme(event.data.theme);
        }
      });
    })();
  </script>
  <link rel="stylesheet" href="../../tokens/foundation.css">
  <link rel="stylesheet" href="../../tokens/semantic.css">
  <link rel="stylesheet" href="../../tokens/components.css">
  <link rel="stylesheet" href="../model-graphviz/pattern.css?v=training-gallery-align-3">
  <link rel="stylesheet" href="./pattern.css?v=training-gallery-align-3">
  <style>
    :root {
      --training-bg: var(--background);
      --training-panel: color-mix(in srgb, var(--panel-shell-bg) 94%, transparent);
      --training-border: var(--border-subtle);
      --training-text: var(--foreground);
      --training-muted: var(--foreground-secondary);
      --training-accent: var(--highlight-copy-blue-300);
      --model-graphviz-bg: var(--training-bg);
      --model-graphviz-surface: var(--training-panel);
      --model-graphviz-stage-bg: var(--training-bg);
      --model-graphviz-line: color-mix(in srgb, var(--training-muted) 82%, transparent);
      --model-graphviz-line-soft: var(--border-strong);
      --model-graphviz-node-label: var(--training-text);
      --model-graphviz-node-type: var(--training-muted);
      --model-graphviz-cluster-label: var(--training-muted);
      --model-graphviz-toggle-bg: color-mix(in srgb, var(--training-accent) 60%, var(--training-panel));
      --model-graphviz-toggle-border: color-mix(in srgb, var(--training-accent) 64%, var(--border-strong));
      --model-graphviz-toggle-icon: var(--training-text);
      --model-graphviz-node-shadow: none;
      --model-graphviz-parent-shadow: none;
      --model-graphviz-panel-shadow: none;
    }

    :root[data-theme='light'] {
      --training-panel: #F8F8F8;
      --model-graphviz-line: color-mix(in srgb, var(--foreground-secondary) 68%, transparent);
      --model-graphviz-line-soft: color-mix(in srgb, var(--border-strong) 58%, transparent);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--training-bg);
      color: var(--training-text);
      font-family: var(--font-sans);
    }

    body {
      overflow: hidden;
    }

    .training-app {
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      min-height: 100vh;
      background: var(--training-bg);
    }

    :root[data-embed='1'] .training-app {
      grid-template-rows: 1fr;
      min-height: 0;
      height: 100vh;
    }

    .training-topbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: var(--space-3);
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--training-border);
      background: var(--training-panel);
    }

    :root[data-embed='1'] .training-topbar {
      display: none;
    }

    .training-title {
      min-width: 0;
    }

    .training-title h1 {
      margin: 0;
      color: var(--training-text);
      font: 700 16px / 1.2 var(--font-sans);
      letter-spacing: 0;
    }

    .training-title span {
      display: block;
      margin-top: 4px;
      color: var(--training-muted);
      font: 12px / 1.4 var(--font-sans);
    }

    .training-actions,
    .training-facts {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .training-actions {
      justify-content: flex-end;
    }

    .training-actions button {
      min-height: 30px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--surface-1);
      color: var(--foreground-secondary);
      padding: 0 10px;
      font: 600 12px / 1 var(--font-sans);
      letter-spacing: 0;
      cursor: pointer;
    }

    .training-actions button:hover {
      color: var(--foreground);
      background: var(--state-hover);
    }

    .training-actions button.is-selected {
      border-color: var(--border-strong);
      background: var(--state-selected);
      color: var(--foreground);
    }

    .training-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--training-bg);
      cursor: grab;
    }

    .training-stage.is-panning {
      cursor: grabbing;
    }

    .training-stage svg {
      display: block;
      transform-origin: 0 0;
      will-change: transform;
    }

    .training-facts {
      padding: 9px 12px;
      border-top: 1px solid var(--training-border);
      background: color-mix(in srgb, var(--training-panel) 90%, transparent);
    }

    .training-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      max-width: 100%;
      border-radius: 999px;
      padding: 0 9px;
      background: color-mix(in srgb, var(--foreground) 9%, transparent);
      color: var(--training-muted);
      font: 600 11px / 1 var(--font-sans);
      white-space: nowrap;
    }

    .training-status {
      min-height: 28px;
      padding: 7px 12px;
      border-top: 1px solid var(--training-border);
      color: var(--training-muted);
      background: var(--training-panel);
      font: 11px / 1.2 var(--font-sans);
    }

    :root[data-embed='1'] .training-facts,
    :root[data-embed='1'] .training-status {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .training-app {
        min-height: 860px;
      }

      .training-topbar {
        grid-template-columns: 1fr;
      }

      .training-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="training-app">
    <header class="training-topbar">
      <div class="training-title">
        <h1>Pangu MoE Training Graph</h1>
        <span>model-training-graphviz · compact architecture with phase evidence</span>
      </div>
      <div class="training-actions" aria-label="训练阶段">
        <button type="button" data-phase="embedding">Embedding</button>
        <button type="button" data-phase="attention">Attention</button>
        <button type="button" data-phase="router">Router</button>
        <button type="button" data-phase="experts">Experts</button>
        <button type="button" data-phase="logits">Logits</button>
        <button type="button" data-action="fit">Fit</button>
      </div>
    </header>
    <section class="training-stage pto-model-architecture-stage" id="previewStage" aria-label="Pangu MoE training architecture graph"></section>
    <div class="training-facts" id="factRow" aria-label="Model training graph facts"></div>
    <div class="training-status" id="statusText">Loading training graph.</div>
  </main>

  <script src="../model-graphviz/pattern.js?v=training-gallery-align-3"></script>
  <script src="./pattern.js?v=training-gallery-align-3"></script>
  <script>
    const FACTS = [
      '50 decoder layers',
      'dense 0-3 / MoE 4-49',
      '80 routed experts',
      'top-8 routing',
      'weights left · state right',
    ];

    const PHASES = {
      embedding: {
        label: 'Embedding',
        nodeId: 'embedding',
        relatedNodeIds: ['token_ids', 'embedding_weight', 'dense_block'],
      },
      attention: {
        label: 'Attention',
        nodeId: 'attention',
        relatedNodeIds: ['dense_block', 'attention_weights', 'moe_norm'],
      },
      router: {
        label: 'Router',
        nodeId: 'router',
        relatedNodeIds: ['moe_norm', 'norm_gamma', 'router_weight', 'dispatch', 'dispatch_buffer'],
      },
      experts: {
        label: 'Experts',
        nodeId: 'experts',
        relatedNodeIds: ['dispatch', 'dispatch_buffer', 'expert_weights', 'shared_expert', 'shared_weights', 'combine'],
      },
      logits: {
        label: 'Logits',
        nodeId: 'lm_head',
        relatedNodeIds: ['final_norm', 'lm_head_weight', 'logits'],
      },
    };

    let controller = null;
    let activePhase = 'router';

    function compactNode(id, label, typeLabel, kind, x, y, width, height, colorKey) {
      return { id, label, typeLabel, kind, x, y, width, height, colorKey };
    }

    function evidenceItem(dimension, metric, what, evidence, action, relatedNodeIds = [], sources = []) {
      return { dimension, metric, what, evidence, action, relatedNodeIds, sources };
    }

    function makePanguMoETrainingGraph() {
      const cx = 640;
      const left = 310;
      const right = 970;
      const nodes = [
        compactNode('token_ids', 'Token IDs', 'Input', 'tensor', cx, 72, 170, 48, 'io:input'),
        compactNode('embedding', 'Parallel Embedding', 'Op', 'op', cx, 178, 250, 56, 'sem:embedding'),
        compactNode('dense_block', 'Dense Decoder Block', 'Module', 'op', cx, 292, 280, 58, 'module:decoder'),
        compactNode('attention', 'MLA Attention', 'Op', 'op', cx, 420, 230, 54, 'sem:attention'),
        compactNode('moe_norm', 'MoE RMSNorm', 'Op', 'op', cx, 526, 220, 54, 'sem:norm'),
        compactNode('router', 'Router Gate', 'Op', 'op', cx, 630, 210, 54, 'sem:gate'),
        compactNode('dispatch', 'All-to-All Dispatch', 'Comm', 'op', cx, 730, 230, 52, 'sem:comm'),
        compactNode('dispatch_buffer', 'Dispatch Buffer', 'State', 'tensor', right, 730, 188, 48, 'io:state'),
        compactNode('experts', 'Routed Expert Pool', 'Op', 'op', cx, 832, 250, 58, 'sem:moe'),
        compactNode('shared_expert', 'Shared Expert', 'Module', 'op', right, 832, 180, 58, 'sem:mlp'),
        compactNode('combine', 'All-to-All Combine', 'Comm', 'op', cx, 934, 230, 52, 'sem:comm'),
        compactNode('final_norm', 'Final RMSNorm', 'Op', 'op', cx, 1044, 210, 54, 'sem:norm'),
        compactNode('lm_head', 'LM Head', 'Op', 'op', cx, 1148, 190, 54, 'sem:head'),
        compactNode('logits', 'Logits', 'Output', 'tensor', cx, 1252, 160, 48, 'io:output'),
        compactNode('embedding_weight', 'Embedding Weight', 'Parameter', 'tensor', left, 178, 190, 48, 'io:parameter'),
        compactNode('attention_weights', 'Attention Weights', 'Parameter', 'tensor', left, 420, 190, 48, 'io:parameter'),
        compactNode('router_weight', 'Router Weight', 'Parameter', 'tensor', left, 630, 180, 48, 'io:parameter'),
        compactNode('expert_weights', 'Expert Weights', 'Parameter', 'tensor', left, 832, 180, 48, 'io:parameter'),
        compactNode('shared_weights', 'Shared Weights', 'Parameter', 'tensor', left, 742, 180, 48, 'io:parameter'),
        compactNode('norm_gamma', 'Norm Gamma', 'Parameter', 'tensor', left, 526, 170, 48, 'io:parameter'),
        compactNode('lm_head_weight', 'LM Head Weight', 'Parameter', 'tensor', left, 1148, 190, 48, 'io:parameter'),
      ];

      const edges = [
        ['token_ids', 'embedding', 'ACT', 'activation'],
        ['embedding', 'dense_block', 'ACT', 'activation'],
        ['dense_block', 'attention', 'ACT', 'activation'],
        ['attention', 'moe_norm', 'ACT', 'activation'],
        ['moe_norm', 'router', 'ACT', 'activation'],
        ['router', 'dispatch', 'dispatch', 'communication'],
        ['dispatch', 'experts', 'TOKENS', 'communication'],
        ['moe_norm', 'shared_expert', 'ACT', 'activation'],
        ['shared_expert', 'combine', 'ACT', 'activation'],
        ['experts', 'combine', 'combine', 'communication'],
        ['combine', 'final_norm', 'ACT', 'activation'],
        ['final_norm', 'lm_head', 'ACT', 'activation'],
        ['lm_head', 'logits', 'LOGITS', 'gradient'],
      ].map(([source, target, tag, edgeType]) => ({ source, target, tag, edgeType }));

      edges.push(
        { source: 'embedding_weight', target: 'embedding', tag: 'W', edgeType: 'parameter', dashed: true },
        { source: 'attention_weights', target: 'attention', tag: 'W', edgeType: 'parameter', dashed: true },
        { source: 'router_weight', target: 'router', tag: 'W', edgeType: 'parameter', dashed: true },
        { source: 'dispatch_buffer', target: 'dispatch', tag: 'state', edgeType: 'state', dashed: true },
        { source: 'expert_weights', target: 'experts', tag: 'W', edgeType: 'parameter', dashed: true },
        { source: 'shared_weights', target: 'shared_expert', tag: 'W', edgeType: 'parameter', dashed: true },
        { source: 'norm_gamma', target: 'moe_norm', tag: 'gamma', edgeType: 'parameter', dashed: true },
        { source: 'lm_head_weight', target: 'lm_head', tag: 'W', edgeType: 'parameter', dashed: true }
      );

      return {
        width: 1280,
        height: 1340,
        clusters: [
          { id: 'model', label: 'Pangu MoE', x: 60, y: 132, width: 1130, height: 1170, colorKey: 'module:model' },
          { id: 'decoder', label: '50 decoder layers', x: 410, y: 246, width: 460, height: 770, colorKey: 'module:decoder', repeat: true },
          { id: 'moe', label: 'MoE FFN', x: 430, y: 570, width: 610, height: 420, colorKey: 'sem:moe', repeat: true },
        ],
        nodes,
        edges,
        trainingEvidence: {
          embedding_weight: evidenceItem(null, 'parameter tensor', 'embedding.weight', [
            'Embedding Weight 是输入侧参数，不是运行态 state。',
            '它和 vocab/hidden 共同决定 token ids 到 hidden states 的映射。',
          ], '先确认词表、hidden size 和 shard 规则，再进入 dense/MoE 主干。', ['embedding'], ['config', 'weights index']),
          attention_weights: evidenceItem(null, 'parameter tensor', 'attention weights', [
            'Attention Weights 属于 decoder attention 的参数输入。',
            '训练解释里它应该保持在左侧 weight lane，而不是和 cache/state 混在一起。',
          ], '分析 attention 低效时，把参数读取、激活流和 state/cache 分开看。', ['attention'], ['model source']),
          norm_gamma: evidenceItem(null, 'parameter tensor', 'rms norm gamma', [
            'Norm Gamma 是 MoE RMSNorm 的参数输入。',
            '它和 router 之前的 hidden-state 归一化绑定。',
          ], '定位 router 分布异常时，同时检查 norm 输入和 router weight。', ['moe_norm', 'router'], ['model source']),
          router_weight: evidenceItem(null, 'parameter tensor', 'router.weight', [
            'Router Weight 为 token 生成专家打分，是 MoE 训练瓶颈分析的入口。',
            'top-8 与专家并行规模需要一起解释。',
          ], '观察 expert load、token drop、all-to-all wait 和 straggler rank。', ['router', 'dispatch'], ['MoE config']),
          expert_weights: evidenceItem(null, 'parameter tensor', 'expert weights', [
            'Expert Weights 是 routed experts 的参数输入。',
            '它们数量多，但仍属于左侧 weight lane。',
          ], '专家耗时异常时，先区分 matmul、dispatch 和负载不均。', ['experts'], ['weights index']),
          shared_weights: evidenceItem(null, 'parameter tensor', 'shared expert weights', [
            'Shared Weights 输入右侧 Shared Expert 模块。',
            '权重本身仍在左侧输入 lane，模块节点才在右侧辅助分支。',
          ], '解释共享专家时保持 weights 与 module 的语义分离。', ['shared_expert'], ['model source']),
          lm_head_weight: evidenceItem(null, 'parameter tensor', 'lm_head.weight', [
            'LM Head Weight 把 final hidden states 投影到 logits。',
            '输出侧参数仍属于 weight lane。',
          ], 'loss 或 logits 异常时，沿 final_norm、lm_head、logits 逐层看。', ['lm_head', 'logits'], ['config', 'weights index']),
          router: evidenceItem('P1', 'MoE routing', 'top-8 / 80 experts', [
            'Router Gate 为每个 token 选择 routed experts。',
            '训练风险通常从单算子算力转向负载均衡、通信等待和 token 分布。',
          ], '把 router logits、TopK、dispatch 和专家负载作为一个链路观察。', ['router_weight', 'dispatch', 'experts']),
          dispatch: evidenceItem('P1', 'communication', 'all-to-all dispatch', [
            'All-to-All Dispatch 是 expert parallel 的关键通信面。',
            'MFU 下降但专家 matmul 不慢时，瓶颈经常在这里。',
          ], '联查 rank 间 token 分布、all-to-all overlap 和 straggler。', ['router', 'dispatch_buffer', 'experts', 'combine']),
          dispatch_buffer: evidenceItem(null, 'runtime state', 'dispatch buffer', [
            'Dispatch Buffer 是 token 按专家分组后的运行态状态。',
            '它不属于模型权重，因此放在右侧 state lane。',
          ], '通信等待升高时，结合 dispatch buffer 和专家负载一起看。', ['dispatch', 'experts'], ['profiling trace']),
          experts: evidenceItem('P1', 'expert compute', 'routed expert pool', [
            'Routed Expert Pool 承接按 token 路由后的主要 MoE 计算。',
            '专家权重、token 分布和 EP 通信共同决定训练效率。',
          ], '专家耗时长时同时看 expert_weights、dispatch 和 combine。', ['expert_weights', 'dispatch', 'combine']),
          shared_expert: evidenceItem('P2', 'shared branch', 'shared expert', [
            'Shared Expert 是右侧辅助专家分支，不是参数节点。',
            '它与 routed experts 一起汇入 combine。',
          ], '保持共享专家模块在右侧，shared weights 在左侧。', ['shared_weights', 'combine']),
          combine: evidenceItem('P2', 'MoE output', 'weighted combine', [
            'All-to-All Combine 把专家输出合并回主干 hidden states。',
            '这里是 MoE 分支回到 dense 流的同步点。',
          ], 'combine 等待升高时，优先判断通信拓扑还是专家负载不均。', ['experts', 'shared_expert', 'final_norm']),
          lm_head: evidenceItem('P2', 'output projection', 'logits path', [
            'LM Head 生成 logits，是训练 loss 前的最后投影。',
            '它依赖 final_norm 激活和 lm_head_weight 参数。',
          ], '排查 loss spike 时从 logits 回溯到 LM Head 和 MoE combine。', ['lm_head_weight', 'logits']),
        },
      };
    }

    function setSelectedPhase(phaseId) {
      const phase = PHASES[phaseId] || PHASES.router;
      activePhase = PHASES[phaseId] ? phaseId : 'router';
      document.querySelectorAll('[data-phase]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.phase === activePhase);
      });
      document.getElementById('statusText').textContent = `${phase.label} phase selected.`;
      controller?.setPhase?.({
        nodeId: phase.nodeId,
        relatedNodeIds: phase.relatedNodeIds,
      });
    }

    function renderGraph() {
      const stage = document.getElementById('previewStage');
      const graph = makePanguMoETrainingGraph();
      if (controller) controller.destroy();
      controller = window.PtoModelTrainingGraphvizPattern.render(stage, graph, {
        ariaLabel: 'Pangu MoE training graph',
        className: 'pto-model-architecture-stage',
        reportOverlays: false,
        viewportPadding: 32,
        fitMode: 'readable',
        minReadableZoom: 0.58,
        autoFit: true,
        colormap: window.PtoModelGraphvizPattern.modelArchitectureColormap(graph),
        activeNodeId: PHASES[activePhase].nodeId,
        activeRelatedNodeIds: PHASES[activePhase].relatedNodeIds,
        interaction: {
          panZoom: true,
          selectable: true,
          selectableClusters: false,
          relatedHighlight: true,
        },
        overlays: {
          evidence: true,
          edgeTags: true,
        },
      });
      document.getElementById('factRow').innerHTML = FACTS.map((fact) => `<span class="training-chip">${fact}</span>`).join('');
      setSelectedPhase(activePhase);
    }

    document.querySelectorAll('[data-phase]').forEach((button) => {
      button.addEventListener('click', () => setSelectedPhase(button.dataset.phase));
    });
    document.querySelector('[data-action="fit"]')?.addEventListener('click', () => controller?.fit?.());
    renderGraph();
  </script>
</body>
</html>
