<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operator Metric Card Preview</title>
  <style>
    :root {
      color-scheme: light;
      --page: #dedede;
      --card: #ffffff;
      --card-border: rgba(255,255,255,.92);
      --op: #a8c0eb;
      --op-border: #d8e5fa;
      --text: #050505;
      --muted: #4b5563;
      --shadow: 0 1px 0 rgba(255,255,255,.8);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #111317;
      --card: #262a31;
      --card-border: rgba(255,255,255,.08);
      --op: #718fc8;
      --op-border: #8ca8dc;
      --text: #f7f8fa;
      --muted: #b7bec9;
      --shadow: 0 1px 0 rgba(255,255,255,.04);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .preview {
      width: min(1120px, calc(100vw - 64px));
      display: grid;
      gap: 24px;
    }

    .operator-metric {
      --outer-radius: 40px;
      --inset: 2px;
      width: 100%;
      height: 156px;
      display: grid;
      grid-template-columns: 51% 49%;
      padding: var(--inset);
      border: 1px solid var(--card-border);
      border-radius: var(--outer-radius);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .operator-metric__op {
      min-width: 0;
      display: grid;
      place-items: center;
      border: 2px solid var(--op-border);
      border-radius: calc(var(--outer-radius) - var(--inset) - 1px);
      background: var(--op);
      color: var(--text);
      font-size: clamp(28px, 3.2vw, 46px);
      font-weight: 760;
      letter-spacing: .01em;
      line-height: 1;
      white-space: nowrap;
    }

    .operator-metric__value {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 0 28px;
      color: var(--muted);
      font-size: clamp(19px, 2.2vw, 32px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .controls button {
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      color: var(--muted);
      font: 700 14px/1 inherit;
      cursor: pointer;
    }

    .controls button:hover {
      color: var(--text);
      border-color: color-mix(in srgb, var(--text) 28%, transparent);
    }

    @media (max-width: 720px) {
      .preview { width: calc(100vw - 28px); }
      .operator-metric {
        --outer-radius: 28px;
        height: 104px;
        grid-template-columns: 54% 46%;
      }
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="operator-metric" aria-label="Operator name and metric value">
      <div class="operator-metric__op" contenteditable="true" spellcheck="false">Input RMSNorm</div>
      <div class="operator-metric__value" contenteditable="true" spellcheck="false">
        <span>in 0.88</span>
        <span>out 0.98</span>
        <span>γΔ 0.013</span>
      </div>
    </div>
    <div class="controls">
      <button type="button" data-theme-toggle>切换深浅模式</button>
    </div>
  </main>
  <script>
    document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{
      document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
    });
  </script>
</body>
</html>
