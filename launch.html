<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PTO3 Design Lab — 设计原型与交互 Demo 启动台">
  <title>PTO3 Design Lab</title>
  <link rel="icon" type="image/svg+xml" href="./pto-studio-logo.svg">
  <link rel="stylesheet" href="vendor/pto-design-system/tokens/foundation.css">
  <link rel="stylesheet" href="vendor/pto-design-system/tokens/semantic.css">
  <link rel="stylesheet" href="vendor/pto-design-system/tokens/components.css">
  <style>
    :root {
      color-scheme: dark;
      --launch-bg: #080a0f;
      --launch-panel: rgba(19, 22, 31, 0.84);
      --launch-panel-solid: #13161f;
      --launch-elevated: #191d28;
      --launch-border: rgba(255, 255, 255, 0.09);
      --launch-border-strong: rgba(255, 255, 255, 0.16);
      --launch-text: #f3f5f8;
      --launch-muted: #9299a8;
      --launch-dim: #646b78;
      --launch-accent: #a8ff35;
      --launch-accent-soft: rgba(168, 255, 53, 0.12);
      --launch-blue: #7c9dff;
      --launch-purple: #b78cff;
      --launch-radius: 18px;
      --launch-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--launch-text);
      background:
        radial-gradient(circle at 72% -10%, rgba(124, 157, 255, 0.13), transparent 32rem),
        radial-gradient(circle at 16% 20%, rgba(183, 140, 255, 0.08), transparent 28rem),
        var(--launch-bg);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      min-height: 68px;
      padding: 0 30px;
      border-bottom: 1px solid var(--launch-border);
      background: rgba(8, 10, 15, 0.78);
      backdrop-filter: blur(22px) saturate(140%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 270px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(168, 255, 53, 0.34);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(168, 255, 53, 0.18), rgba(124, 157, 255, 0.12));
      box-shadow: inset 0 0 18px rgba(168, 255, 53, 0.06);
      color: var(--launch-accent);
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .brand-copy { display: grid; gap: 1px; }
    .brand-title { font-size: 14px; font-weight: 760; letter-spacing: 0.01em; }
    .brand-subtitle { color: var(--launch-muted); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--launch-border);
      border-radius: 10px;
      color: var(--launch-muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 12px;
      font-weight: 650;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }

    .repo-link:hover {
      border-color: var(--launch-border-strong);
      color: var(--launch-text);
      background: rgba(255, 255, 255, 0.05);
    }

    .layout {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      width: min(1480px, 100%);
      min-height: calc(100vh - 68px);
      margin: 0 auto;
    }

    .sidebar {
      position: sticky;
      top: 68px;
      align-self: start;
      height: calc(100vh - 68px);
      padding: 34px 24px 26px 30px;
      border-right: 1px solid var(--launch-border);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--launch-dim);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .category-list { display: grid; gap: 5px; }

    .category-button {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--launch-muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      text-align: left;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .category-button:hover { color: var(--launch-text); background: rgba(255, 255, 255, 0.035); }

    .category-button.is-active {
      border-color: rgba(168, 255, 53, 0.16);
      color: var(--launch-text);
      background: var(--launch-accent-soft);
    }

    .category-button.is-active .category-icon { color: var(--launch-accent); }

    .category-count {
      min-width: 22px;
      margin-left: auto;
      color: var(--launch-dim);
      font-size: 11px;
      text-align: right;
    }

    .sidebar-note {
      position: absolute;
      right: 24px;
      bottom: 26px;
      left: 30px;
      padding-top: 18px;
      border-top: 1px solid var(--launch-border);
      color: var(--launch-dim);
      font-size: 11px;
      line-height: 1.65;
    }

    .sidebar-note strong { color: var(--launch-muted); font-weight: 650; }

    .main {
      min-width: 0;
      padding: 54px clamp(28px, 4vw, 68px) 72px;
    }

    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 34px;
    }

    .hero-copy { max-width: 680px; }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px;
      color: var(--launch-accent);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      width: 22px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 54px);
      font-weight: 760;
      letter-spacing: -0.045em;
      line-height: 1.04;
    }

    .hero-gradient {
      color: transparent;
      background: linear-gradient(110deg, #fff 0%, #bfc9dc 52%, var(--launch-accent) 120%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .hero-description {
      max-width: 610px;
      margin: 16px 0 0;
      color: var(--launch-muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .hero-stat {
      display: grid;
      min-width: 150px;
      gap: 4px;
      padding: 17px 18px;
      border: 1px solid var(--launch-border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .stat-value { font-size: 30px; font-weight: 780; letter-spacing: -0.04em; }
    .stat-label { color: var(--launch-dim); font-size: 11px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-box {
      position: relative;
      display: flex;
      width: min(440px, 100%);
      align-items: center;
    }

    .search-box .icon {
      position: absolute;
      left: 14px;
      width: 16px;
      height: 16px;
      color: var(--launch-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 66px 0 41px;
      border: 1px solid var(--launch-border);
      border-radius: 11px;
      outline: none;
      color: var(--launch-text);
      background: rgba(255, 255, 255, 0.035);
      font-size: 12px;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .search-input::placeholder { color: var(--launch-dim); }

    .search-input:focus {
      border-color: rgba(168, 255, 53, 0.42);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(168, 255, 53, 0.08);
    }

    .shortcut {
      position: absolute;
      right: 11px;
      padding: 3px 7px;
      border: 1px solid var(--launch-border);
      border-radius: 6px;
      color: var(--launch-dim);
      background: rgba(0, 0, 0, 0.16);
      font-size: 10px;
    }

    .result-count {
      margin-left: auto;
      color: var(--launch-dim);
      font-size: 11px;
      white-space: nowrap;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .demo-card {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--launch-border);
      border-radius: var(--launch-radius);
      outline: none;
      background: linear-gradient(180deg, rgba(25, 29, 40, 0.96), rgba(15, 18, 26, 0.96));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.025);
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .demo-card:hover, .demo-card:focus-visible {
      z-index: 1;
      border-color: rgba(168, 255, 53, 0.28);
      transform: translateY(-4px);
      box-shadow: var(--launch-shadow), 0 0 0 1px rgba(168, 255, 53, 0.06);
    }

    .demo-card.has-variants { cursor: default; }

    .preview {
      position: relative;
      aspect-ratio: 16 / 9;
      margin: 10px 10px 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: #0c0f16;
    }

    .preview::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, transparent 62%, rgba(5, 7, 11, 0.34));
      pointer-events: none;
      content: "";
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b0d12;
      object-fit: cover;
      object-position: top center;
    }

    .preview-badge {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 0 9px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 999px;
      color: #dfffb5;
      background: rgba(7, 10, 14, 0.76);
      backdrop-filter: blur(8px);
      font-size: 10px;
      font-weight: 700;
    }

    .preview-badge::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--launch-accent);
      box-shadow: 0 0 10px rgba(168, 255, 53, 0.7);
      content: "";
    }

    .card-body { display: grid; gap: 12px; padding: 20px 20px 18px; }

    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .card-meta-details {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .category-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--launch-blue);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .category-label::before { width: 14px; height: 1px; background: currentColor; content: ""; }
    .version, .updated-at { color: var(--launch-dim); font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; white-space: nowrap; }
    .updated-at { color: var(--launch-muted); }

    .card-title-row { display: flex; align-items: start; justify-content: space-between; gap: 18px; }
    .card-title { margin: 0; font-size: 19px; font-weight: 720; letter-spacing: -0.025em; }
    .card-subtitle { margin: 5px 0 0; color: var(--launch-dim); font-size: 11px; }

    .launch-arrow {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--launch-border);
      border-radius: 10px;
      color: var(--launch-muted);
      background: rgba(255, 255, 255, 0.025);
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .demo-card:hover .launch-arrow {
      color: #10150a;
      background: var(--launch-accent);
      transform: translate(2px, -2px);
    }

    .card-description {
      min-height: 44px;
      margin: 0;
      color: var(--launch-muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; }

    .demo-variants {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
      align-items: center;
    }

    .variant-label {
      margin-right: 2px;
      color: var(--launch-dim);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .demo-version-link {
      display: inline-flex;
      min-width: 72px;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 19px;
      border: 1px solid var(--launch-border-strong);
      border-radius: 10px;
      color: var(--launch-text);
      background: rgba(255, 255, 255, 0.035);
      font-size: 14px;
      font-weight: 760;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .demo-version-link:hover, .demo-version-link:focus-visible {
      border-color: rgba(168, 255, 53, 0.42);
      color: #10150a;
      background: var(--launch-accent);
      outline: none;
      transform: translateY(-1px);
    }

    .tag {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 0 9px;
      border: 1px solid var(--launch-border);
      border-radius: 7px;
      color: var(--launch-muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 10px;
      font-weight: 650;
    }

    .empty-state {
      display: none;
      min-height: 280px;
      place-items: center;
      border: 1px dashed var(--launch-border-strong);
      border-radius: var(--launch-radius);
      color: var(--launch-muted);
      text-align: center;
    }

    .empty-state.is-visible { display: grid; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--launch-text); font-size: 16px; }
    .empty-state span { color: var(--launch-dim); font-size: 12px; }

    @media (max-width: 980px) {
      .brand { min-width: auto; }
      .brand-copy { display: none; }
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        padding: 22px 24px 0;
        border-right: 0;
      }
      .category-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .category-button { width: auto; min-width: max-content; }
      .sidebar-note, .eyebrow { display: none; }
      .main { padding-top: 38px; }
    }

    @media (max-width: 720px) {
      .topbar { padding: 0 18px; }
      .repo-label { display: none; }
      .main { padding: 34px 18px 54px; }
      .hero { align-items: start; flex-direction: column; }
      .hero-stat { min-width: 130px; }
      .demo-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .result-count { margin-left: 0; }
      .card-meta { align-items: flex-start; flex-wrap: wrap; }
      .card-meta-details { width: 100%; justify-content: space-between; }
    }

    /* 紧凑的目录布局，保留预览与独立入口。 */
    .layout { width: min(1920px, 100%); grid-template-columns: 210px minmax(0, 1fr); }
    .main { padding: 42px clamp(24px, 3vw, 48px) 72px; }
    .hero { margin-bottom: 28px; }
    h1 { font-size: clamp(32px, 3.2vw, 46px); }
    .demo-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .demo-card { border-radius: 15px; }
    .preview { margin: 8px 8px 0; border-radius: 9px; }
    .card-body { gap: 10px; padding: 15px; }
    .card-meta { align-items: flex-start; flex-wrap: wrap; gap: 5px; }
    .card-meta-details { gap: 7px; flex-wrap: wrap; justify-content: flex-start; }
    .card-title { font-size: 16px; line-height: 1.35; }
    .card-subtitle { line-height: 1.5; }
    .card-description { min-height: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .tags { gap: 5px; }
    .tag { min-height: 22px; padding: 0 7px; }
    .demo-variants { display: block; margin: 2px -15px -15px; border-top: 1px solid var(--launch-border); }
    .demo-variants summary { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; color: var(--launch-accent); font-size: 12px; font-weight: 700; cursor: pointer; list-style: none; }
    .demo-variants summary::-webkit-details-marker { display: none; }
    .demo-variants summary:hover, .demo-variants summary:focus-visible { background: var(--launch-accent-soft); outline: none; }
    .demo-variants[open] summary span { transform: rotate(90deg); }
    .variant-list { display: grid; gap: 3px; padding: 0 8px 8px; }
    .demo-version-link { min-width: 0; min-height: 36px; justify-content: space-between; padding: 8px; border-color: transparent; border-radius: 7px; font-size: 12px; font-weight: 600; }
    @media (max-width: 1100px) { .demo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .demo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .main { padding: 34px 18px 54px; } .demo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 500px) { .demo-grid { grid-template-columns: 1fr; } }

    /* 轻量目录：用留白和细线建立层级，让预览成为视觉中心。 */
    :root {
      color-scheme: light;
      --launch-bg: #f7f8fa;
      --launch-panel: #fff;
      --launch-panel-solid: #fff;
      --launch-elevated: #f4f6f8;
      --launch-border: #e7eaee;
      --launch-border-strong: #d7dce3;
      --launch-text: #1c2533;
      --launch-muted: #687484;
      --launch-dim: #8b96a4;
      --launch-accent: #547d22;
      --launch-accent-soft: #edf4e7;
      --launch-blue: #65778e;
      --launch-shadow: 0 12px 28px rgba(32, 47, 63, .08);
    }
    body { background: var(--launch-bg); }
    .topbar { min-height: 62px; background: rgba(255, 255, 255, .88); border-color: #edf0f2; }
    .brand-mark { width: 34px; height: 34px; color: #fff; border: 0; border-radius: 10px; background: #263a2a; box-shadow: none; }
    .brand-title { font-weight: 700; }
    .brand-subtitle { color: #9aa3ae; }
    .repo-link { color: #687484; background: #fff; }
    .repo-link:hover { color: #263a2a; background: #f7f9f7; }
    .layout { min-height: calc(100vh - 62px); }
    .sidebar { top: 62px; height: calc(100vh - 62px); border-color: #edf0f2; }
    .category-button { font-weight: 600; }
    .category-button:hover { background: #eef1f2; }
    .category-button.is-active { border-color: transparent; color: #344b2c; background: #eaf1e6; }
    .category-button.is-active .category-icon { color: #638b3d; }
    .sidebar-note { border-color: #e7eaee; }
    .main { padding-top: 38px; }
    .hero { align-items: center; margin-bottom: 30px; }
    .hero-kicker { color: #71905d; letter-spacing: .11em; }
    .hero-gradient { color: #202c39; background: none; }
    h1 { font-weight: 700; line-height: 1.14; letter-spacing: -.035em; }
    .hero-description { margin-top: 12px; color: #7a8694; }
    .hero-stat { min-width: 125px; padding: 10px 0 10px 22px; border: 0; border-left: 1px solid #dfe5e6; border-radius: 0; background: transparent; }
    .stat-value { color: #344b2c; font-size: 28px; font-weight: 700; }
    .toolbar { padding-top: 20px; border-top: 1px solid #e5e9ec; }
    .search-input { border-color: #e3e8eb; background: #fff; }
    .search-input:focus { border-color: #a8c396; background: #fff; box-shadow: 0 0 0 3px rgba(115, 157, 88, .10); }
    .shortcut { border-color: #e8ecef; background: #f7f8f9; }
    .demo-grid { gap: 18px; }
    .demo-card { border-color: #e8ebee; background: #fff; box-shadow: 0 2px 8px rgba(34, 49, 65, .025); }
    .demo-card:hover, .demo-card:focus-visible { border-color: #c7d8be; box-shadow: var(--launch-shadow); transform: translateY(-3px); }
    .preview { border: 0; background: #edf0f2; }
    .preview::after { background: linear-gradient(180deg, transparent 72%, rgba(18, 27, 35, .10)); }
    .preview-badge { top: 10px; right: 10px; color: #52694b; border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.91); box-shadow: 0 2px 8px rgba(20,30,40,.08); }
    .preview-badge::before { background: #83a96a; box-shadow: none; }
    .card-body { gap: 9px; padding: 16px; }
    .category-label { color: #78916e; letter-spacing: .04em; }
    .category-label::before { width: 9px; }
    .version, .updated-at { color: #9aa3ad; }
    .card-title { color: #263442; font-weight: 700; }

    const collectionByMember = new Map(collections.flatMap((collection) => collection.members.map((title) => [title, collection])));
    const demos = sourceDemos.flatMap((demo) => {
      const collection = collectionByMember.get(demo.title);
      if (!collection) return [demo];
      if (demo.title !== collection.members[0]) return [];
      const members = collection.members.map((title) => sourceDemos.find((item) => item.title === title));
      const variants = members.flatMap((item, index) => item.variants
        ? item.variants.map((variant) => ({ ...variant, label: collection.labels[index] + " · " + variant.label }))
        : [{ label: collection.labels[index], href: item.href }]);
      return [{ ...demo, ...collection, status: variants.length + " 个入口", version: "主题合集", updatedAt: members.map((item) => item.updatedAt).filter(Boolean).sort().pop(), tags: [...new Set(members.flatMap((item) => item.tags))].slice(0, 4), variants, searchText: members.map((item) => [item.title, item.subtitle, item.description, ...item.tags].join(" ")).join(" ") }];
    });

    const categoryIcons = {
      "全部 Demo": "icon-grid",
      "内存与性能": "icon-memory",
      "开发工具": "icon-grid",
      "推理": "icon-flow",
      "Insight": "icon-insight"
    };

    const state = { category: "全部 Demo", query: "" };
    const categoryList = document.querySelector("#categoryList");
    const demoGrid = document.querySelector("#demoGrid");
    const demoSearch = document.querySelector("#demoSearch");
    const resultCount = document.querySelector("#resultCount");
    const emptyState = document.querySelector("#emptyState");
    const demoTotal = document.querySelector("#demoTotal");

    const escapeHtml = (value) => String(value).replace(/[&<>"]/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
    })[char]);

    const categories = ["全部 Demo", ...new Set(demos.map((demo) => demo.category))];

    function renderCategories() {
      categoryList.innerHTML = categories.map((category) => {
        const count = category === "全部 Demo" ? demos.length : demos.filter((demo) => demo.category === category).length;
        const icon = categoryIcons[category] || "icon-grid";
        const active = state.category === category;
        return `
          <button class="category-button${active ? " is-active" : ""}" type="button" data-category="${escapeHtml(category)}" aria-pressed="${active}">
            <svg class="icon category-icon" aria-hidden="true"><use href="#${icon}"></use></svg>
            <span>${escapeHtml(category)}</span>
            <span class="category-count">${count}</span>
          </button>`;
      }).join("");
    }

    function filteredDemos() {
      const query = state.query.trim().toLocaleLowerCase("zh-CN");
      return demos.filter((demo) => {
        const inCategory = state.category === "全部 Demo" || demo.category === state.category;
        const searchable = [demo.title, demo.subtitle, demo.category, demo.description, demo.searchText || "", ...demo.tags, ...(demo.variants || []).map((variant) => variant.label)].join(" ").toLocaleLowerCase("zh-CN");
        return inCategory && (!query || searchable.includes(query));
      });
    }

    function cardTemplate(demo) {
      const tags = demo.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const hasVariants = Array.isArray(demo.variants) && demo.variants.length > 0;
      const cardTag = hasVariants ? "article" : "a";
      const cardAttributes = hasVariants
        ? 'class="demo-card has-variants"'
        : `class="demo-card" href="${escapeHtml(demo.href)}" aria-label="打开 ${escapeHtml(demo.title)}"`;
      const launchArrow = hasVariants
        ? ""
        : '<span class="launch-arrow" aria-hidden="true"><svg class="icon"><use href="#icon-arrow"></use></svg></span>';
      const variants = hasVariants
        ? `<details class="demo-variants"><summary>查看 ${demo.variants.length} 个入口 <span aria-hidden="true">↗</span></summary><div class="variant-list">${demo.variants.map((variant) => `<a class="demo-version-link" href="${escapeHtml(variant.href)}">${escapeHtml(variant.label)} <span aria-hidden="true">↗</span></a>`).join("")}</div></details>`
        : "";
      return `
        <${cardTag} ${cardAttributes}>
          <div class="preview">
            <img src="${escapeHtml(demo.preview)}" alt="${escapeHtml(demo.title)} 预览" loading="lazy">
            <span class="preview-badge">${escapeHtml(demo.status)}</span>
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="category-label">${escapeHtml(demo.category)}</span>
              <div class="card-meta-details">
                <span class="version">${escapeHtml(demo.version)}</span>
                ${demo.updatedAt ? `<time class="updated-at" datetime="${escapeHtml(demo.updatedAt)}">${escapeHtml(demo.updatedAt)}</time>` : ""}
              </div>
            </div>
            <div class="card-title-row">
              <div>
                <h2 class="card-title">${escapeHtml(demo.title)}</h2>
                <p class="card-subtitle">${escapeHtml(demo.subtitle)}</p>
              </div>
              ${launchArrow}
            </div>
            <p class="card-description">${escapeHtml(demo.description)}</p>
            <div class="tags">${tags}</div>
            ${variants}
          </div>
        </${cardTag}>`;
    }

    function render() {
      const visibleDemos = filteredDemos();
      demoGrid.innerHTML = visibleDemos.map(cardTemplate).join("");
      demoGrid.hidden = visibleDemos.length === 0;
      emptyState.classList.toggle("is-visible", visibleDemos.length === 0);
      resultCount.textContent = `${visibleDemos.length} / ${demos.length} 个场景`;
      demoTotal.textContent = String(demos.length).padStart(2, "0");
      renderCategories();
    }

    categoryList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      render();
    });

    demoSearch.addEventListener("input", () => {
      state.query = demoSearch.value;
      render();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "/" && document.activeElement !== demoSearch) {
        event.preventDefault();
        demoSearch.focus();
      }
      if (event.key === "Escape" && document.activeElement === demoSearch) {
        demoSearch.value = "";
        state.query = "";
        demoSearch.blur();
        render();
      }
    });

    render();
  </script>
